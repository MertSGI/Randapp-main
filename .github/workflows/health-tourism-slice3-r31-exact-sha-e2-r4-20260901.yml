          require_uint_counter "DENO_UNEXPECTED_ARGUMENT_COUNT" "${DENO_UNEXPECTED_ARG}"
          set_result "DENO_UNEXPECTED_ARGUMENT_COUNT" "${DENO_UNEXPECTED_ARG}"

