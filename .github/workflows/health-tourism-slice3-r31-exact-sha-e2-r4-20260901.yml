          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;" 2>&1 | tee /tmp/e2-logs/pgtap-extension.log
          echo "PGTAP_EXTENSION_RESULT=PASS" >> /tmp/e2-logs/results.env

          require_uint() {
            name="$1"; value="$2"
            case "$value" in
              ''|*[!0-9]*)
                echo "INVALID_NUMERIC_SCALAR: ${name}='${value}'"
                return 1
                ;;
            esac
          }

          printf '1..2\nok 1 - synthetic pass one\nok 2 - synthetic pass two\n' > /tmp/e2-logs/pgtap-parser-selftest.txt
          SELFTEST_PLAN=$(sed -nE 's/^[[:space:]]*1\.\.([0-9]+)[[:space:]]*$/\1/p' /tmp/e2-logs/pgtap-parser-selftest.txt | head -n 1)
          if [ -z "${SELFTEST_PLAN}" ]; then SELFTEST_PLAN=0; fi

          SELFTEST_COMPLETED=$(awk '/^[[:space:]]*(ok|not ok)[[:space:]]+[0-9]+/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)
          SELFTEST_OK=$(awk '/^[[:space:]]*ok[[:space:]]+[0-9]+/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)
          SELFTEST_NOT_OK=$(awk '/^[[:space:]]*not ok[[:space:]]+[0-9]+/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)
          SELFTEST_MISMATCH=$(awk 'BEGIN{IGNORECASE=1} /Looks like you planned|planned .* but ran|plan mismatch/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)

          require_uint "SELFTEST_PLAN" "${SELFTEST_PLAN}"
          require_uint "SELFTEST_COMPLETED" "${SELFTEST_COMPLETED}"
          require_uint "SELFTEST_OK" "${SELFTEST_OK}"
          require_uint "SELFTEST_NOT_OK" "${SELFTEST_NOT_OK}"
          require_uint "SELFTEST_MISMATCH" "${SELFTEST_MISMATCH}"

          if [ "${SELFTEST_PLAN}" -eq 2 ] && [ "${SELFTEST_COMPLETED}" -eq 2 ] && [ "${SELFTEST_OK}" -eq 2 ] && [ "${SELFTEST_NOT_OK}" -eq 0 ] && [ "${SELFTEST_MISMATCH}" -eq 0 ]; then
            echo "PGTAP_PLAN_PARSER_SELFTEST_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "PGTAP_ZERO_COUNT_PARSER_SELFTEST_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "PGTAP_PARSER_SCALAR_SELFTEST_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "PGTAP_NUMERIC_SCALAR_VALIDATION_RESULT=PASS" >> /tmp/e2-logs/results.env
          else
            echo "PGTAP_PLAN_PARSER_SELFTEST_RESULT=FAIL" >> /tmp/e2-logs/results.env
