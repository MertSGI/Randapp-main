name: LARI Clinic Block 3 Executable Exact-SHA R1 Evidence Gate

on:
  push:
    branches:
      - 'ci/clinic-block3-exact-sha-r1-20260821'

jobs:
  clinic-block3-exact-sha-r1-gate:
    name: Disposable Direct Supabase Postgres QA & Clinic Block 3 Executable Proof R1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Product SHA & Verify Exact Binding
        run: |
          REQUESTED_PRODUCT_SHA="d0f71d71e49ab70408d1ef535f1e4cab904e9030"
          git fetch origin feature/lari-clinic-foundation
          git checkout "${REQUESTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_TEST_WORKTREE_SHA = ${ACTUAL_TEST_WORKTREE_SHA}"
          if [ "${ACTUAL_TEST_WORKTREE_SHA}" != "${REQUESTED_PRODUCT_SHA}" ]; then
            echo "❌ Worktree SHA mismatch! Expected ${REQUESTED_PRODUCT_SHA}, got ${ACTUAL_TEST_WORKTREE_SHA}."
            exit 1
          fi
          echo "✅ Bound to exact requested product SHA: ${ACTUAL_TEST_WORKTREE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          echo "Checking docker availability..."
          docker --version
          docker info >/dev/null 2>&1 || (echo "❌ Docker daemon not running!" && exit 1)
          echo "✅ Docker daemon available."

      - name: Start Pinned Supabase Postgres Container Directly
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres container: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-p2a-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        run: |
          echo "Waiting for direct Postgres port 54322 readiness..."
          for i in {1..30}; do
            if docker exec lari-p2a-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "✅ Direct Postgres ready on attempt ${i}!"
              break
            fi
            echo "Attempt ${i}: Postgres not ready yet..."
            sleep 1
          done

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Execute Disposable Test Compatibility Bootstrap Fixture
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING TEST COMPATIBILITY BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql
          echo "Compatibility bootstrap completed."

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: apply_migrations
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          echo "Migration file count: ${#MIGRATIONS[@]}"
          echo "First migration: ${MIGRATIONS[0]}"
          echo "Last migration: ${MIGRATIONS[-1]}"
          MIGRATION_COUNT=${#MIGRATIONS[@]}
          echo "MIGRATION_REPLAY_COUNT = ${MIGRATION_COUNT}"
          if [ "${MIGRATION_COUNT}" -ne 63 ]; then
            echo "❌ Unexpected migration count! Expected 63, got ${MIGRATION_COUNT}."
            exit 1
          fi

          APPLIED_COUNT=0
          ORDINAL=1
          rm -f /tmp/p2a-applied-migrations.txt /tmp/p2a-failure-summary.txt /tmp/p2a-migration-*.log
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            echo "=== APPLYING [${ORDINAL}/${#MIGRATIONS[@]}] ${migration} ==="
            if ! psql "$DB_URL" \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${migration}" \
              2>&1 | tee "/tmp/p2a-migration-${ORDINAL}.log"; then

              echo "FAILED_MIGRATION_ORDINAL=${ORDINAL}" | tee /tmp/p2a-failure-summary.txt
              echo "FAILED_MIGRATION_FILENAME=${migration}" | tee -a /tmp/p2a-failure-summary.txt
              tail -n 80 "/tmp/p2a-migration-${ORDINAL}.log" | tee -a /tmp/p2a-failure-summary.txt
              exit 1
            fi
            echo "ordinal=${ORDINAL} filename=${migration}" >> /tmp/p2a-applied-migrations.txt
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done
          echo "Successfully applied ${APPLIED_COUNT} migration files."

      - name: Detailed Failure Diagnostic Dump
        if: failure()
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== MIGRATION FAILURE DIAGNOSTIC DUMP ==="
          if [ -f /tmp/p2a-failure-summary.txt ]; then
            echo "--- MIGRATION FAILURE SUMMARY ---"
            cat /tmp/p2a-failure-summary.txt
          fi

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg

      - name: Run Static SQL Security & Contract Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing p2a_tenant_provisioning_static_test.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_static_test.sql
          echo "✅ Static SQL security suite passed."

      - name: Run Sequential DB Integration & RLS Privacy Matrix Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing p2a_tenant_provisioning_integration_tests.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql
          echo "✅ Sequential DB integration & RLS matrix suite passed."

      - name: Run Multi-Session Real DB Concurrency Harness
        run: |
          echo "Executing p2a_concurrency_harness.ts..."
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/p2a_concurrency_harness.ts
          echo "✅ Multi-session real DB concurrency harness passed."

      - name: Run Sequential Package Branch Server Authority Functional SQL Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing package_branch_server_authority_tests.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/package_branch_server_authority_tests.sql
          echo "✅ Package branch server authority functional SQL suite passed."

      - name: Run Package Branch Real Multi-Session Concurrency & RLS Harness
        run: |
          echo "Executing package_branch_concurrency_harness.ts..."
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/package_branch_concurrency_harness.ts
          echo "✅ Package branch real multi-session concurrency & RLS harness passed."

      - name: Run Package Branch Static QA
        run: |
          node scripts/test-package-branch-server-authority.mjs

      - name: Run Branch Booking QA
        run: |
          node scripts/verify-branch-aware-booking.mjs

      - name: Run Clinic Domain Server Authority Static QA
        run: |
          node scripts/test-clinic-domain-server-authority.mjs
          echo "✅ Clinic domain server authority static QA passed."

      - name: Run Clinic Domain Real Multi-Session Concurrency Harness & Verify Markers
        run: |
          echo "Executing clinic_domain_concurrency_harness.ts..."
          set +e
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/clinic_domain_concurrency_harness.ts 2>&1 | tee /tmp/clinic-block1-concurrency.log
          HARNESS_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$HARNESS_EXIT" -ne 0 ]; then
            cat /tmp/clinic-block1-concurrency.log
            exit "$HARNESS_EXIT"
          fi

          grep -F 'HARNESS_AUTH_CONTEXT_PROVEN = YES' /tmp/clinic-block1-concurrency.log
          grep -F 'HARNESS_DB_EXECUTION_OCCURRED = YES' /tmp/clinic-block1-concurrency.log
          grep -F 'HARNESS_REAL_MULTI_SESSION_CONCURRENCY = YES' /tmp/clinic-block1-concurrency.log
          echo "✅ Clinic domain real multi-session concurrency harness passed with all harness-generated markers verified."

      - name: Run Clinic Operational Static QA
        run: |
          node scripts/test-clinic-operational-integration.mjs
          echo "✅ Clinic operational integration static QA passed."

      - name: Run Clinic Block 2 Real Multi-Session Concurrency Harness & Verify Markers
        run: |
          echo "Executing clinic_operational_concurrency_harness.ts..."
          set +e
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/clinic_operational_concurrency_harness.ts 2>&1 | tee /tmp/clinic-block2-concurrency.log
          HARNESS_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$HARNESS_EXIT" -ne 0 ]; then
            echo "=== FAILED CONCURRENCY HARNESS LOG OUTPUT ==="
            cat /tmp/clinic-block2-concurrency.log
            exit "$HARNESS_EXIT"
          fi

          grep -F 'CLINIC_OPERATIONAL_DB_EXECUTION_OCCURRED = YES' /tmp/clinic-block2-concurrency.log
          grep -F 'CLINIC_OPERATIONAL_REAL_CONCURRENCY = YES' /tmp/clinic-block2-concurrency.log
          grep -F 'CORE_OWNER_STATUS_RPC_CONTROL = PASS' /tmp/clinic-block2-concurrency.log
          grep -F 'CLINIC_START_CANCEL_RACE_INVARIANT_PROVEN = YES' /tmp/clinic-block2-concurrency.log
          grep -F 'CLINIC_COMPLETION_CANCEL_RACE_INVARIANT_PROVEN = YES' /tmp/clinic-block2-concurrency.log
          grep -F 'CLINIC_OPERATIONAL_ATOMIC_COMPLETION_PROVEN = YES' /tmp/clinic-block2-concurrency.log
          grep -F 'CLINIC_COMPLETION_OUTBOX_EXACTLY_ONCE_PROVEN = YES' /tmp/clinic-block2-concurrency.log
          echo "✅ Clinic Block 2 real multi-session concurrency harness passed with all harness-generated markers verified."

      - name: Run Clinic Block 3 Workspace Authority Hardening Functional SQL Suite & Verify Markers
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing clinic_workspace_authority_hardening_tests.sql..."
          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_workspace_authority_hardening_tests.sql > /tmp/clinic-block3-sql.log 2>&1
          PSQL_EXIT=$?
          set -e

          LOG_CONTENT=$(cat /tmp/clinic-block3-sql.log)
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Clinic Block 3 SQL Test Log Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$LOG_CONTENT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "=== PSQL COMPLETE LOG DUMP ==="
          echo "$LOG_CONTENT"
          echo "=============================="

          if [ "$PSQL_EXIT" -ne 0 ]; then
            echo "❌ PSQL EXECUTION FAILED WITH EXIT CODE $PSQL_EXIT"
            exit "$PSQL_EXIT"
          fi

          MARKERS=(
            "CLINIC_HARDENING_SECTION1_SETUP_COMPLETE=YES"
            "CLINIC_HARDENING_SECTION2_ACL_COMPLETE=YES"
            "CLINIC_HARDENING_SECTION3_DOMAIN_COMPLETE=YES"
            "CLINIC_HARDENING_SECTION4_ANON_COMPLETE=YES"
            "CLINIC_HARDENING_SECTION5_AUDIT_COMPLETE=YES"
            "CLINIC_PROFILE_MUTATION_MANAGE_ONLY_PROVEN=YES"
            "CLINIC_PROFILE_MUTATION_AUDIT_CANONICAL=YES"
            "CLINIC_PROFILE_RESPONSE_CONTRACT_PROVEN=YES"
            "CLINIC_PROFILE_VIEW_WITHOUT_HISTORY_PROVEN=YES"
            "CLINIC_VIEW_ONLY_MUTATION_DENIED=YES"
            "CLINIC_NO_CAPABILITY_DENIAL_PROVEN=YES"
            "CLINIC_PROFILE_CROSS_TENANT_DENIED=YES"
            "CLINIC_ANON_PROFILE_ACCESS_DENIED=YES"
            "CLINIC_OWNER_SETUP_READ_PROVEN=YES"
            "CLINIC_OWNER_SETUP_CROSS_TENANT_SAFE=YES"
            "CLINIC_BOUNDED_PROFILE_NO_HISTORY_LEAK=YES"
            "CLINIC_INACTIVE_OWNER_SETUP_DENIED=YES"
            "CLINIC_AUTHENTICATED_EXECUTE_ACL_PROVEN=YES"
            "CLINIC_ANON_EXECUTE_ACL_DENIED=YES"
            "CLINIC_WORKSPACE_DB_ROLE_CONTEXT_PROVEN=YES"
            "CLINIC_WORKSPACE_AUTHORITY_HARDENING_DB_EXECUTION=PASS"
          )
          echo "=== VERIFYING MARKERS ==="
          MISSING=0
          for m in "${MARKERS[@]}"; do
            if grep -Fq "$m" /tmp/clinic-block3-sql.log; then
              echo "  [FOUND] $m"
            else
              echo "  [MISSING] $m"
              MISSING=1
            fi
          done

          if [ "$MISSING" = "1" ]; then
            echo "❌ ONE OR MORE MARKERS MISSING!"
            echo "=== COMPLETE LOG CONTENT ==="
            cat /tmp/clinic-block3-sql.log
            echo "============================"
            exit 1
          fi
          echo "✅ Clinic Block 3 workspace authority hardening SQL suite passed with all test-generated markers verified."

      - name: Upload Clinic Block 3 SQL Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-block3-sql-log
          path: /tmp/clinic-block3-sql.log

      - name: Run Clinic Application Contracts Executable QA
        run: |
          node --import tsx scripts/test-clinic-application-contracts.mjs

      - name: Run Clinic Workspace UI & Static QA
        run: |
          node --import tsx scripts/test-clinic-workspace-ui.mjs
          node scripts/test-clinic-workspace-static-contracts.mjs

      - name: Run Full Application QA & Commercial Source-of-Truth Suite
        run: |
          echo "=== RUNNING FULL APPLICATION QA SUITE ==="
          npm run lint
          npm run build
          npm run check:secrets
          npm run qa:data-mode-regression
          npm run qa:commercial-read-contracts
          npm run qa:commercial-legacy-compatibility
          npm run qa:commercial-eligibility-enforcement
          npm run qa:commercial-packaging
          npm run qa:entitlements
          npm run qa:commercial-source-of-truth

      - name: Run Git Diff & Whitespace Check
        run: |
          git diff --check

      - name: Cleanup Disposable Container
        if: always()
        run: |
          echo "Cleaning up disposable postgres container..."
          docker rm -f lari-p2a-postgres || true
