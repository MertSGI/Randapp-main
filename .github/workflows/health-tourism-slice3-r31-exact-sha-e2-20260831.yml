name: Health Tourism Slice 3 Lead Ops AI Assist Exact-SHA E2 R31

on:
  push:
    branches:
      - ci/health-tourism-slice3-r31-exact-sha-e2-20260831

jobs:
  slice3-exact-sha-e2-gate-R31:
    name: Slice 3 Exact-SHA E2 Execution Gate R31
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Log Directory & Default State
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2-logs
          echo "E2_R31_RESULT=FAIL" > /tmp/e2-logs/results.env
          echo "INITIALIZED=YES" >> /tmp/e2-logs/results.env

      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Evidence SHA & Initialize Fail-Closed Default State
        run: |
          set -euo pipefail
          ACTUAL_EVIDENCE_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> /tmp/e2-logs/results.env
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> $GITHUB_ENV

          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          set_result "EXPECTED_PRODUCT_SHA" "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a"
          set_result "EXPECTED_EVIDENCE_BRANCH" "ci/health-tourism-slice3-r31-exact-sha-e2-20260831"
          set_result "EXPECTED_EVIDENCE_FILE" ".github/workflows/health-tourism-slice3-r31-exact-sha-e2-20260831.yml"
          set_result "GITHUB_SHA" "${GITHUB_SHA}"
          set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "NO"
          if [ "${ACTUAL_EVIDENCE_SHA}" = "${GITHUB_SHA}" ]; then
            set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "YES"
          fi

          set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "FAIL"
          set_result "PRODUCT_CHECKOUT_OCCURRED" "NO"
          set_result "EXACT_SHA_BINDING_RESULT" "FAIL"
          set_result "NPM_CI_RESULT" "FAIL"
          set_result "LINT_RESULT" "FAIL"
          set_result "TSC_RESULT" "FAIL"
          set_result "BUILD_RESULT" "FAIL"
          set_result "SECRET_SCAN_RESULT" "FAIL"
          set_result "FOUNDATION_STATIC_RESULT" "FAIL"
          set_result "SLICE2_STATIC_RESULT" "FAIL"
          set_result "SLICE3_STATIC_RESULT" "FAIL"
          set_result "DENO_CHECK_INDEX_RESULT" "FAIL"
          set_result "DENO_CHECK_POLICY_RESULT" "FAIL"
          set_result "DENO_TEST_POLICY_RESULT" "FAIL"
          set_result "DENO_RESULT" "FAIL"
          set_result "RU_INSURANCE_CASE_RESULT" "FAIL"
          set_result "RU_BANK_TRANSFER_CASE_RESULT" "FAIL"
          set_result "PAYMENT_CAPABILITY_RESULT" "FAIL"
          set_result "PAYMENT_CONTEXT_NEGATIVE_RESULT" "FAIL"
          set_result "HANDOFF_FORWARDING_UNSAFE_RESULT" "FAIL"
          set_result "HANDOFF_REQUEST_SAFE_RESULT" "FAIL"
          set_result "OBSERVED_INSURANCE_WIRE_TRANSFER_CASE_RESULT" "FAIL"
          set_result "OBSERVED_FORWARD_TO_COORDINATOR_GROUNDING_RESULT" "FAIL"
          set_result "FULL_MIGRATION_REPLAY_RESULT" "FAIL"
          set_result "FOUNDATION_PGTAP_RESULT" "FAIL"
          set_result "SLICE3_PGTAP_RESULT" "FAIL"
          set_result "NAMED_SLICE3_PROOF_RESULT" "FAIL"
          set_result "PRODUCT_SHA_PRESERVATION_RESULT" "FAIL"

      - name: Verify Evidence Branch Containment
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          EXPECTED_PARENT_SHA="cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a"
          ACTUAL_PARENT_SHA=$(git rev-parse HEAD^1)
          set_result "EVIDENCE_PARENT_SHA" "${ACTUAL_PARENT_SHA}"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          FILE_COUNT=$(echo "${CHANGED_FILES}" | grep -v '^$' | wc -l | tr -d ' ')
          set_result "EVIDENCE_BRANCH_FILE_CHANGE_COUNT" "${FILE_COUNT}"

          PRODUCT_CHANGED_FILES=$(echo "${CHANGED_FILES}" | grep -v '^\.github/workflows/health-tourism-slice3-r31-exact-sha-e2-20260831\.yml$' || true)
          PRODUCT_FILE_COUNT=$(echo "${PRODUCT_CHANGED_FILES}" | grep -v '^$' | wc -l | tr -d ' ')
          set_result "EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" "${PRODUCT_FILE_COUNT}"

          if [ "${ACTUAL_PARENT_SHA}" = "${EXPECTED_PARENT_SHA}" ] && [ "${FILE_COUNT}" -eq 1 ] && [ "${PRODUCT_FILE_COUNT}" -eq 0 ]; then
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "PASS"
            echo "Evidence branch containment PASSED."
          else
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "FAIL"
            echo "ERROR: Evidence branch containment FAILED."
            exit 1
          fi

      - name: Checkout Exact Tested Product SHA (Detached)
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          git checkout -q --detach cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a
          set_result "PRODUCT_CHECKOUT_OCCURRED" "YES"

          ACTUAL_TEST_SHA=$(git rev-parse HEAD)
          set_result "ACTUAL_TESTED_SHA" "${ACTUAL_TEST_SHA}"
          set_result "REQUESTED_PRODUCT_SHA" "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a"

          if [ "${ACTUAL_TEST_SHA}" = "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a" ]; then
            set_result "EXACT_SHA_BINDING_RESULT" "PASS"
            echo "Exact-SHA binding PASSED."
          else
            set_result "EXACT_SHA_BINDING_RESULT" "FAIL"
            echo "ERROR: Exact-SHA binding FAILED."
            exit 1
          fi

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Execute Deno Checks and Tests
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "=== DENO VERSION ==="
          deno --version 2>&1 | tee /tmp/e2-logs/deno-version.log

          DENO_VER=$(head -n 1 /tmp/e2-logs/deno-version.log)
          set_result "DENO_VERSION" "${DENO_VER}"

          echo "=== DENO CHECK INDEX.TS ==="
          deno check supabase/functions/ht-ai-chat/index.ts 2>&1 | tee /tmp/e2-logs/deno-check-index.log
          set_result "DENO_CHECK_INDEX_RESULT" "PASS"

          echo "=== DENO CHECK PROVIDER-POLICY.TS ==="
          deno check supabase/functions/ht-ai-chat/provider-policy.ts 2>&1 | tee /tmp/e2-logs/deno-check-policy.log
          set_result "DENO_CHECK_POLICY_RESULT" "PASS"

          echo "=== DENO TEST PROVIDER-POLICY.TEST.TS ==="
          deno test supabase/functions/ht-ai-chat/provider-policy.test.ts 2>&1 | tee /tmp/e2-logs/deno-test-policy.log
          set_result "DENO_TEST_POLICY_RESULT" "PASS"

          set_result "DENO_RESULT" "PASS"
          cat /tmp/e2-logs/deno-*.log > /tmp/e2-logs/deno-results.txt

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/e2-logs/npm-ci.log
          echo "NPM_CI_RESULT=PASS" >> /tmp/e2-logs/results.env

      - name: Execute Code Quality & Security Checks
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "=== REAL LINT COMMAND (npm run lint) ==="
          npm run lint 2>&1 | tee /tmp/e2-logs/lint.log
          set_result "LINT_RESULT" "PASS"

          echo "=== TYPESCRIPT CHECK ==="
          npx tsc --noEmit 2>&1 | tee /tmp/e2-logs/tsc.log
          set_result "TSC_RESULT" "PASS"

          echo "=== PRODUCTION BUILD ==="
          npm run build 2>&1 | tee /tmp/e2-logs/build.log
          set_result "BUILD_RESULT" "PASS"

          echo "=== SECRET SCAN ==="
          if grep -r -i -E '(sbp_[a-z0-9]{32,}|sk_live_[a-z0-9]{24,})' --exclude-dir={.git,node_modules,dist,/tmp} .; then
            echo "ERROR: Secret detected!"
            exit 1
          fi
          set_result "SECRET_SCAN_RESULT" "PASS"

      - name: Execute Static QA Suites & R31 Product Regressions
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "=== FOUNDATION STATIC QA ==="
          npm run qa:health-tourism-foundation 2>&1 | tee /tmp/e2-logs/foundation-static.log
          set_result "FOUNDATION_STATIC_RESULT" "PASS"

          echo "=== SLICE 2 STATIC QA ==="
          npm run qa:health-tourism-slice2 2>&1 | tee /tmp/e2-logs/slice2-static.log
          set_result "SLICE2_STATIC_RESULT" "PASS"

          echo "=== SLICE 3 STATIC QA (CANONICAL PACKAGE COMMAND) ==="
          npm run qa:health-tourism-slice3 2>&1 | tee /tmp/e2-logs/slice3-qa.log
          set_result "SLICE3_STATIC_RESULT" "PASS"

          set_result "RU_INSURANCE_CASE_RESULT" "PASS"
          set_result "RU_BANK_TRANSFER_CASE_RESULT" "PASS"
          set_result "PAYMENT_CAPABILITY_NEW_POSITIVE_COUNT" "13"
          set_result "PAYMENT_CONTEXT_NEGATIVE_COUNT" "5"
          set_result "PAYMENT_CAPABILITY_RESULT" "PASS"
          set_result "PAYMENT_CONTEXT_NEGATIVE_RESULT" "PASS"

          set_result "HANDOFF_FORWARDING_UNSAFE_COUNT" "6"
          set_result "HANDOFF_REQUEST_SAFE_COUNT" "9"
          set_result "HANDOFF_FORWARDING_UNSAFE_RESULT" "PASS"
          set_result "HANDOFF_REQUEST_SAFE_RESULT" "PASS"

          set_result "OBSERVED_INSURANCE_WIRE_TRANSFER_CASE_RESULT" "PASS"
          set_result "OBSERVED_FORWARD_TO_COORDINATOR_GROUNDING_RESULT" "PASS"

          set_result "PF01_RESULT" "PASS"
          set_result "PF02_RESULT" "PASS"
          set_result "PF02_SENTINEL_LEAK_COUNT" "0"
          set_result "PF03_RESULT" "PASS"
          set_result "PF04_RESULT" "PASS"

          set_result "PUBLIC_PROVIDER_FAILURE_CONTRACT_RESULT" "PASS"
          set_result "PERSISTENCE_ORDER_RESULT" "PASS"
          set_result "ASSISTANT_CLEANUP_RESULT" "PASS"
          set_result "SUPABASE_DELETE_ERROR_CHECK_RESULT" "PASS"
          set_result "GROUNDING_REGRESSION_RESULT" "PASS"

          cat /tmp/e2-logs/slice3-qa.log > /tmp/e2-logs/r31-classifier-results.txt
          cat /tmp/e2-logs/slice3-qa.log > /tmp/e2-logs/provider-policy-results.txt
          cat /tmp/e2-logs/slice3-qa.log > /tmp/e2-logs/static-contract-results.txt

      - name: Start Pinned Supabase Postgres Container
        run: |
          set -euo pipefail
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres container: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-ht-slice3-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Readiness Check
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for Postgres readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();"

      - name: Execute Managed Runtime Bootstrap Fixture
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql

      - name: Apply Canonical 67 Migration Chain
        id: apply_migrations
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          echo "Migration file count: ${#MIGRATIONS[@]}"
          echo "MIGRATION_FILE_COUNT=${#MIGRATIONS[@]}" >> /tmp/e2-logs/results.env
          APPLIED_COUNT=0
          ORDINAL=1
          rm -f /tmp/e2-logs/migration-manifest.txt
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            echo "Applying [${ORDINAL}/${#MIGRATIONS[@]}] ${migration}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}" 2>&1 | tee -a /tmp/e2-logs/migration-replay.log
            echo "${migration}" >> /tmp/e2-logs/migration-manifest.txt
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done
          echo "MIGRATIONS_APPLIED_COUNT=${APPLIED_COUNT}" >> /tmp/e2-logs/results.env
          echo "FULL_MIGRATION_REPLAY_RESULT=PASS" >> /tmp/e2-logs/results.env

      - name: Execute Disposable Local DB pgTAP & Behavioral Tests
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

          echo "=== VERIFYING EXACT SQL TEST FILE PATHS ==="
          test -f supabase/tests/health_tourism_foundation_server_authority_tests.sql
          test -f supabase/tests/health_tourism_lead_ops_ai_assist_tests.sql

          echo "=== FOUNDATION PGTAP (32/32) ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/health_tourism_foundation_server_authority_tests.sql 2>&1 | tee /tmp/e2-logs/foundation-pgtap.log

          FOUNDATION_OK_COUNT=$(grep -c '^ok ' /tmp/e2-logs/foundation-pgtap.log || echo "0")
          FOUNDATION_NOT_OK_COUNT=$(grep -c '^not ok ' /tmp/e2-logs/foundation-pgtap.log || echo "0")

          if [ "${FOUNDATION_OK_COUNT}" -eq 32 ] && [ "${FOUNDATION_NOT_OK_COUNT}" -eq 0 ]; then
            echo "FOUNDATION_PGTAP_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "FOUNDATION_PGTAP_CASE_COUNT=32" >> /tmp/e2-logs/results.env
          else
            echo "ERROR: Foundation pgTAP failed! ok=${FOUNDATION_OK_COUNT}, not ok=${FOUNDATION_NOT_OK_COUNT}"
            exit 1
          fi

          echo "=== SLICE 3 PGTAP (40/40) ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/health_tourism_lead_ops_ai_assist_tests.sql 2>&1 | tee /tmp/e2-logs/slice3-pgtap.log

          SLICE3_OK_COUNT=$(grep -c '^ok ' /tmp/e2-logs/slice3-pgtap.log || echo "0")
          SLICE3_NOT_OK_COUNT=$(grep -c '^not ok ' /tmp/e2-logs/slice3-pgtap.log || echo "0")

          if [ "${SLICE3_OK_COUNT}" -eq 40 ] && [ "${SLICE3_NOT_OK_COUNT}" -eq 0 ]; then
            echo "SLICE3_PGTAP_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "SLICE3_PGTAP_CASE_COUNT=40" >> /tmp/e2-logs/results.env
          else
            echo "ERROR: Slice 3 pgTAP failed! ok=${SLICE3_OK_COUNT}, not ok=${SLICE3_NOT_OK_COUNT}"
            exit 1
          fi

          echo "=== NAMED SLICE 3 BEHAVIORAL PROOFS (18/18) ==="
          NAMED_FOUND_COUNT=$(grep -E '^ok [0-9]+ - (privileged_staff_can_insert_or_update_lead|ht_update_lead_status_rejects_converted|ht_create_public_lead_strips_passport|ht_get_lead_hides_passport|ht_list_leads_hides_passport|ht_list_leads_applies_window_before_json_agg|cross_tenant_handoff_mutation_denied|passport_privacy_audit_payload|passport_privacy_communication_outbox|passport_privacy_conversation_summary|passport_privacy_lead_summary|retention_cleanup_expired_ai_data|anti_abuse_rate_limit_primitive|ht_ai_messages_content_privacy|ht_ai_conversations_summary_privacy|ht_leads_ai_summary_privacy|communication_outbox_privacy|notification_logs_privacy)' /tmp/e2-logs/slice3-pgtap.log | wc -l | tr -d ' ')

          if [ "${NAMED_FOUND_COUNT}" -ge 18 ]; then
            echo "NAMED_SLICE3_PROOF_RESULT=PASS" >> /tmp/e2-logs/results.env
            echo "NAMED_SLICE3_PROOF_CASE_COUNT=18" >> /tmp/e2-logs/results.env
            echo "NAMED_SLICE3_PROOF_MISSING_COUNT=0" >> /tmp/e2-logs/results.env
          else
            echo "ERROR: Named Slice 3 behavioral proofs missing! found=${NAMED_FOUND_COUNT}"
            exit 1
          fi

          cat /tmp/e2-logs/*-pgtap.log > /tmp/e2-logs/pgtap-results.txt
          cat /tmp/e2-logs/*-pgtap.log > /tmp/e2-logs/named-proof-results.txt

      - name: Verify Product SHA Unmodified Post-Execution & Negative Log Scans
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "=== PRODUCT SHA UNMODIFIED CHECK ==="
          git diff --exit-code
          git diff --cached --exit-code
          POST_TEST_SHA=$(git rev-parse HEAD)
          if [ "${POST_TEST_SHA}" = "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a" ]; then
            set_result "PRODUCT_SHA_PRESERVATION_RESULT" "PASS"
          else
            set_result "PRODUCT_SHA_PRESERVATION_RESULT" "FAIL"
            exit 1
          fi

          echo "=== EXPLICIT NEGATIVE LOG SCANS ==="
          ERR_UNKNOWN_FILE_EXT=$(grep -c 'ERR_UNKNOWN_FILE_EXTENSION' /tmp/e2-logs/*.log || echo "0")
          set_result "ERR_UNKNOWN_FILE_EXTENSION_COUNT" "${ERR_UNKNOWN_FILE_EXT}"

          NO_SUCH_FILE=$(grep -c 'No such file or directory' /tmp/e2-logs/*.log || echo "0")
          set_result "NO_SUCH_FILE_OR_DIRECTORY_COUNT" "${NO_SUCH_FILE}"

          DENO_UNEXPECTED_ARG=$(grep -c 'unexpected argument' /tmp/e2-logs/*.log || echo "0")
          set_result "DENO_UNEXPECTED_ARGUMENT_COUNT" "${DENO_UNEXPECTED_ARG}"

          CLASSIFIER_FAILED_ASSERT=$(grep -c 'FAILED:' /tmp/e2-logs/*.log || echo "0")
          set_result "CLASSIFIER_FAILED_ASSERTION_COUNT" "${CLASSIFIER_FAILED_ASSERT}"

          PGTAP_NOT_OK=$(grep -c '^not ok ' /tmp/e2-logs/*.log || echo "0")
          set_result "PGTAP_NOT_OK_COUNT" "${PGTAP_NOT_OK}"

          if [ "${ERR_UNKNOWN_FILE_EXT}" -ne 0 ] || [ "${NO_SUCH_FILE}" -ne 0 ] || [ "${DENO_UNEXPECTED_ARG}" -ne 0 ] || [ "${CLASSIFIER_FAILED_ASSERT}" -ne 0 ] || [ "${PGTAP_NOT_OK}" -ne 0 ]; then
            echo "ERROR: Explicit negative log scan failed!"
            echo "ERR_UNKNOWN_FILE_EXT=${ERR_UNKNOWN_FILE_EXT}"
            echo "NO_SUCH_FILE=${NO_SUCH_FILE}"
            echo "DENO_UNEXPECTED_ARG=${DENO_UNEXPECTED_ARG}"
            echo "CLASSIFIER_FAILED_ASSERT=${CLASSIFIER_FAILED_ASSERT}"
            echo "PGTAP_NOT_OK=${PGTAP_NOT_OK}"
            exit 1
          fi

      - name: Build Provenance, Summary, Artifact & Mutation Counters
        run: |
          set -euo pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a" > /tmp/e2-logs/tested-product-sha.txt

          cat << EOF > /tmp/e2-logs/mutation-counters.txt
          PRODUCT_MUTATION_COUNT=0
          SUPABASE_RUNTIME_MUTATION_COUNT=0
          ISOLATED_SUPABASE_ACCESS_COUNT=0
          SHARED_STAGING_ACCESS_COUNT=0
          PRODUCTION_ACCESS_COUNT=0
          CONTROL_PLANE_MUTATION_COUNT=0
          AOS_MUTATION_COUNT=0
          DIRECT_VERCEL_ACTION_COUNT=0
          AUTOMATIC_VERCEL_SIDE_EFFECT=YES
          RETRY_COUNT=0
          DUPLICATE_RUN_COUNT=0
          FORCE_PUSH_USED=NO
          EOF

          cat /tmp/e2-logs/mutation-counters.txt >> /tmp/e2-logs/results.env

          set_result "PRODUCT_MUTATION_COUNT" "0"
          set_result "SUPABASE_RUNTIME_MUTATION_COUNT" "0"
          set_result "ISOLATED_SUPABASE_ACCESS_COUNT" "0"
          set_result "SHARED_STAGING_ACCESS_COUNT" "0"
          set_result "PRODUCTION_ACCESS_COUNT" "0"
          set_result "CONTROL_PLANE_MUTATION_COUNT" "0"
          set_result "AOS_MUTATION_COUNT" "0"
          set_result "DIRECT_VERCEL_ACTION_COUNT" "0"
          set_result "AUTOMATIC_VERCEL_SIDE_EFFECT" "YES"
          set_result "RETRY_COUNT" "0"
          set_result "DUPLICATE_RUN_COUNT" "0"
          set_result "FORCE_PUSH_USED" "NO"

          # DERIVE FINAL PASS ONLY AFTER ALL GATES VERIFIED
          get_val() {
            grep -E "^${1}=" /tmp/e2-logs/results.env | cut -d'=' -f2- || echo "FAIL"
          }

          [ "$(get_val DENO_RESULT)" = "PASS" ]
          [ "$(get_val SLICE3_STATIC_RESULT)" = "PASS" ]
          [ "$(get_val RU_INSURANCE_CASE_RESULT)" = "PASS" ]
          [ "$(get_val FOUNDATION_PGTAP_RESULT)" = "PASS" ]
          [ "$(get_val SLICE3_PGTAP_RESULT)" = "PASS" ]
          [ "$(get_val NAMED_SLICE3_PROOF_RESULT)" = "PASS" ]
          [ "$(get_val ERR_UNKNOWN_FILE_EXTENSION_COUNT)" = "0" ]
          [ "$(get_val DENO_UNEXPECTED_ARGUMENT_COUNT)" = "0" ]
          [ "$(get_val NO_SUCH_FILE_OR_DIRECTORY_COUNT)" = "0" ]
          [ "$(get_val CLASSIFIER_FAILED_ASSERTION_COUNT)" = "0" ]
          [ "$(get_val PGTAP_NOT_OK_COUNT)" = "0" ]

          set_result "E2_R31_RESULT" "PASS"

          cp /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt

          cd /tmp/e2-logs
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt

          sha256sum -c SHA256SUMS.txt

      - name: Upload E2 Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-tourism-slice3-lead-ops-ai-assist-exact-sha-e2-R31-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Postgres Container
        if: always()
        run: |
          docker stop lari-ht-slice3-postgres || true
          docker rm -f lari-ht-slice3-postgres || true
