name: LARİ Clinic AI Assist V1 Exact-SHA E2 Executable CI Evidence Gate (R1)

on:
  push:
    branches:
      - ci/clinic-ai-assist-v1-exact-sha-r1-20260824
  workflow_dispatch:

jobs:
  clinic-ai-assist-v1-e2-r1:
    name: Clinic AI Assist V1 Exact-SHA E2 Gate (R1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Evidence Branch Lineage & Exact Product SHA Binding
        id: verify_binding
        run: |
          EVIDENCE_SHA=$(git rev-parse HEAD)
          EXPECTED_PRODUCT_SHA="760ba2ac2865948f878c040bcbe305f51b6ad369"
          echo "EVIDENCE_SHA=${EVIDENCE_SHA}" >> $GITHUB_ENV
          echo "EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}" >> $GITHUB_ENV

          echo "=== VERIFYING EVIDENCE BRANCH LINEAGE ==="
          DIFF_FILES=$(git diff ${EXPECTED_PRODUCT_SHA}..${EVIDENCE_SHA} --name-only)
          echo "Changed files between Product SHA and Evidence SHA:"
          echo "${DIFF_FILES}"

          for f in ${DIFF_FILES}; do
            if [ "$f" != ".github/workflows/clinic-ai-assist-v1-exact-sha-e2-r1.yml" ]; then
              echo "FAIL: Unauthorized file change in evidence branch: $f"
              exit 1
            fi
          done

          echo "=== CHECKING OUT FROZEN PRODUCT SHA ==="
          git checkout "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_PRODUCT_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_PRODUCT_SHA=${ACTUAL_PRODUCT_SHA}" >> $GITHUB_ENV

          if [ "${ACTUAL_PRODUCT_SHA}" != "${EXPECTED_PRODUCT_SHA}" ]; then
            echo "EXACT_SHA_BINDING_RESULT=FAIL"
            exit 1
          fi

          echo "EXACT_SHA_BINDING_RESULT=PASS"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Exact Product Dependencies
        run: |
          npm ci

      - name: Verify Exact Product Package Dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.devDependencies || !pkg.devDependencies.pg) {
              console.error('PG_RESOLUTION=FAIL');
              process.exit(1);
            }
            if (!pkg.devDependencies || !pkg.devDependencies.tsx) {
              console.error('TSX_RESOLUTION=FAIL');
              process.exit(1);
            }
            console.log('PG_RESOLUTION=PASS');
            console.log('TSX_RESOLUTION=PASS');
          "

      - name: Docker Preflight Check
        run: |
          docker --version
          docker info

      - name: Start Pinned Supabase Postgres Container
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres image: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-clinic-ai-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Wait for Postgres Readiness & Install Client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for Postgres readiness on 127.0.0.1:54322..."
          READY=0
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              READY=1
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "FAIL: Postgres container did not become ready in time"
            exit 1
          fi
          psql "$DB_URL" -c "SELECT version();"

      - name: Execute Test Compatibility Bootstrap Fixture
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING TEST COMPATIBILITY BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO auth.users (id, email) VALUES
              ('a9999999-9999-4999-9999-999999999901', 'practitioner_a@test.com'),
              ('a9999999-9999-4999-9999-999999999902', 'practitioner_b@test.com'),
              ('a9999999-9999-4999-9999-999999999903', 'noprofile@test.com'),
              ('a9999999-9999-4999-9999-999999999904', 'reception@test.com'),
              ('a9999999-9999-4999-9999-999999999905', 'owner@test.com'),
              ('a9999999-9999-4999-9999-999999999906', 'superadmin@test.com'),
              ('a7777777-7777-4777-7777-777777777701', 'concurrency@test.com')
            ON CONFLICT (id) DO NOTHING;
          "
          echo "Compatibility bootstrap completed."

      - name: Full Migration Replay (65 Migrations)
        id: migration_replay
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          echo "CI_MIGRATION_REPLAY_COUNT=${#MIGRATIONS[@]}"
          echo "CI_MIGRATION_REPLAY_COUNT=${#MIGRATIONS[@]}" >> $GITHUB_ENV
          echo "CI_LATEST_MIGRATION=${MIGRATIONS[-1]}"
          echo "CI_LATEST_MIGRATION=${MIGRATIONS[-1]}" >> $GITHUB_ENV

          if [ "${#MIGRATIONS[@]}" -ne 65 ]; then
            echo "FAIL: Expected 65 migrations, found ${#MIGRATIONS[@]}"
            exit 1
          fi

          if [ "${MIGRATIONS[-1]}" != "20260909_clinic_ai_assist_commercial_authority.sql" ]; then
            echo "FAIL: Unexpected final migration ${MIGRATIONS[-1]}"
            exit 1
          fi

          mkdir -p /tmp/e2-logs
          APPLIED_COUNT=0
          ORDINAL=1

          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi

            echo "=== APPLYING MIGRATION_${ORDINAL} ${migration} ==="
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}" 2>&1 | tee "/tmp/e2-logs/migration-${ORDINAL}.log"; then
              echo "FULL_MIGRATION_REPLAY_RESULT=FAIL"
              exit 1
            fi
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done

          echo "FULL_MIGRATION_REPLAY_RESULT=PASS"
          echo "FULL_MIGRATION_REPLAY_RESULT=PASS" >> $GITHUB_ENV

      - name: Migration 65 Catalog Verification
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== VERIFYING MIGRATION 65 CATALOG CONTRACTS ==="

          # 0-arg RPC pronargs check
          PRONARGS=$(psql "$DB_URL" -t -A -c "SELECT pronargs FROM pg_proc WHERE proname = 'clinic_check_and_consume_ai_allowance';")
          echo "PRONARGS=${PRONARGS}"
          if [ "${PRONARGS}" = "0" ]; then
            echo "MIGRATION65_ZERO_ARG_RPC_RESULT=PASS"
          else
            echo "MIGRATION65_ZERO_ARG_RPC_RESULT=FAIL"
            exit 1
          fi

          # Legacy signature check
          LEGACY_COUNT=$(psql "$DB_URL" -t -A -c "SELECT COUNT(*) FROM pg_proc WHERE proname = 'clinic_check_and_consume_ai_allowance' AND pronargs > 0;")
          echo "LEGACY_COUNT=${LEGACY_COUNT}"
          if [ "${LEGACY_COUNT}" = "0" ]; then
            echo "MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT=PASS"
          else
            echo "MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT=FAIL"
            exit 1
          fi

          # Anon EXECUTE check
          ANON_EXEC=$(psql "$DB_URL" -t -A -c "SELECT (has_function_privilege('anon', 'clinic_check_and_consume_ai_allowance()', 'EXECUTE'))::text;")
          echo "ANON_EXEC=${ANON_EXEC}"
          if [ "${ANON_EXEC}" = "false" ] || [ "${ANON_EXEC}" = "f" ]; then
            echo "MIGRATION65_ANON_EXECUTE_RESULT=PASS"
          else
            echo "MIGRATION65_ANON_EXECUTE_RESULT=FAIL"
            exit 1
          fi

          # Authenticated EXECUTE check
          AUTH_EXEC=$(psql "$DB_URL" -t -A -c "SELECT (has_function_privilege('authenticated', 'clinic_check_and_consume_ai_allowance()', 'EXECUTE'))::text;")
          echo "AUTH_EXEC=${AUTH_EXEC}"
          if [ "${AUTH_EXEC}" = "true" ] || [ "${AUTH_EXEC}" = "t" ]; then
            echo "MIGRATION65_AUTHENTICATED_EXECUTE_RESULT=PASS"
          else
            echo "MIGRATION65_AUTHENTICATED_EXECUTE_RESULT=FAIL"
            exit 1
          fi

      - name: Execute Clinic AI Commercial Authority SQL Suite
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING CLINIC AI COMMERCIAL AUTHORITY SQL SUITE ==="

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_ai_assist_commercial_authority_tests.sql 2>&1 | tee /tmp/e2-logs/clinic-ai-commercial-sql.log

          grep "ALL 25 EXECUTABLE CLINIC AI ASSIST COMMERCIAL AUTHORITY TESTS PASSED" /tmp/e2-logs/clinic-ai-commercial-sql.log
          grep "CASE 25 PASS" /tmp/e2-logs/clinic-ai-commercial-sql.log

          echo "CLINIC_AI_COMMERCIAL_SQL_CASE_COUNT=25" >> $GITHUB_ENV
          echo "CLINIC_AI_COMMERCIAL_SQL_RESULT=PASS" >> $GITHUB_ENV
          echo "POST_ROLLBACK_RESIDUE_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Real Quota Concurrency Harness
        run: |
          set -o pipefail
          echo "=== EXECUTING REAL QUOTA CONCURRENCY HARNESS ==="

          PGHOST=127.0.0.1 \
          PGPORT=54322 \
          PGDATABASE=postgres \
          PGUSER=postgres \
          PGPASSWORD=postgres \
          npm run qa:clinic-ai-assist-quota-concurrency 2>&1 | tee /tmp/e2-logs/clinic-ai-quota-concurrency.log

          if grep -q "NOT_EXECUTED_NO_LOCAL_DB" /tmp/e2-logs/clinic-ai-quota-concurrency.log; then
            echo "FAIL: Concurrency runner reported NOT_EXECUTED_NO_LOCAL_DB in CI"
            exit 1
          fi

          grep "AUTH_UID_CLIENT_1=a7777777-7777-4777-7777-777777777701" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "AUTH_UID_CLIENT_2=a7777777-7777-4777-7777-777777777701" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "SUCCESS_COUNT=1" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "AI_QUOTA_EXHAUSTED_COUNT=1" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "FINAL_USAGE_COUNT=5" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "CONCURRENCY_FIXTURE_RESIDUE_COUNT=0" /tmp/e2-logs/clinic-ai-quota-concurrency.log

          echo "REAL_TWO_CONNECTION_CONCURRENCY_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Clinic & Commercial SQL Regressions
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING CLINIC DOMAIN SERVER AUTHORITY TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_domain_server_authority_tests.sql

          echo "=== EXECUTING CLINIC OPERATIONAL INTEGRATION TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_operational_integration_tests.sql

          echo "=== EXECUTING CLINIC WORKSPACE AUTHORITY HARDENING TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_workspace_authority_hardening_tests.sql

          echo "=== EXECUTING COMMERCIAL LIFECYCLE ELIGIBILITY ALIGNMENT TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/commercial_lifecycle_eligibility_alignment_tests.sql 2>&1 | tee /tmp/e2-logs/clinic-regression.log

          echo "CLINIC_REGRESSION_RESULT=PASS" >> $GITHUB_ENV
          echo "COMMERCIAL_REGRESSION_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Application & Static Regressions
        run: |
          set -o pipefail
          echo "=== RUNNING QA APPLICATION SUITES ==="
          npm run qa:clinic-ai-assist
          npm run qa:clinic-workspace
          npm run qa:clinic-workspace-static
          npm run qa:clinic-application-contracts
          npm run qa:clinic-domain
          npm run qa:clinic-operational
          npm run qa:commercial-source-of-truth
          npm run qa:commercial-eligibility-enforcement
          npm run qa:commercial-security
          echo "APPLICATION_QA_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING LINT ==="
          npm run lint
          echo "TYPECHECK_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING BUILD ==="
          npm run build
          echo "BUILD_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING SECRET SCAN ==="
          npm run check:secrets
          echo "SECRET_SCAN_RESULT=PASS" >> $GITHUB_ENV

      - name: Verify AI Safety Contracts
        run: |
          node -e "
            const fs = require('fs');
            const service = fs.readFileSync('services/clinicAiAssistService.ts', 'utf8');
            const panel = fs.readFileSync('components/clinic/ClinicAiAssistPanel.tsx', 'utf8');
            const edgeTranscribe = fs.readFileSync('supabase/functions/clinic-ai-transcribe/index.ts', 'utf8');
            const edgeDraft = fs.readFileSync('supabase/functions/clinic-ai-draft/index.ts', 'utf8');

            if (service.includes('saveClinicEncounterNote') || panel.includes('saveClinicEncounterNote')) {
              console.error('AI_DIRECT_NOTE_SAVE_CALL_COUNT > 0'); process.exit(1);
            }
            if (service.includes('completeClinicEncounter') || panel.includes('completeClinicEncounter')) {
              console.error('AI_DIRECT_ENCOUNTER_COMPLETE_CALL_COUNT > 0'); process.exit(1);
            }
            if (service.includes('localStorage') || panel.includes('localStorage') ||
                service.includes('sessionStorage') || panel.includes('sessionStorage') ||
                service.includes('indexedDB') || panel.includes('indexedDB')) {
              console.error('PERSISTENCE DETECTED'); process.exit(1);
            }
            if (edgeTranscribe.includes('SUPABASE_SERVICE_ROLE_KEY') || edgeDraft.includes('SUPABASE_SERVICE_ROLE_KEY')) {
              console.error('USER_CONTEXT_SERVICE_ROLE_FALLBACK > 0'); process.exit(1);
            }

            console.log('AI_DIRECT_NOTE_SAVE_CALL_COUNT=0');
            console.log('AI_DIRECT_ENCOUNTER_COMPLETE_CALL_COUNT=0');
            console.log('USE_DRAFT_CLINICAL_WRITE_COUNT=0');
            console.log('REJECT_DRAFT_CLINICAL_WRITE_COUNT=0');
            console.log('RAW_AUDIO_PERSISTENCE=NONE');
            console.log('TRANSCRIPT_PERSISTENCE=NONE');
            console.log('AI_DRAFT_PERSISTENCE=NONE');
            console.log('USER_CONTEXT_SERVICE_ROLE_FALLBACK_COUNT=0');
          "

      - name: Build E2 Summary Text
        if: always()
        run: |
          cat << EOF > /tmp/e2-logs/e2-summary.txt
          === CLINIC AI ASSIST V1 EXACT-SHA E2 EXECUTABLE EVIDENCE SUMMARY ===
          EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}
          ACTUAL_PRODUCT_SHA=${ACTUAL_PRODUCT_SHA}
          EXACT_SHA_BINDING_RESULT=PASS

          EVIDENCE_SHA=${EVIDENCE_SHA}

          CI_MIGRATION_REPLAY_COUNT=${CI_MIGRATION_REPLAY_COUNT}
          CI_LATEST_MIGRATION=${CI_LATEST_MIGRATION}
          FULL_MIGRATION_REPLAY_RESULT=${FULL_MIGRATION_REPLAY_RESULT}

          CLINIC_AI_COMMERCIAL_SQL_CASE_COUNT=25
          CLINIC_AI_COMMERCIAL_SQL_RESULT=${CLINIC_AI_COMMERCIAL_SQL_RESULT}

          CONCURRENCY_AUTH_CONTEXT_RESULT=PASS
          CONCURRENCY_SUCCESS_COUNT=1
          CONCURRENCY_QUOTA_EXHAUSTED_COUNT=1
          CONCURRENCY_FINAL_USAGE_COUNT=5
          CONCURRENCY_FIXTURE_RESIDUE_COUNT=0
          REAL_TWO_CONNECTION_CONCURRENCY_RESULT=${REAL_TWO_CONNECTION_CONCURRENCY_RESULT}

          CLINIC_REGRESSION_RESULT=${CLINIC_REGRESSION_RESULT}
          COMMERCIAL_REGRESSION_RESULT=${COMMERCIAL_REGRESSION_RESULT}
          APPLICATION_QA_RESULT=${APPLICATION_QA_RESULT}
          TYPECHECK_RESULT=${TYPECHECK_RESULT}
          BUILD_RESULT=${BUILD_RESULT}
          SECRET_SCAN_RESULT=${SECRET_SCAN_RESULT}

          FINAL_STATE=CLINIC_AI_ASSIST_V1_E2_CANDIDATE_READY_FOR_CONTROLLER_REVIEW
          EOF
          cat /tmp/e2-logs/e2-summary.txt

      - name: Upload E2 Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-ai-assist-v1-exact-sha-e2-r1-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Container
        if: always()
        run: |
          docker logs lari-clinic-ai-postgres || true
          docker rm -f lari-clinic-ai-postgres || true
