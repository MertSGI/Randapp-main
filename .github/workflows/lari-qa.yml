name: LARI QA

on:
  push:
    branches:
      - "staging/**"
  pull_request:
    branches:
      - main


jobs:
  qa:
    name: Build and QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build

      - name: Supabase staging consistency QA
        run: npm run qa:supabase-staging-consistency

      - name: Stage H1A Commercial Schema Foundation QA
        run: npm run qa:commercial-schema-foundation

      - name: Stage H1A Commercial Plan Version Immutability QA
        run: npm run qa:commercial-plan-version-immutability

      - name: Stage H1A Commercial Read Contracts QA
        run: npm run qa:commercial-read-contracts

      - name: Stage H1A Commercial Security QA
        run: npm run qa:commercial-security

      - name: Stage H1A Commercial Legacy Compatibility QA
        run: npm run qa:commercial-legacy-compatibility

      - name: Stage H1B Commercial Super Admin Mutations QA
        run: npm run qa:commercial-super-admin-mutations

      - name: Stage H1C Commercial Eligibility Enforcement QA
        run: npm run qa:commercial-eligibility-enforcement

      - name: Supabase Auth/RLS bootstrap QA
        run: npm run qa:supabase-auth-rls-bootstrap

      - name: Supabase migration integrity QA
        run: npm run qa:supabase-migration-integrity

      - name: Supabase active migration path QA
        run: npm run qa:supabase-active-migration-path

      - name: Supabase Priority 1 core QA
        run: npm run qa:supabase-priority1-core

      - name: QA Slug Regression
        run: npm run qa:slug-regression

      - name: QA Data Mode Regression
        run: npm run qa:data-mode-regression

      - name: QA Super Admin Availability Regression
        run: npm run qa:superadmin-availability-regression

      - name: QA Admin Security Staging
        env:
          VITE_DATA_MODE: supabase_staging
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run qa:admin-security-staging

      - name: QA Product Flow
        run: npm run qa:product-flow

      - name: QA Subscription Lifecycle
        run: npm run qa:subscription-lifecycle

      - name: QA Payment Security
        run: npm run qa:payment-security

      - name: QA Sandbox Readiness
        run: npm run qa:sandbox-readiness

      - name: QA Payment Run Modes
        run: npm run qa:payment-run-modes

      - name: QA Pilot Demo
        run: npm run qa:pilot-demo

      - name: QA Customer Pilot
        run: npm run qa:customer-pilot

      - name: QA Notifications
        run: npm run qa:notifications

      - name: QA Supabase Schema
        run: npm run qa:supabase-schema

      - name: QA Data Source Adapters
        run: npm run qa:data-source-adapters

      - name: QA Catalog Consistency
        run: npm run qa:catalog-consistency

      - name: QA Booking Consistency
        run: npm run qa:booking-consistency

      - name: Stage H1E-C Fixture SQL Static Contract QA
        run: npm run qa:h1e-c-fixture-sql-contract

      - name: Stage H1E-C Dedicated Tenant Readiness Diagnostic QA
        run: npm run qa:h1e-c-dedicated-tenant-readiness

      - name: Stage H1E-C Dedicated Tenant Fixture Verifier QA
        run: npm run qa:h1e-c-dedicated-tenant-fixture

      - name: Stage H1E-C Credentialed Runner Unit QA
        run: npm run qa:h1e-c-credentialed-runner

      - name: Stage H1E-C Controlled Orchestrator Unit QA
        run: npm run qa:h1e-c-orchestrator

      - name: Stage H1E-C Controlled Browser Harness Unit QA
        run: npm run qa:h1e-c-browser
