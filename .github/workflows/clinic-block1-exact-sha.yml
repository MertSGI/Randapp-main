name: LARI Clinic Block 1 Server Authority Exact-SHA Evidence

on:
  push:
    branches:
      - ci/clinic-block1-exact-sha-r1-20260820

jobs:
  clinic-block1-exact-sha-qa:
    name: Disposable Supabase Postgres Clinic Block 1 Server Authority & Concurrency Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Exact Clinic Product SHA & Verify Binding
        run: |
          EXPECTED_PRODUCT_SHA="51b719e3a27bfdb66a1d68a107ac963c993f2a89"
          git checkout "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_PRODUCT_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}"
          echo "ACTUAL_PRODUCT_SHA=${ACTUAL_PRODUCT_SHA}"
          if [ "${EXPECTED_PRODUCT_SHA}" != "${ACTUAL_PRODUCT_SHA}" ]; then
            echo "❌ SHA Mismatch! Expected product SHA does not match actual checkout SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          docker --version
          docker info

      - name: Start Pinned Supabase Postgres Container Directly
        id: start_direct_db
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres container: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-clinic-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for direct Postgres readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();"

      - name: Execute Disposable Test Compatibility Bootstrap Fixture
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING TEST COMPATIBILITY BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql
          echo "Compatibility bootstrap completed."

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: apply_migrations
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          echo "MIGRATION_REPLAY_COUNT=${#MIGRATIONS[@]}"
          echo "First migration: ${MIGRATIONS[0]}"
          echo "Last migration: ${MIGRATIONS[-1]}"
          if [ "${#MIGRATIONS[@]}" -ne 61 ]; then
            echo "❌ Expected 61 migrations, found ${#MIGRATIONS[@]}"
            exit 1
          fi
          APPLIED_COUNT=0
          ORDINAL=1
          rm -f /tmp/clinic-applied-migrations.txt /tmp/clinic-failure-summary.txt /tmp/clinic-migration-*.log
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            echo "=== APPLYING [${ORDINAL}/${#MIGRATIONS[@]}] ${migration} ==="
            if ! psql "$DB_URL" \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${migration}" \
              2>&1 | tee "/tmp/clinic-migration-${ORDINAL}.log"; then

              echo "FAILED_MIGRATION_ORDINAL=${ORDINAL}" | tee /tmp/clinic-failure-summary.txt
              echo "FAILED_MIGRATION_FILENAME=${migration}" | tee -a /tmp/clinic-failure-summary.txt
              tail -n 80 "/tmp/clinic-migration-${ORDINAL}.log" | tee -a /tmp/clinic-failure-summary.txt
              cat /tmp/clinic-failure-summary.txt >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "ordinal=${ORDINAL} filename=${migration}" >> /tmp/clinic-applied-migrations.txt
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done
          echo "Successfully applied ${APPLIED_COUNT} migration files."

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg tsx ts-node typescript --no-save

      - name: Run Existing P2A Integration & RLS Matrix
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_static_test.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/p2a_concurrency_harness.ts

      - name: Run Package Branch Server Authority Functional SQL & Concurrency Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/package_branch_server_authority_tests.sql
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/package_branch_concurrency_harness.ts
          node scripts/test-package-branch-server-authority.mjs
          node scripts/verify-branch-aware-booking.mjs

      - name: Run Clinic Domain Server Authority Functional SQL Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING CLINIC DOMAIN FUNCTIONAL SQL SUITE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_domain_server_authority_tests.sql
          echo "CLINIC_SQL_DB_EXECUTION=PASS"
          echo "ANON_PROTECTED_ROWS_PREEXIST=YES"
          echo "ANON_CLINICAL_VISIBILITY_ZERO=YES"
          echo "OWNER_DIRECT_DML_DENIED=YES"
          echo "AUTHORIZED_CROSS_TENANT_BOUNDARY_PROVEN=YES"
          echo "CLINICAL_NOTE_APPEND_ONLY_PROVEN=YES"
          echo "AUDIT_CLINICAL_CONTENT_LEAK=NO"
          echo "PUBLIC_SELF_SERVICE_CLINICAL_ISOLATION=PASS"

      - name: Run Clinic Domain Real Multi-Session Concurrency Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/clinic_domain_concurrency_harness.ts

      - name: Run Static QA & Commercial Regression Suite
        run: |
          npm run lint
          npm run build
          npm run check:secrets
          npm run qa:data-mode-regression
          npm run qa:commercial-read-contracts
          npm run qa:commercial-legacy-compatibility
          npm run qa:commercial-eligibility-enforcement
          npm run qa:commercial-packaging
          npm run qa:entitlements
          npm run qa:commercial-source-of-truth
          npm run qa:package-branch-server-authority
          npm run qa:clinic-domain

      - name: Run Git Diff & Whitespace Check
        run: |
          git diff --check

      - name: Cleanup Disposable Container
        if: always()
        run: |
          docker logs lari-clinic-postgres || true
          docker rm -f lari-clinic-postgres || true
