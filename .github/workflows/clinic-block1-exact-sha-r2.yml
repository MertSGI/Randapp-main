name: LARI Clinic Block 1 Executable Exact-SHA R2 Evidence Gate

on:
  push:
    branches:
      - ci/clinic-block1-exact-sha-r2-20260820

jobs:
  clinic-block1-r2-qa:
    name: Disposable Direct Supabase Postgres QA & Clinic Executable Proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Product SHA & Verify Exact Binding
        run: |
          REQUESTED_PRODUCT_SHA="4263df6ca7634f2d8609b9b4ab4ad6ea1e269882"
          git checkout "${REQUESTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_PRODUCT_SHA = ${REQUESTED_PRODUCT_SHA}"
          echo "ACTUAL_PRODUCT_SHA = ${ACTUAL_TEST_WORKTREE_SHA}"
          if [ "${REQUESTED_PRODUCT_SHA}" != "${ACTUAL_TEST_WORKTREE_SHA}" ]; then
            echo "❌ SHA Mismatch! Requested product SHA does not match actual test worktree HEAD."
            exit 1
          fi
          echo "PRODUCT_SHA_BINDING = PASS"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          docker --version
          docker info

      - name: Start Pinned Supabase Postgres Container Directly
        id: start_direct_db
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres container: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-p2a-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        run: |
          echo "Waiting for direct Postgres port 54322 readiness..."
          for i in {1..30}; do
            if docker exec lari-p2a-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "✅ Direct Postgres ready on attempt ${i}!"
              break
            fi
            echo "Attempt ${i}: Postgres not ready yet..."
            sleep 1
          done

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Pre-Bootstrap Raw Container Inspection
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== PRE-BOOTSTRAP RAW CONTAINER INSPECTION ==="
          psql "$DB_URL" -c "SELECT rolname FROM pg_roles WHERE rolname IN ('anon', 'authenticated', 'service_role');"
          psql "$DB_URL" -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'auth';"

      - name: Execute Disposable Test Compatibility Bootstrap Fixture
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING TEST COMPATIBILITY BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql
          echo "Compatibility bootstrap completed."

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: apply_migrations
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          echo "Migration file count: ${#MIGRATIONS[@]}"
          echo "First migration: ${MIGRATIONS[0]}"
          echo "Last migration: ${MIGRATIONS[-1]}"
          MIGRATION_COUNT=${#MIGRATIONS[@]}
          echo "MIGRATION_REPLAY_COUNT = ${MIGRATION_COUNT}"
          if [ "${MIGRATION_COUNT}" -ne 61 ]; then
            echo "❌ Unexpected migration count! Expected 61, got ${MIGRATION_COUNT}."
            exit 1
          fi

          APPLIED_COUNT=0
          ORDINAL=1
          rm -f /tmp/p2a-applied-migrations.txt /tmp/p2a-failure-summary.txt /tmp/p2a-migration-*.log
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            echo "=== APPLYING [${ORDINAL}/${#MIGRATIONS[@]}] ${migration} ==="
            if ! psql "$DB_URL" \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${migration}" \
              2>&1 | tee "/tmp/p2a-migration-${ORDINAL}.log"; then

              echo "FAILED_MIGRATION_ORDINAL=${ORDINAL}" | tee /tmp/p2a-failure-summary.txt
              echo "FAILED_MIGRATION_FILENAME=${migration}" | tee -a /tmp/p2a-failure-summary.txt
              tail -n 80 "/tmp/p2a-migration-${ORDINAL}.log" | tee -a /tmp/p2a-failure-summary.txt
              exit 1
            fi
            echo "ordinal=${ORDINAL} filename=${migration}" >> /tmp/p2a-applied-migrations.txt
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done
          echo "Successfully applied ${APPLIED_COUNT} migration files."

      - name: Detailed Failure Diagnostic Dump
        if: failure()
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== MIGRATION FAILURE DIAGNOSTIC DUMP ==="
          psql "$DB_URL" -c "\dt public.*" || true

      - name: Verify P2A Schema Post-Proof
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== POST-MIGRATION PUBLIC TABLES ==="
          TABLE_COUNT=$(psql "$DB_URL" -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
          echo "Public table count: ${TABLE_COUNT}"
          psql "$DB_URL" -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';"

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg

      - name: Run Static SQL Security & Contract Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing p2a_tenant_provisioning_static_test.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_static_test.sql
          echo "✅ Static SQL security suite passed."

      - name: Run Sequential DB Integration & RLS Privacy Matrix Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing p2a_tenant_provisioning_integration_tests.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql
          echo "✅ Sequential DB integration & RLS matrix suite passed."

      - name: Run Multi-Session Real DB Concurrency Harness
        run: |
          echo "Executing p2a_concurrency_harness.ts..."
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/p2a_concurrency_harness.ts
          echo "✅ Multi-session real DB concurrency harness passed."

      - name: Run Sequential Package Branch Server Authority Functional SQL Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing package_branch_server_authority_tests.sql..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/package_branch_server_authority_tests.sql
          echo "✅ Package branch server authority functional SQL suite passed."

      - name: Run Package Branch Real Multi-Session Concurrency & RLS Harness
        run: |
          echo "Executing package_branch_concurrency_harness.ts..."
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/package_branch_concurrency_harness.ts
          echo "✅ Package branch real multi-session concurrency & RLS harness passed."

      - name: Run Package Branch Static QA
        run: |
          node scripts/test-package-branch-server-authority.mjs

      - name: Run Branch Booking QA
        run: |
          node scripts/verify-branch-aware-booking.mjs

      - name: Run Clinic Domain Server Authority Functional SQL Suite & Verify Markers
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Executing clinic_domain_server_authority_tests.sql..."
          set -o pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_domain_server_authority_tests.sql 2>&1 | tee /tmp/clinic-sql.log

          echo "Verifying test-generated execution markers from SQL output..."
          grep -F 'ANON_PROTECTED_ROWS_PREEXIST=YES' /tmp/clinic-sql.log
          grep -F 'ANON_CLINICAL_VISIBILITY_ZERO=YES' /tmp/clinic-sql.log
          grep -F 'OWNER_DIRECT_DML_DENIED=YES' /tmp/clinic-sql.log
          grep -F 'AUTHORIZED_CROSS_TENANT_BOUNDARY_PROVEN=YES' /tmp/clinic-sql.log
          grep -F 'CLINICAL_NOTE_APPEND_ONLY_PROVEN=YES' /tmp/clinic-sql.log
          grep -F 'AUDIT_CLINICAL_CONTENT_LEAK=NO' /tmp/clinic-sql.log
          grep -F 'PUBLIC_SELF_SERVICE_CLINICAL_ISOLATION=PASS' /tmp/clinic-sql.log
          grep -F 'CLINIC_SQL_DB_EXECUTION=PASS' /tmp/clinic-sql.log
          echo "✅ Clinic domain server authority SQL contract suite passed with all test-generated markers verified."

      - name: Run Clinic Domain Real Multi-Session Concurrency Harness & Verify Markers
        run: |
          echo "Executing clinic_domain_concurrency_harness.ts..."
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/clinic_domain_concurrency_harness.ts 2>&1 | tee /tmp/clinic-concurrency.log

          echo "Verifying test-generated execution markers from SQL output..."
          grep -F 'ANON_PROTECTED_ROWS_PREEXIST=YES' /tmp/clinic-sql.log
          grep -F 'ANON_CLINICAL_VISIBILITY_ZERO=YES' /tmp/clinic-sql.log
          grep -F 'OWNER_DIRECT_DML_DENIED=YES' /tmp/clinic-sql.log
          grep -F 'AUTHORIZED_CROSS_TENANT_BOUNDARY_PROVEN=YES' /tmp/clinic-sql.log
          grep -F 'CLINICAL_NOTE_APPEND_ONLY_PROVEN=YES' /tmp/clinic-sql.log
          grep -F 'AUDIT_CLINICAL_CONTENT_LEAK=NO' /tmp/clinic-sql.log
          grep -F 'PUBLIC_SELF_SERVICE_CLINICAL_ISOLATION=PASS' /tmp/clinic-sql.log
          grep -F 'CLINIC_SQL_DB_EXECUTION=PASS' /tmp/clinic-sql.log
          echo "✅ Clinic domain server authority SQL contract suite passed with all test-generated markers verified."

      - name: Run Clinic Domain Real Multi-Session Concurrency Harness & Verify Markers
        run: |
          echo "Executing clinic_domain_concurrency_harness.ts..."
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@localhost:54322/postgres" npx tsx supabase/tests/clinic_domain_concurrency_harness.ts 2>&1 | tee /tmp/clinic-concurrency.log

          echo "Verifying harness-generated execution markers from output..."
          grep -F 'HARNESS_AUTH_CONTEXT_PROVEN = YES' /tmp/clinic-concurrency.log
          grep -F 'HARNESS_DB_EXECUTION_OCCURRED = YES' /tmp/clinic-concurrency.log
          grep -F 'HARNESS_REAL_MULTI_SESSION_CONCURRENCY = YES' /tmp/clinic-concurrency.log
          echo "✅ Clinic domain real multi-session concurrency harness passed with all harness-generated markers verified."

      - name: Run Clinic Domain Static QA
        run: |
          node scripts/test-clinic-domain-server-authority.mjs

      - name: Run Slice 2 Commercial Source-of-Truth Exact-SHA Suite
        run: |
          echo "=== RUNNING SLICE 2 COMMERCIAL EXACT-SHA SUITE ==="
          npm run lint
          npm run build
          npm run check:secrets
          npm run qa:data-mode-regression
          npm run qa:commercial-read-contracts
          npm run qa:commercial-legacy-compatibility
          npm run qa:commercial-eligibility-enforcement
          npm run qa:commercial-packaging
          npm run qa:entitlements
          npm run qa:commercial-source-of-truth

      - name: Run Git Diff & Whitespace Check
        run: |
          git diff --check

      - name: Cleanup Disposable Container
        if: always()
        run: |
          echo "Cleaning up disposable postgres container..."
          docker rm -f lari-p2a-postgres || true
