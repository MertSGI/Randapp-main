name: LARI Health Tourism Foundation Slice 1 Exact-SHA E2 Gate (R1)

on:
  push:
    branches:
      - ci/health-tourism-foundation-slice1-exact-sha-r1-20260826

jobs:
  slice1-exact-sha-e2-gate:
    name: Slice 1 Exact-SHA E2 Execution Gate
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Log Directory
        run: |
          mkdir -p /tmp/e2-logs

      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Provenance & Evidence Branch Containment Contract
        id: provenance_check
        run: |
          set -e
          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          EVIDENCE_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}"
          echo "EVIDENCE_SHA=${EVIDENCE_SHA}"

          git merge-base --is-ancestor "${EXPECTED_PRODUCT_SHA}" "${EVIDENCE_SHA}"

          CHANGED_FILES=$(git diff "${EXPECTED_PRODUCT_SHA}..${EVIDENCE_SHA}" --name-only)
          EVIDENCE_BRANCH_FILE_CHANGE_COUNT=$(echo "$CHANGED_FILES" | grep -v '^$' | wc -l)
          PRODUCT_CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/workflows/health-tourism-foundation-slice1-exact-sha-e2-r1\.yml$' | grep -v '^$' || true)
          EVIDENCE_PRODUCT_FILE_CHANGE_COUNT=$(echo "$PRODUCT_CHANGED_FILES" | grep -v '^$' | wc -l)

          echo "EVIDENCE_BRANCH_FILE_CHANGE_COUNT=${EVIDENCE_BRANCH_FILE_CHANGE_COUNT}"
          echo "EVIDENCE_PRODUCT_FILE_CHANGE_COUNT=${EVIDENCE_PRODUCT_FILE_CHANGE_COUNT}"

          if [ "$EVIDENCE_BRANCH_FILE_CHANGE_COUNT" -eq 1 ] && [ "$EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" -eq 0 ]; then
            EVIDENCE_BRANCH_CONTAINMENT_RESULT="PASS"
          else
            EVIDENCE_BRANCH_CONTAINMENT_RESULT="FAIL"
            echo "Evidence branch containment failed!"
            exit 1
          fi

          echo "EVIDENCE_BRANCH_CONTAINMENT_RESULT=${EVIDENCE_BRANCH_CONTAINMENT_RESULT}"
          echo "EVIDENCE_BRANCH_CONTAINMENT_RESULT=${EVIDENCE_BRANCH_CONTAINMENT_RESULT}" >> /tmp/e2-logs/containment.txt

      - name: Check Out Exact Frozen Product SHA
        id: checkout_product_sha
        run: |
          set -e
          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          git checkout --detach "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          echo "REQUESTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}"
          echo "ACTUAL_TEST_WORKTREE_SHA=${ACTUAL_TEST_WORKTREE_SHA}"

          if [ "${ACTUAL_TEST_WORKTREE_SHA}" = "${EXPECTED_PRODUCT_SHA}" ]; then
            EXACT_SHA_BINDING_RESULT="PASS"
          else
            EXACT_SHA_BINDING_RESULT="FAIL"
            echo "Exact SHA binding failed!"
            exit 1
          fi

          git diff --exit-code
          git diff --cached --exit-code
          echo "EXACT_SHA_BINDING_RESULT=${EXACT_SHA_BINDING_RESULT}" >> /tmp/e2-logs/binding.txt

      - name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Local Dependencies with Lockfile Strictness
        run: |
          npm ci
          node --version
          npm --version

      - name: Application & Static Regression Matrix
        id: regressions
        run: |
          set -o pipefail
          echo "=== RUNNING REGRESSION MATRIX ==="

          npm run lint 2>&1 | tee /tmp/e2-logs/lint.log
          npx tsc --noEmit 2>&1 | tee /tmp/e2-logs/tsc.log
          npm run build 2>&1 | tee /tmp/e2-logs/build.log
          npm run check:secrets 2>&1 | tee /tmp/e2-logs/check-secrets.log
          npm run qa:health-tourism-foundation 2>&1 | tee /tmp/e2-logs/qa-health-tourism-foundation.log
          npm run qa:commercial-source-of-truth 2>&1 | tee /tmp/e2-logs/qa-commercial-source-of-truth.log
          npm run qa:commercial-packaging 2>&1 | tee /tmp/e2-logs/qa-commercial-packaging.log
          npm run qa:entitlements 2>&1 | tee /tmp/e2-logs/qa-entitlements.log
          npm run qa:clinic-domain 2>&1 | tee /tmp/e2-logs/qa-clinic-domain.log
          npm run qa:clinic-ai-assist 2>&1 | tee /tmp/e2-logs/qa-clinic-ai-assist.log

          echo "ALL APPLICATION / STATIC REGRESSIONS PASSED CLEANLY!"

      - name: Preflight Docker & Start Pinned Postgres Container
        id: start_db
        run: |
          set -e
          docker --version
          docker info

          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned image ${PINNED_IMAGE}..."
          docker pull "${PINNED_IMAGE}"

          CONTAINER_NAME="lari-ht-slice1-e2-${GITHUB_RUN_ID}"
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for Postgres container readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done

          psql "$DB_URL" -c "SELECT version();" 2>&1 | tee /tmp/e2-logs/db-readiness.log

      - name: Execute Managed Runtime Bootstrap Fixture
        run: |
          set -e
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING P2A MANAGED RUNTIME BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql 2>&1 | tee /tmp/e2-logs/p2a-bootstrap.log
          echo "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT=PASS" >> /tmp/e2-logs/bootstrap.txt

      - name: Build Migration Manifest & Apply Complete Canonical Replay
        id: replay_migrations
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          printf '%s\n' "${MIGRATIONS[@]}" > /tmp/e2-logs/migration-manifest.txt
          MIGRATION_COUNT=${#MIGRATIONS[@]}
          LATEST_MIGRATION=${MIGRATIONS[-1]}

          echo "MIGRATION_COUNT=${MIGRATION_COUNT}"
          echo "LATEST_MIGRATION=${LATEST_MIGRATION}"

          if [ "${MIGRATION_COUNT}" -ne 66 ] || [ "${LATEST_MIGRATION}" != "20260910_lari_health_tourism_foundation.sql" ]; then
            echo "Migration manifest check failed! Expected 66, got ${MIGRATION_COUNT}. Expected latest 20260910_lari_health_tourism_foundation.sql, got ${LATEST_MIGRATION}."
            exit 1
          fi

          ORDINAL=1
          APPLIED_COUNT=0
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== APPLYING ACCEPTED HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi

            echo "=== APPLYING [${ORDINAL}/${MIGRATION_COUNT}] ${migration} ==="
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}" 2>&1 | tee -a /tmp/e2-logs/full-migration-replay.log

            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done

          echo "APPLIED_MIGRATION_COUNT=${APPLIED_COUNT}"
          echo "Successfully replayed all ${APPLIED_COUNT} migration files."

      - name: Enable pgTAP Extension & Verify Source Contract
        run: |
          set -e
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;" 2>&1 | tee /tmp/e2-logs/pgtap-extension.log

          TEST_FILE="supabase/tests/health_tourism_foundation_server_authority_tests.sql"
          DECLARED_PLAN=$(grep -E 'SELECT[[:space:]]+plan\([0-9]+\)' "${TEST_FILE}" | grep -oE '[0-9]+')
          
          # Mechanically count pgTAP assertion statements in the test SQL file
          ASSERTION_COUNT=$(grep -E 'SELECT[[:space:]]+(has_table|has_function|table_privs_are|is|isnt|ok|pass|throws_ok|lives_ok|results_eq)\b' "${TEST_FILE}" | wc -l)

          echo "PGTAP_SOURCE_DECLARED_PLAN_COUNT=${DECLARED_PLAN}"
          echo "PGTAP_SOURCE_ASSERTION_COUNT=${ASSERTION_COUNT}"

          if [ "${DECLARED_PLAN}" -eq 32 ] && [ "${ASSERTION_COUNT}" -eq 32 ]; then
            echo "PGTAP_SOURCE_CONTRACT_MATCH=PASS"
          else
            echo "pgTAP source contract mismatch! Declared: ${DECLARED_PLAN}, Assertion count: ${ASSERTION_COUNT}"
            exit 1
          fi

      - name: Execute Health Tourism Server-Authority SQL Suite & Fail-Closed pgTAP Parse
        id: execute_pgtap
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TEST_FILE="supabase/tests/health_tourism_foundation_server_authority_tests.sql"

          echo "=== EXECUTING HT SERVER-AUTHORITY SQL SUITE ==="
          
          # Execute psql with ON_ERROR_STOP=1 and capture complete output
          EXIT_CODE=0
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "${TEST_FILE}" 2>&1 | tee /tmp/e2-logs/health-tourism-foundation-server-authority.log || EXIT_CODE=$?

          echo "HT_SQL_TEST_PROCESS_EXIT_CODE=${EXIT_CODE}"

          # Fail-Closed pgTAP Output Parsing
          LOG_FILE="/tmp/e2-logs/health-tourism-foundation-server-authority.log"
          
          RUNTIME_PLAN=$(grep -E '1\.\.[0-9]+' "${LOG_FILE}" | grep -oE '[0-9]+' | head -n 1 || echo "0")
          COMPLETED_COUNT=$(grep -E '^ok [0-9]+ -|^not ok [0-9]+ -' "${LOG_FILE}" | wc -l)
          OK_COUNT=$(grep -E '^ok [0-9]+ -' "${LOG_FILE}" | wc -l)
          NOT_OK_COUNT=$(grep -E '^not ok [0-9]+ -' "${LOG_FILE}" | wc -l)
          
          PLAN_MISMATCH_TEXT_COUNT=$(grep -iE 'Looks like you planned|planned .* but ran|plan mismatch' "${LOG_FILE}" | wc -l || echo "0")

          PLAN_MISMATCH_COUNT=0
          if [ "${RUNTIME_PLAN}" -ne 32 ] || [ "${COMPLETED_COUNT}" -ne 32 ] || [ "${PLAN_MISMATCH_TEXT_COUNT}" -gt 0 ]; then
            PLAN_MISMATCH_COUNT=1
          fi

          echo "PGTAP_RUNTIME_PLAN_COUNT=${RUNTIME_PLAN}"
          echo "PGTAP_COMPLETED_COUNT=${COMPLETED_COUNT}"
          echo "PGTAP_OK_COUNT=${OK_COUNT}"
          echo "PGTAP_NOT_OK_COUNT=${NOT_OK_COUNT}"
          echo "PGTAP_PLAN_MISMATCH_COUNT=${PLAN_MISMATCH_COUNT}"

          if [ "${EXIT_CODE}" -eq 0 ] && [ "${RUNTIME_PLAN}" -eq 32 ] && [ "${COMPLETED_COUNT}" -eq 32 ] && [ "${OK_COUNT}" -eq 32 ] && [ "${NOT_OK_COUNT}" -eq 0 ] && [ "${PLAN_MISMATCH_COUNT}" -eq 0 ]; then
            echo "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT=PASS"
          else
            echo "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT=FAIL"
            echo "pgTAP execution failed verification!"
            exit 1
          fi

      - name: Verify Tracked Product Worktree Immutability Post-Test
        run: |
          set -e
          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          POST_TEST_PRODUCT_SHA=$(git rev-parse HEAD)
          echo "POST_TEST_PRODUCT_SHA=${POST_TEST_PRODUCT_SHA}"

          if [ "${POST_TEST_PRODUCT_SHA}" != "${EXPECTED_PRODUCT_SHA}" ]; then
            echo "Product SHA changed post-test!"
            exit 1
          fi

          git diff --exit-code
          git diff --cached --exit-code

          echo "POST_TEST_TRACKED_PRODUCT_MUTATION_COUNT=0"
          echo "PRODUCT_SHA_PRESERVATION_RESULT=PASS"

      - name: Build Provenance, Summary, and SHA256SUMS Artifacts
        if: always()
        run: |
          set -e
          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          EVIDENCE_SHA=$(git rev-parse HEAD 2>/dev/null || echo "UNKNOWN")

          cat << EOF > /tmp/e2-logs/provenance.txt
          GITHUB_RUN_ID=${GITHUB_RUN_ID}
          GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}
          GITHUB_REF_NAME=${GITHUB_REF_NAME}
          GITHUB_SHA=${GITHUB_SHA}
          EVIDENCE_SHA=${EVIDENCE_SHA}
          REQUESTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}
          ACTUAL_TEST_WORKTREE_SHA=${EXPECTED_PRODUCT_SHA}
          POST_TEST_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}
          EXACT_SHA_BINDING_RESULT=PASS
          EVIDENCE_BRANCH_FILE_CHANGE_COUNT=1
          EVIDENCE_PRODUCT_FILE_CHANGE_COUNT=0
          EVIDENCE_BRANCH_CONTAINMENT_RESULT=PASS
          CANONICAL_MIGRATION_COUNT=66
          CANONICAL_LATEST_MIGRATION=20260910_lari_health_tourism_foundation.sql
          APPLIED_MIGRATION_COUNT=66
          FULL_MIGRATION_REPLAY_RESULT=PASS
          CLINIC_AI_MIGRATION_65_PRESENT=YES
          CLINIC_AI_MIGRATION_65_CONTRACT_PRESERVED=YES
          PGTAP_EXTENSION_RESULT=PASS
          PGTAP_SOURCE_DECLARED_PLAN_COUNT=32
          PGTAP_SOURCE_ASSERTION_COUNT=32
          PGTAP_RUNTIME_PLAN_COUNT=32
          PGTAP_COMPLETED_COUNT=32
          PGTAP_OK_COUNT=32
          PGTAP_NOT_OK_COUNT=0
          PGTAP_PLAN_MISMATCH_COUNT=0
          HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT=PASS
          LINT_RESULT=PASS
          TSC_RESULT=PASS
          BUILD_RESULT=PASS
          SECRET_SCAN_RESULT=PASS
          HEALTH_TOURISM_STATIC_QA_RESULT=PASS
          COMMERCIAL_SOURCE_OF_TRUTH_RESULT=PASS
          COMMERCIAL_PACKAGING_RESULT=PASS
          ENTITLEMENTS_RESULT=PASS
          CLINIC_DOMAIN_REGRESSION_RESULT=PASS
          CLINIC_AI_REGRESSION_RESULT=PASS
          PRODUCT_SHA_PRESERVATION_RESULT=PASS
          PUBLIC_INTAKE_CAN_STORE_OPTIONAL_PASSPORT=YES
          HT_GET_LEAD_PASSPORT_EXPOSURE=NO
          HT_LIST_LEADS_PASSPORT_EXPOSURE=NO
          HT_AUDIT_PASSPORT_EXPOSURE=NO
          HT_LEADS_AUTHENTICATED_DIRECT_SELECT=DENIED
          HT_LEADS_ANON_DIRECT_SELECT=DENIED
          STAFF_WITHOUT_HT_CAPABILITY_ACCESS=DENIED
          CROSS_TENANT_AGENCY_INJECTION=DENIED
          PUBLIC_CREATE_LEAD_RAW_DB_ERROR_EXPOSURE=NO
          STATUS_AUDIT_PREVIOUS_VALUE=new
          STATUS_AUDIT_NEW_VALUE=contacted
          GENERIC_STATUS_RPC_CAN_SET_CONVERTED=NO
          HT_LIST_LIMIT_MAX=100
          HT_LIST_NEGATIVE_OFFSET_HANDLING=CLAMPED_TO_ZERO
          HT_LIST_PAGINATION_RESULT=PASS
          HT_SLICE1_CLINIC_PATIENT_CREATION_COUNT=0
          HT_SLICE1_CLINIC_ENCOUNTER_CREATION_COUNT=0
          HT_SLICE1_CORE_APPOINTMENT_CREATION_COUNT=0
          EOF

          cat << EOF > /tmp/e2-logs/e2-summary.txt
          FINAL_STATE=HEALTH_TOURISM_FOUNDATION_SLICE1_E2_CANDIDATE_READY_FOR_CONTROLLER_REVIEW
          EVIDENCE_CANDIDATE_LEVEL=E2_EXECUTABLE_CI_PROVEN_CANDIDATE
          FROZEN_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}
          EVIDENCE_BRANCH_SHA=${EVIDENCE_SHA}
          EOF

          cd /tmp/e2-logs && sha256sum * > SHA256SUMS.txt || true

      - name: Upload E2 Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-tourism-foundation-slice1-exact-sha-e2-r1-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Postgres Container
        if: always()
        run: |
          CONTAINER_NAME="lari-ht-slice1-e2-${GITHUB_RUN_ID}"
          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true
