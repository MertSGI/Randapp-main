name: LARI Slug & TypeScript Qualification

on:
  pull_request:
    branches:
      - 'review/lari-*'
  push:
    branches:
      - 'release/lari-v1a-slug-rc-*'

permissions:
  contents: read

jobs:
  qualification:
    name: TypeScript Build & Slug Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Slug Normalization & Collision Regression
        run: node scripts/test-slug-regression.mjs

      - name: Site Provisioning Readiness Verification
        run: node scripts/verify-site-provisioning-and-manual-sales.mjs
