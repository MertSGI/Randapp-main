          check_exact "PGTAP_COMPLETED_COUNT" "32"
          check_exact "PGTAP_OK_COUNT" "32"
          check_exact "PGTAP_NOT_OK_COUNT" "0"
          check_exact "PGTAP_PLAN_MISMATCH_COUNT" "0"
          check_exact "FOUNDATION_NAMED_BEHAVIORAL_PROOF_REQUIRED_COUNT" "17"
          check_exact "FOUNDATION_NAMED_BEHAVIORAL_PROOF_OK_COUNT" "17"
          check_exact "FOUNDATION_NAMED_BEHAVIORAL_PROOF_RESULT" "PASS"
          check_exact "NAMED_BEHAVIORAL_PROOF_REQUIRED_COUNT" "17"
          check_exact "NAMED_BEHAVIORAL_PROOF_OK_COUNT" "17"
          check_exact "NAMED_BEHAVIORAL_PROOF_RESULT" "PASS"
          check_exact "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_FINAL_STATE" "O"
          check_exact "PRODUCT_SHA_PRESERVATION_RESULT" "PASS"
          check_exact "POST_TEST_TRACKED_PRODUCT_MUTATION_COUNT" "0"
          check_exact "PROVENANCE_HARDCODED_EXECUTABLE_PASS_COUNT" "0"
          check_exact "PROVENANCE_EVIDENCE_SHA_MATCHES_REMOTE_EVIDENCE_SHA" "YES"
          check_exact "ARTIFACT_SHA256_MANIFEST_SELF_EXCLUDED" "YES"
          check_exact "S2_01_EXACT_PRODUCT_SHA" "PASS"
          check_exact "S2_02_ZERO_PRODUCT_MUTATION" "PASS"
          check_exact "S2_03_NODE_INSTALL" "PASS"
          check_exact "S2_04_TYPESCRIPT" "PASS"
          check_exact "S2_05_BUILD" "PASS"
          check_exact "S2_06_SECRET_SCAN" "PASS"
          check_exact "S2_07_FIVE_LANGUAGE_PARITY" "PASS"
          check_exact "S2_08_PUBLIC_ROUTE_AUTHORITY" "PASS"
          check_exact "S2_09_CUSTOM_DOMAIN_HOST_AUTHORITY" "PASS"
          check_exact "S2_10_PUBLICATION_GATE" "PASS"
          check_exact "S2_11_ATTRIBUTION" "PASS"
          check_exact "S2_12_COUNTRY_VALIDATION" "PASS"
          check_exact "S2_13_ACCESSIBILITY_CONTRACT" "PASS"
          check_exact "S2_14_PASSPORT_PRIVACY" "PASS"
          check_exact "S2_15_NO_DIRECT_HT_DML" "PASS"
          check_exact "S2_16_FOUNDATION_66_MIGRATIONS" "PASS"
          check_exact "S2_17_FOUNDATION_PGTAP_32_OF_32" "PASS"
          check_exact "S2_18_UPSTREAM_REGRESSION_MATRIX" "PASS"
          check_exact "S2_19_EVIDENCE_PROVENANCE" "PASS"
          check_exact "S2_20_ARTIFACT_SELF_CHECK" "PASS"
          check_exact "NAMED_CHECK_EXPECTED" "20"
          check_exact "NAMED_CHECK_ACTUAL" "20"
          check_exact "NAMED_CHECK_PASSED" "20"
          check_exact "NAMED_CHECK_FAILED" "0"
          check_exact "NAMED_CHECK_NOT_EXECUTED" "0"

          if [ "${MISMATCHES}" -eq 0 ]; then
            FINAL_STATE="HEALTH_TOURISM_SLICE2_E2_R5_CANDIDATE_READY_FOR_CONTROLLER_REVIEW"
            EVIDENCE_LEVEL="E2_EXECUTABLE_CANDIDATE"
          else
            FINAL_STATE="HEALTH_TOURISM_SLICE2_E2_R5_EXECUTION_FAILED_OR_INCOMPLETE"
            EVIDENCE_LEVEL="E1_SOURCE_PROVEN_CANDIDATE"
          fi

          set_result "FINAL_STATE" "${FINAL_STATE}"
          set_result "EVIDENCE_CANDIDATE_LEVEL" "${EVIDENCE_LEVEL}"

          # Copy final results.env to provenance.txt and verify exact identity BEFORE hashing!
          cp /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt
          cmp -s /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt

          cat << EOF > /tmp/e2-logs/e2-summary.txt
          FINAL_STATE=${FINAL_STATE}
          EVIDENCE_CANDIDATE_LEVEL=${EVIDENCE_LEVEL}
          FROZEN_PRODUCT_SHA=6e8d423083d44510c8446c7a858c26d1555cac0c
          EVIDENCE_SHA=${ACTUAL_EV_SHA}
          EOF

          # Generate SHA256SUMS.txt LAST while excluding SHA256SUMS.txt itself. ZERO writes to payload files afterward!
          cd /tmp/e2-logs
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt

          # Verify SHA256SUMS manifest immediately
          sha256sum -c SHA256SUMS.txt
          echo "ARTIFACT_SHA256_FULL_VERIFICATION=PASS"

      - name: Upload E2 Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-tourism-slice2-public-intake-exact-sha-e2-r5-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Postgres Container
        if: always()
        run: |
          CONTAINER_NAME="lari-ht-slice2-e2-r5-${GITHUB_RUN_ID}"
          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true
