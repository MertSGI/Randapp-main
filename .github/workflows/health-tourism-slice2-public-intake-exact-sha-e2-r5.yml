            /^[[:space:]]*ok[[:space:]]+[0-9]+[[:space:]]+-[[:space:]]+ht_list_leads handles real row pagination/ { c++ }
            /^[[:space:]]*ok[[:space:]]+[0-9]+[[:space:]]+-[[:space:]]+Direct table SELECT on public.ht_leads denied for authenticated role/ { c++ }
