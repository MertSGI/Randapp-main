          SELFTEST_COMPLETED=$(awk '/^[[:space:]]*(ok|not ok)[[:space:]]+[0-9]+/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)
          SELFTEST_OK=$(awk '/^[[:space:]]*ok[[:space:]]+[0-9]+/ { c++ } END { print c+0 }' /tmp/e2-logs/pgtap-parser-selftest.txt)
