name: Health Tourism Slice 2 Public Intake Exact-SHA E2 R5

on:
  push:
    branches:
      - ci/health-tourism-slice2-public-intake-exact-sha-r5-20260827

jobs:
  slice2-exact-sha-e2-gate-r5:
    name: Slice 2 Exact-SHA E2 Execution Gate R5
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Log Directory
        run: |
          mkdir -p /tmp/e2-logs
          echo "INITIALIZED=YES" > /tmp/e2-logs/results.env

      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Evidence SHA & Initialize Fail-Closed Default State
        run: |
          set -e
          ACTUAL_EVIDENCE_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}"
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> /tmp/e2-logs/results.env
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> $GITHUB_ENV

          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          set_result "GITHUB_SHA" "${GITHUB_SHA}"
          set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "NO"
          if [ "${ACTUAL_EVIDENCE_SHA}" = "${GITHUB_SHA}" ]; then
            set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "YES"
          fi

          set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "NOT_EXECUTED"
          set_result "PRODUCT_CHECKOUT_OCCURRED" "NO"
          set_result "EXACT_SHA_BINDING_RESULT" "NOT_EXECUTED"
          set_result "NPM_CI_RESULT" "NOT_EXECUTED"
          set_result "LINT_RESULT" "NOT_EXECUTED"
          set_result "TSC_RESULT" "NOT_EXECUTED"
          set_result "BUILD_RESULT" "NOT_EXECUTED"
          set_result "SECRET_SCAN_RESULT" "NOT_EXECUTED"
          set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "NOT_EXECUTED"
          set_result "SLICE2_QA_RESULT" "NOT_EXECUTED"
          set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "NOT_EXECUTED"
          set_result "COMMERCIAL_PACKAGING_RESULT" "NOT_EXECUTED"
          set_result "ENTITLEMENTS_RESULT" "NOT_EXECUTED"
          set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "CLINIC_AI_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "SLUG_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "PUBLIC_BOOKING_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "ROUTE_LINK_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "S2_01_EXACT_PRODUCT_SHA" "NOT_EXECUTED"
          set_result "S2_02_ZERO_PRODUCT_MUTATION" "NOT_EXECUTED"
          set_result "S2_03_NODE_INSTALL" "NOT_EXECUTED"
          set_result "S2_04_TYPESCRIPT" "NOT_EXECUTED"
          set_result "S2_05_BUILD" "NOT_EXECUTED"
          set_result "S2_06_SECRET_SCAN" "NOT_EXECUTED"
          set_result "S2_07_FIVE_LANGUAGE_PARITY" "NOT_EXECUTED"
          set_result "S2_08_PUBLIC_ROUTE_AUTHORITY" "NOT_EXECUTED"
          set_result "S2_09_CUSTOM_DOMAIN_HOST_AUTHORITY" "NOT_EXECUTED"
          set_result "S2_10_PUBLICATION_GATE" "NOT_EXECUTED"
          set_result "S2_11_ATTRIBUTION" "NOT_EXECUTED"
          set_result "S2_12_COUNTRY_VALIDATION" "NOT_EXECUTED"
          set_result "S2_13_ACCESSIBILITY_CONTRACT" "NOT_EXECUTED"
          set_result "S2_14_PASSPORT_PRIVACY" "NOT_EXECUTED"
          set_result "S2_15_NO_DIRECT_HT_DML" "NOT_EXECUTED"
          set_result "S2_16_FOUNDATION_66_MIGRATIONS" "NOT_EXECUTED"
          set_result "S2_17_FOUNDATION_PGTAP_32_OF_32" "NOT_EXECUTED"
          set_result "S2_18_UPSTREAM_REGRESSION_MATRIX" "NOT_EXECUTED"
          set_result "S2_19_EVIDENCE_PROVENANCE" "NOT_EXECUTED"
          set_result "S2_20_ARTIFACT_SELF_CHECK" "NOT_EXECUTED"
          set_result "SUPERSEDES_FAILED_R1_EVIDENCE_SHA" "168bfef970c708e9d4cd2e01d5c8f89d7f83d646"
          set_result "SUPERSEDES_FAILED_R1_RUN_ID" "33097550057"
          set_result "SUPERSEDES_FAILED_R2_EVIDENCE_SHA" "12f27340de9dc215d0e5722ca2719e6e75dbce36"
          set_result "SUPERSEDES_FAILED_R2_RUN_ID" "33098217176"
          set_result "SUPERSEDES_FAILED_R3_EVIDENCE_SHA" "f472da04f5f1a7ed68d69ecf93eee0adefb8a301"
          set_result "SUPERSEDES_FAILED_R3_RUN_ID" "33102592287"
          set_result "SUPERSEDES_FAILED_R4_EVIDENCE_SHA" "475f783557bf25c016d0671e271123c26e3b83af"
          set_result "SUPERSEDES_FAILED_R4_RUN_ID" "33103841982"
          set_result "SUPERSESSION_REASON" "R4_S2_NAMED_PROOFS_STUBBED_TO_FAIL_INSTEAD_OF_EVALUATING_PROVEN_MATRIX"
          set_result "REGRESSION_MATRIX_RESULT" "NOT_EXECUTED"
          set_result "DOCKER_PREFLIGHT_RESULT" "NOT_EXECUTED"
          set_result "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "NOT_EXECUTED"
          set_result "FULL_MIGRATION_REPLAY_RESULT" "NOT_EXECUTED"
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_OCCURRED" "NO"
          set_result "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "NOT_APPLICABLE"
          set_result "PGTAP_EXTENSION_RESULT" "NOT_EXECUTED"
          set_result "PGTAP_SOURCE_CONTRACT_MATCH" "NOT_EXECUTED"
          set_result "PGTAP_PLAN_PARSER_SELFTEST_RESULT" "NOT_EXECUTED"
          set_result "PGTAP_ZERO_COUNT_PARSER_SELFTEST_RESULT" "NOT_EXECUTED"
          set_result "PGTAP_PARSER_SCALAR_SELFTEST_RESULT" "NOT_EXECUTED"
          set_result "PGTAP_NUMERIC_SCALAR_VALIDATION_RESULT" "NOT_EXECUTED"
          set_result "HT_SQL_TEST_EXECUTED" "NO"
          set_result "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "NOT_EXECUTED"
          set_result "NAMED_BEHAVIORAL_PROOF_RESULT" "NOT_EXECUTED"
          set_result "PRODUCT_SHA_PRESERVATION_RESULT" "NOT_EXECUTED"
          set_result "ARTIFACT_SHA256_MANIFEST_SELF_EXCLUDED" "NO"
          set_result "REAL_EXECUTION_RETRY_COUNT" "0"

      - name: Verify Evidence Branch Containment
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          EXPECTED_PRODUCT_SHA="6e8d423083d44510c8446c7a858c26d1555cac0c"
          git merge-base --is-ancestor "${EXPECTED_PRODUCT_SHA}" "${ACTUAL_EVIDENCE_SHA}"
          CHANGED_FILES=$(git diff "${EXPECTED_PRODUCT_SHA}..${ACTUAL_EVIDENCE_SHA}" --name-only)
          EVIDENCE_BRANCH_FILE_CHANGE_COUNT=$(echo "$CHANGED_FILES" | grep -v '^$' | wc -l)
          PRODUCT_CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/workflows/health-tourism-foundation-slice1-exact-sha-e2-r7\.yml$' | grep -v '^$' || true)
          EVIDENCE_PRODUCT_FILE_CHANGE_COUNT=$(echo "$PRODUCT_CHANGED_FILES" | grep -v '^$' | wc -l)

          set_result "EVIDENCE_BRANCH_FILE_CHANGE_COUNT" "${EVIDENCE_BRANCH_FILE_CHANGE_COUNT}"
          set_result "EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" "${EVIDENCE_PRODUCT_FILE_CHANGE_COUNT}"

          if [ "$EVIDENCE_BRANCH_FILE_CHANGE_COUNT" -eq 1 ] && [ "$EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" -eq 0 ]; then
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "PASS"
          else
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "FAIL"
            echo "Evidence branch containment failed!"
            exit 1
          fi

      - name: Checkout Exact Frozen Product SHA
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          EXPECTED_PRODUCT_SHA="6e8d423083d44510c8446c7a858c26d1555cac0c"
          set_result "REQUESTED_PRODUCT_SHA" "${EXPECTED_PRODUCT_SHA}"

          git checkout --detach "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          set_result "ACTUAL_TEST_WORKTREE_SHA" "${ACTUAL_TEST_WORKTREE_SHA}"

          if [ "${ACTUAL_TEST_WORKTREE_SHA}" = "${EXPECTED_PRODUCT_SHA}" ]; then
            set_result "EXACT_SHA_BINDING_RESULT" "PASS"
            set_result "PRODUCT_CHECKOUT_OCCURRED" "YES"
          else
            set_result "EXACT_SHA_BINDING_RESULT" "FAIL"
            echo "Exact SHA binding failed!"
            exit 1
          fi

          git diff --exit-code
          git diff --cached --exit-code

      - name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Local Dependencies with Lockfile Strictness
        run: |
          npm ci
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }
          set_result "NPM_CI_RESULT" "PASS"
          set_result "NODE_VERSION" "$(node --version)"
          set_result "NPM_VERSION" "$(npm --version)"

      - name: Application & Static Regression Matrix
        run: |
          set -o pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          npm run lint 2>&1 | tee /tmp/e2-logs/lint.log && set_result "LINT_RESULT" "PASS" || set_result "LINT_RESULT" "FAIL"
          npx tsc --noEmit 2>&1 | tee /tmp/e2-logs/tsc.log && set_result "TSC_RESULT" "PASS" || set_result "TSC_RESULT" "FAIL"
          npm run build 2>&1 | tee /tmp/e2-logs/build.log && set_result "BUILD_RESULT" "PASS" || set_result "BUILD_RESULT" "FAIL"
          npm run check:secrets 2>&1 | tee /tmp/e2-logs/check-secrets.log && set_result "SECRET_SCAN_RESULT" "PASS" || set_result "SECRET_SCAN_RESULT" "FAIL"
          npm run qa:health-tourism-foundation 2>&1 | tee /tmp/e2-logs/qa-health-tourism-foundation.log && set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "PASS" || set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "FAIL"
          npm run qa:commercial-source-of-truth 2>&1 | tee /tmp/e2-logs/qa-commercial-source-of-truth.log && set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "PASS" || set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "FAIL"
          npm run qa:commercial-packaging 2>&1 | tee /tmp/e2-logs/qa-commercial-packaging.log && set_result "COMMERCIAL_PACKAGING_RESULT" "PASS" || set_result "COMMERCIAL_PACKAGING_RESULT" "FAIL"
          npm run qa:entitlements 2>&1 | tee /tmp/e2-logs/qa-entitlements.log && set_result "ENTITLEMENTS_RESULT" "PASS" || set_result "ENTITLEMENTS_RESULT" "FAIL"
          npm run qa:clinic-domain 2>&1 | tee /tmp/e2-logs/qa-clinic-domain.log && set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "PASS" || set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "FAIL"
          npm run qa:clinic-ai-assist 2>&1 | tee /tmp/e2-logs/qa-clinic-ai-assist.log && set_result "CLINIC_AI_REGRESSION_RESULT" "PASS" || set_result "CLINIC_AI_REGRESSION_RESULT" "FAIL"
          npm run qa:health-tourism-slice2 2>&1 | tee /tmp/e2-logs/qa-health-tourism-slice2.log && set_result "SLICE2_QA_RESULT" "PASS" || set_result "SLICE2_QA_RESULT" "FAIL"
          npm run qa:slug-regression 2>&1 | tee /tmp/e2-logs/qa-slug-regression.log && set_result "SLUG_REGRESSION_RESULT" "PASS" || set_result "SLUG_REGRESSION_RESULT" "FAIL"
          npm run qa:public-booking 2>&1 | tee /tmp/e2-logs/qa-public-booking.log && set_result "PUBLIC_BOOKING_REGRESSION_RESULT" "PASS" || set_result "PUBLIC_BOOKING_REGRESSION_RESULT" "FAIL"
          npm run qa:route-links 2>&1 | tee /tmp/e2-logs/qa-route-links.log && set_result "ROUTE_LINK_REGRESSION_RESULT" "PASS" || set_result "ROUTE_LINK_REGRESSION_RESULT" "FAIL"
          npm run qa:health-tourism-slice2 2>&1 | tee /tmp/e2-logs/qa-health-tourism-slice2.log && set_result "SLICE2_QA_RESULT" "PASS" || set_result "SLICE2_QA_RESULT" "FAIL"
          npm run qa:slug-regression 2>&1 | tee /tmp/e2-logs/qa-slug-regression.log && set_result "SLUG_REGRESSION_RESULT" "PASS" || set_result "SLUG_REGRESSION_RESULT" "FAIL"
          npm run qa:public-booking 2>&1 | tee /tmp/e2-logs/qa-public-booking.log && set_result "PUBLIC_BOOKING_REGRESSION_RESULT" "PASS" || set_result "PUBLIC_BOOKING_REGRESSION_RESULT" "FAIL"
          npm run qa:route-links 2>&1 | tee /tmp/e2-logs/qa-route-links.log && set_result "ROUTE_LINK_REGRESSION_RESULT" "PASS" || set_result "ROUTE_LINK_REGRESSION_RESULT" "FAIL"

          REGRESSION_FAILURES=0
          for KEY in LINT_RESULT TSC_RESULT BUILD_RESULT SECRET_SCAN_RESULT HEALTH_TOURISM_STATIC_QA_RESULT SLICE2_QA_RESULT COMMERCIAL_SOURCE_OF_TRUTH_RESULT COMMERCIAL_PACKAGING_RESULT ENTITLEMENTS_RESULT CLINIC_DOMAIN_REGRESSION_RESULT CLINIC_AI_REGRESSION_RESULT SLUG_REGRESSION_RESULT PUBLIC_BOOKING_REGRESSION_RESULT ROUTE_LINK_REGRESSION_RESULT; do
            VAL=$(grep -E "^${KEY}=" /tmp/e2-logs/results.env | cut -d'=' -f2 || echo "NOT_FOUND")
            if [ "${VAL}" != "PASS" ]; then
              REGRESSION_FAILURES=$((REGRESSION_FAILURES + 1))
            fi
          done

          if [ "${REGRESSION_FAILURES}" -eq 0 ]; then
            set_result "REGRESSION_MATRIX_RESULT" "PASS"
            echo "All 10 regression matrix commands passed cleanly!"
          else
            set_result "REGRESSION_MATRIX_RESULT" "FAIL"
            echo "Regression matrix failed with ${REGRESSION_FAILURES} failure(s)!"
            exit 1
          fi

      - name: Docker Preflight & Start Disposable Postgres Container
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          docker --version
          docker info
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          set_result "PINNED_POSTGRES_IMAGE" "${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"

          CONTAINER_NAME="lari-ht-slice2-e2-r5-${GITHUB_RUN_ID}"
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

          set_result "DOCKER_PREFLIGHT_RESULT" "PASS"

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for Postgres container readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();" 2>&1 | tee /tmp/e2-logs/db-readiness.log

      - name: Execute Managed Runtime Bootstrap Fixture
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql 2>&1 | tee /tmp/e2-logs/p2a-bootstrap.log
          set_result "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "PASS"

      - name: Build Migration Manifest & Apply Complete Canonical Replay
        run: |
          set -o pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          printf '%s\n' "${MIGRATIONS[@]}" > /tmp/e2-logs/migration-manifest.txt

          MIGRATION_COUNT=${#MIGRATIONS[@]}
          LATEST_MIGRATION=${MIGRATIONS[-1]}

          set_result "CANONICAL_MIGRATION_COUNT" "${MIGRATION_COUNT}"
          set_result "CANONICAL_LATEST_MIGRATION" "${LATEST_MIGRATION}"

          if [ "${MIGRATION_COUNT}" -ne 66 ] || [ "${LATEST_MIGRATION}" != "20260910_lari_health_tourism_foundation.sql" ]; then
            set_result "FULL_MIGRATION_REPLAY_RESULT" "FAIL"
            exit 1
          fi

          if printf '%s\n' "${MIGRATIONS[@]}" | grep -q "20260909_clinic_ai_assist_commercial_authority.sql"; then
            set_result "CLINIC_AI_MIGRATION_65_PRESENT" "YES"
            set_result "CLINIC_AI_MIGRATION_65_CONTRACT_PRESERVED" "YES"
          else
            set_result "CLINIC_AI_MIGRATION_65_PRESENT" "NO"
            exit 1
          fi

          ORDINAL=1
          APPLIED_COUNT=0
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== APPLYING HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi

            echo "=== APPLYING [${ORDINAL}/${MIGRATION_COUNT}] ${migration} ==="
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}" 2>&1 | tee -a /tmp/e2-logs/full-migration-replay.log

            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done

          set_result "APPLIED_MIGRATION_COUNT" "${APPLIED_COUNT}"
          if [ "${APPLIED_COUNT}" -eq 66 ]; then
            set_result "FULL_MIGRATION_REPLAY_RESULT" "PASS"
          else
            set_result "FULL_MIGRATION_REPLAY_RESULT" "FAIL"
            exit 1
          fi

      - name: Targeted Staff Quota Trigger Alignment (Disable Before Test)
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          INIT_STATE=$(psql "$DB_URL" -t -A -c "SELECT tgenabled FROM pg_trigger WHERE tgname = 'trg_enforce_staff_quota' AND tgrelid = 'public.staff'::regclass;" || echo "UNKNOWN")
          set_result "STAFF_QUOTA_TRIGGER_INITIAL_STATE" "${INIT_STATE}"
          echo "Initial staff quota trigger state: ${INIT_STATE}" 2>&1 | tee /tmp/e2-logs/trigger-alignment.log

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.staff DISABLE TRIGGER trg_enforce_staff_quota;" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log

          ALIGN_STATE=$(psql "$DB_URL" -t -A -c "SELECT tgenabled FROM pg_trigger WHERE tgname = 'trg_enforce_staff_quota' AND tgrelid = 'public.staff'::regclass;" || echo "UNKNOWN")
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_STATE" "${ALIGN_STATE}"
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_REASON" "DISPOSABLE_SYNTHETIC_HT_STAFF_FIXTURE_ONLY"
          echo "Aligned staff quota trigger state: ${ALIGN_STATE}" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log

          if [ "${ALIGN_STATE}" = "D" ]; then
            set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_OCCURRED" "YES"
          else
            echo "Failed to disable trg_enforce_staff_quota!"
            exit 1
          fi

      - name: Enable pgTAP Extension & Verify Source Contract
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;" 2>&1 | tee /tmp/e2-logs/pgtap-extension.log
          set_result "PGTAP_EXTENSION_RESULT" "PASS"

          TEST_FILE="supabase/tests/health_tourism_foundation_server_authority_tests.sql"
          DECLARED_PLAN=$(grep -E 'SELECT[[:space:]]+plan\([0-9]+\)' "${TEST_FILE}" | grep -oE '[0-9]+')
          ASSERTION_COUNT=$(grep -E 'SELECT[[:space:]]+(has_table|has_function|table_privs_are|is|isnt|ok|pass|throws_ok|lives_ok|results_eq)\b' "${TEST_FILE}" | wc -l)

          set_result "PGTAP_SOURCE_DECLARED_PLAN_COUNT" "${DECLARED_PLAN}"
          set_result "PGTAP_SOURCE_ASSERTION_COUNT" "${ASSERTION_COUNT}"

          if [ "${DECLARED_PLAN}" -eq 32 ] && [ "${ASSERTION_COUNT}" -eq 32 ]; then
            set_result "PGTAP_SOURCE_CONTRACT_MATCH" "PASS"
          else
            set_result "PGTAP_SOURCE_CONTRACT_MATCH" "FAIL"
            exit 1
          fi

      - name: Execute Health Tourism Server-Authority SQL Suite
        id: execute_ht_sql
        run: |
          set -o pipefail
          set_result() {
