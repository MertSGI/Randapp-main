          require_uint "SELFTEST_OK" "${SELFTEST_OK}"
          require_uint "SELFTEST_NOT_OK" "${SELFTEST_NOT_OK}"
          require_uint "SELFTEST_MISMATCH" "${SELFTEST_MISMATCH}"

          if [ "${SELFTEST_PLAN}" -eq 2 ] && [ "${SELFTEST_COMPLETED}" -eq 2 ] && [ "${SELFTEST_OK}" -eq 2 ] && [ "${SELFTEST_NOT_OK}" -eq 0 ] && [ "${SELFTEST_MISMATCH}" -eq 0 ]; then
