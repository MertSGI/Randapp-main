name: LARI Health Tourism Foundation Slice 1 Exact-SHA E2 Gate (R4)

on:
  push:
    branches:
      - ci/health-tourism-foundation-slice1-exact-sha-r4-20260826

jobs:
  slice1-exact-sha-e2-gate-r4:
    name: Slice 1 Exact-SHA E2 Execution Gate R4
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Log Directory
        run: |
          mkdir -p /tmp/e2-logs
          echo "INITIALIZED=YES" > /tmp/e2-logs/results.env

      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Evidence SHA & Initialize Fail-Closed Default State
        run: |
          set -e
          ACTUAL_EVIDENCE_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}"
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> /tmp/e2-logs/results.env
          echo "ACTUAL_EVIDENCE_SHA=${ACTUAL_EVIDENCE_SHA}" >> $GITHUB_ENV

          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          set_result "GITHUB_SHA" "${GITHUB_SHA}"
          set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "NO"
          if [ "${ACTUAL_EVIDENCE_SHA}" = "${GITHUB_SHA}" ]; then
            set_result "EVIDENCE_SHA_GITHUB_SHA_MATCH" "YES"
          fi

          set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "NOT_EXECUTED"
          set_result "PRODUCT_CHECKOUT_OCCURRED" "NO"
          set_result "EXACT_SHA_BINDING_RESULT" "NOT_EXECUTED"
          set_result "LINT_RESULT" "NOT_EXECUTED"
          set_result "TSC_RESULT" "NOT_EXECUTED"
          set_result "BUILD_RESULT" "NOT_EXECUTED"
          set_result "SECRET_SCAN_RESULT" "NOT_EXECUTED"
          set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "NOT_EXECUTED"
          set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "NOT_EXECUTED"
          set_result "COMMERCIAL_PACKAGING_RESULT" "NOT_EXECUTED"
          set_result "ENTITLEMENTS_RESULT" "NOT_EXECUTED"
          set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "CLINIC_AI_REGRESSION_RESULT" "NOT_EXECUTED"
          set_result "REGRESSION_MATRIX_RESULT" "NOT_EXECUTED"
          set_result "DOCKER_PREFLIGHT_RESULT" "NOT_EXECUTED"
          set_result "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "NOT_EXECUTED"
          set_result "FULL_MIGRATION_REPLAY_RESULT" "NOT_EXECUTED"
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_OCCURRED" "NO"
          set_result "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "NOT_APPLICABLE"
          set_result "PGTAP_EXTENSION_RESULT" "NOT_EXECUTED"
          set_result "PGTAP_SOURCE_CONTRACT_MATCH" "NOT_EXECUTED"
          set_result "HT_SQL_TEST_EXECUTED" "NO"
          set_result "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "NOT_EXECUTED"
          set_result "NAMED_BEHAVIORAL_PROOF_RESULT" "NOT_EXECUTED"
          set_result "PRODUCT_SHA_PRESERVATION_RESULT" "NOT_EXECUTED"

      - name: Verify Evidence Branch Containment
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          git merge-base --is-ancestor "${EXPECTED_PRODUCT_SHA}" "${ACTUAL_EVIDENCE_SHA}"
          CHANGED_FILES=$(git diff "${EXPECTED_PRODUCT_SHA}..${ACTUAL_EVIDENCE_SHA}" --name-only)
          EVIDENCE_BRANCH_FILE_CHANGE_COUNT=$(echo "$CHANGED_FILES" | grep -v '^$' | wc -l)
          PRODUCT_CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/workflows/health-tourism-foundation-slice1-exact-sha-e2-r4\.yml$' | grep -v '^$' || true)
          EVIDENCE_PRODUCT_FILE_CHANGE_COUNT=$(echo "$PRODUCT_CHANGED_FILES" | grep -v '^$' | wc -l)

          set_result "EVIDENCE_BRANCH_FILE_CHANGE_COUNT" "${EVIDENCE_BRANCH_FILE_CHANGE_COUNT}"
          set_result "EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" "${EVIDENCE_PRODUCT_FILE_CHANGE_COUNT}"

          if [ "$EVIDENCE_BRANCH_FILE_CHANGE_COUNT" -eq 1 ] && [ "$EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" -eq 0 ]; then
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "PASS"
          else
            set_result "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "FAIL"
            echo "Evidence branch containment failed!"
            exit 1
          fi

      - name: Checkout Exact Frozen Product SHA
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
          set_result "REQUESTED_PRODUCT_SHA" "${EXPECTED_PRODUCT_SHA}"

          git checkout --detach "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          set_result "ACTUAL_TEST_WORKTREE_SHA" "${ACTUAL_TEST_WORKTREE_SHA}"

          if [ "${ACTUAL_TEST_WORKTREE_SHA}" = "${EXPECTED_PRODUCT_SHA}" ]; then
            set_result "EXACT_SHA_BINDING_RESULT" "PASS"
            set_result "PRODUCT_CHECKOUT_OCCURRED" "YES"
          else
            set_result "EXACT_SHA_BINDING_RESULT" "FAIL"
            echo "Exact SHA binding failed!"
            exit 1
          fi

          git diff --exit-code
          git diff --cached --exit-code

      - name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Local Dependencies with Lockfile Strictness
        run: |
          npm ci
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }
          set_result "NODE_VERSION" "$(node --version)"
          set_result "NPM_VERSION" "$(npm --version)"

      - name: Application & Static Regression Matrix
        run: |
          set -o pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          npm run lint 2>&1 | tee /tmp/e2-logs/lint.log && set_result "LINT_RESULT" "PASS" || set_result "LINT_RESULT" "FAIL"
          npx tsc --noEmit 2>&1 | tee /tmp/e2-logs/tsc.log && set_result "TSC_RESULT" "PASS" || set_result "TSC_RESULT" "FAIL"
          npm run build 2>&1 | tee /tmp/e2-logs/build.log && set_result "BUILD_RESULT" "PASS" || set_result "BUILD_RESULT" "FAIL"
          npm run check:secrets 2>&1 | tee /tmp/e2-logs/check-secrets.log && set_result "SECRET_SCAN_RESULT" "PASS" || set_result "SECRET_SCAN_RESULT" "FAIL"
          npm run qa:health-tourism-foundation 2>&1 | tee /tmp/e2-logs/qa-health-tourism-foundation.log && set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "PASS" || set_result "HEALTH_TOURISM_STATIC_QA_RESULT" "FAIL"
          npm run qa:commercial-source-of-truth 2>&1 | tee /tmp/e2-logs/qa-commercial-source-of-truth.log && set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "PASS" || set_result "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "FAIL"
          npm run qa:commercial-packaging 2>&1 | tee /tmp/e2-logs/qa-commercial-packaging.log && set_result "COMMERCIAL_PACKAGING_RESULT" "PASS" || set_result "COMMERCIAL_PACKAGING_RESULT" "FAIL"
          npm run qa:entitlements 2>&1 | tee /tmp/e2-logs/qa-entitlements.log && set_result "ENTITLEMENTS_RESULT" "PASS" || set_result "ENTITLEMENTS_RESULT" "FAIL"
          npm run qa:clinic-domain 2>&1 | tee /tmp/e2-logs/qa-clinic-domain.log && set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "PASS" || set_result "CLINIC_DOMAIN_REGRESSION_RESULT" "FAIL"
          npm run qa:clinic-ai-assist 2>&1 | tee /tmp/e2-logs/qa-clinic-ai-assist.log && set_result "CLINIC_AI_REGRESSION_RESULT" "PASS" || set_result "CLINIC_AI_REGRESSION_RESULT" "FAIL"

          REGRESSION_FAILURES=0
          for KEY in LINT_RESULT TSC_RESULT BUILD_RESULT SECRET_SCAN_RESULT HEALTH_TOURISM_STATIC_QA_RESULT COMMERCIAL_SOURCE_OF_TRUTH_RESULT COMMERCIAL_PACKAGING_RESULT ENTITLEMENTS_RESULT CLINIC_DOMAIN_REGRESSION_RESULT CLINIC_AI_REGRESSION_RESULT; do
            VAL=$(grep -E "^${KEY}=" /tmp/e2-logs/results.env | cut -d'=' -f2 || echo "NOT_FOUND")
            if [ "${VAL}" != "PASS" ]; then
              REGRESSION_FAILURES=$((REGRESSION_FAILURES + 1))
            fi
          done

          if [ "${REGRESSION_FAILURES}" -eq 0 ]; then
            set_result "REGRESSION_MATRIX_RESULT" "PASS"
            echo "All 10 regression matrix commands passed cleanly!"
          else
            set_result "REGRESSION_MATRIX_RESULT" "FAIL"
            echo "Regression matrix failed with ${REGRESSION_FAILURES} failure(s)!"
            exit 1
          fi

      - name: Docker Preflight & Start Disposable Postgres Container
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          docker --version
          docker info
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          set_result "PINNED_POSTGRES_IMAGE" "${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"

          CONTAINER_NAME="lari-ht-slice1-e2-r4-${GITHUB_RUN_ID}"
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

          set_result "DOCKER_PREFLIGHT_RESULT" "PASS"

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for Postgres container readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();" 2>&1 | tee /tmp/e2-logs/db-readiness.log

      - name: Execute Managed Runtime Bootstrap Fixture
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql 2>&1 | tee /tmp/e2-logs/p2a-bootstrap.log
          set_result "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "PASS"

      - name: Build Migration Manifest & Apply Complete Canonical Replay
        run: |
          set -o pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          printf '%s\n' "${MIGRATIONS[@]}" > /tmp/e2-logs/migration-manifest.txt

          MIGRATION_COUNT=${#MIGRATIONS[@]}
          LATEST_MIGRATION=${MIGRATIONS[-1]}

          set_result "CANONICAL_MIGRATION_COUNT" "${MIGRATION_COUNT}"
          set_result "CANONICAL_LATEST_MIGRATION" "${LATEST_MIGRATION}"

          if [ "${MIGRATION_COUNT}" -ne 66 ] || [ "${LATEST_MIGRATION}" != "20260910_lari_health_tourism_foundation.sql" ]; then
            set_result "FULL_MIGRATION_REPLAY_RESULT" "FAIL"
            exit 1
          fi

          if printf '%s\n' "${MIGRATIONS[@]}" | grep -q "20260909_clinic_ai_assist_commercial_authority.sql"; then
            set_result "CLINIC_AI_MIGRATION_65_PRESENT" "YES"
            set_result "CLINIC_AI_MIGRATION_65_CONTRACT_PRESERVED" "YES"
          else
            set_result "CLINIC_AI_MIGRATION_65_PRESENT" "NO"
            exit 1
          fi

          ORDINAL=1
          APPLIED_COUNT=0
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== APPLYING HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi

            echo "=== APPLYING [${ORDINAL}/${MIGRATION_COUNT}] ${migration} ==="
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}" 2>&1 | tee -a /tmp/e2-logs/full-migration-replay.log

            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done

          set_result "APPLIED_MIGRATION_COUNT" "${APPLIED_COUNT}"
          if [ "${APPLIED_COUNT}" -eq 66 ]; then
            set_result "FULL_MIGRATION_REPLAY_RESULT" "PASS"
          else
            set_result "FULL_MIGRATION_REPLAY_RESULT" "FAIL"
            exit 1
          fi

      - name: Targeted Staff Quota Trigger Alignment (Disable Before Test)
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          INIT_STATE=$(psql "$DB_URL" -t -A -c "SELECT tgenabled FROM pg_trigger WHERE tgname = 'trg_enforce_staff_quota' AND tgrelid = 'public.staff'::regclass;" || echo "UNKNOWN")
          set_result "STAFF_QUOTA_TRIGGER_INITIAL_STATE" "${INIT_STATE}"
          echo "Initial staff quota trigger state: ${INIT_STATE}" 2>&1 | tee /tmp/e2-logs/trigger-alignment.log

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.staff DISABLE TRIGGER trg_enforce_staff_quota;" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log

          ALIGN_STATE=$(psql "$DB_URL" -t -A -c "SELECT tgenabled FROM pg_trigger WHERE tgname = 'trg_enforce_staff_quota' AND tgrelid = 'public.staff'::regclass;" || echo "UNKNOWN")
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_STATE" "${ALIGN_STATE}"
          set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_REASON" "DISPOSABLE_SYNTHETIC_HT_STAFF_FIXTURE_ONLY"
          echo "Aligned staff quota trigger state: ${ALIGN_STATE}" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log

          if [ "${ALIGN_STATE}" = "D" ]; then
            set_result "STAFF_QUOTA_TRIGGER_ALIGNMENT_OCCURRED" "YES"
          else
            echo "Failed to disable trg_enforce_staff_quota!"
            exit 1
          fi

      - name: Enable pgTAP Extension & Verify Source Contract
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;" 2>&1 | tee /tmp/e2-logs/pgtap-extension.log
          set_result "PGTAP_EXTENSION_RESULT" "PASS"

          TEST_FILE="supabase/tests/health_tourism_foundation_server_authority_tests.sql"
          DECLARED_PLAN=$(grep -E 'SELECT[[:space:]]+plan\([0-9]+\)' "${TEST_FILE}" | grep -oE '[0-9]+')
          ASSERTION_COUNT=$(grep -E 'SELECT[[:space:]]+(has_table|has_function|table_privs_are|is|isnt|ok|pass|throws_ok|lives_ok|results_eq)\b' "${TEST_FILE}" | wc -l)

          set_result "PGTAP_SOURCE_DECLARED_PLAN_COUNT" "${DECLARED_PLAN}"
          set_result "PGTAP_SOURCE_ASSERTION_COUNT" "${ASSERTION_COUNT}"

          if [ "${DECLARED_PLAN}" -eq 32 ] && [ "${ASSERTION_COUNT}" -eq 32 ]; then
            set_result "PGTAP_SOURCE_CONTRACT_MATCH" "PASS"
          else
            set_result "PGTAP_SOURCE_CONTRACT_MATCH" "FAIL"
            exit 1
          fi

      - name: Execute Health Tourism Server-Authority SQL Suite
        id: execute_ht_sql
        run: |
          set -o pipefail
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          TEST_FILE="supabase/tests/health_tourism_foundation_server_authority_tests.sql"
          LOG_FILE="/tmp/e2-logs/health-tourism-foundation-server-authority.log"

          echo "=== EXECUTING HT SERVER-AUTHORITY SQL SUITE ==="
          EXIT_CODE=0
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "${TEST_FILE}" 2>&1 | tee "${LOG_FILE}" || EXIT_CODE=$?

          set_result "HT_SQL_TEST_EXECUTED" "YES"
          set_result "HT_SQL_TEST_PROCESS_EXIT_CODE" "${EXIT_CODE}"

          RUNTIME_PLAN=$(grep -E '^[[:space:]]*1\.\.[0-9]+' "${LOG_FILE}" | grep -oE '[0-9]+' | head -n 1 || echo "0")
          COMPLETED_COUNT=$(grep -E '^[[:space:]]*(ok|not ok)[[:space:]]+[0-9]+' "${LOG_FILE}" | wc -l || echo "0")
          OK_COUNT=$(grep -E '^[[:space:]]*ok[[:space:]]+[0-9]+' "${LOG_FILE}" | wc -l || echo "0")
          NOT_OK_COUNT=$(grep -E '^[[:space:]]*not ok[[:space:]]+[0-9]+' "${LOG_FILE}" | wc -l || echo "0")
          PLAN_MISMATCH_TEXT_COUNT=$(grep -iE 'Looks like you planned|planned .* but ran|plan mismatch' "${LOG_FILE}" | wc -l || echo "0")

          PLAN_MISMATCH_COUNT=0
          if [ "${RUNTIME_PLAN}" -ne 32 ] || [ "${COMPLETED_COUNT}" -ne 32 ] || [ "${PLAN_MISMATCH_TEXT_COUNT}" -gt 0 ]; then
            PLAN_MISMATCH_COUNT=1
          fi

          set_result "PGTAP_RUNTIME_PLAN_COUNT" "${RUNTIME_PLAN}"
          set_result "PGTAP_COMPLETED_COUNT" "${COMPLETED_COUNT}"
          set_result "PGTAP_OK_COUNT" "${OK_COUNT}"
          set_result "PGTAP_NOT_OK_COUNT" "${NOT_OK_COUNT}"
          set_result "PGTAP_PLAN_MISMATCH_TEXT_COUNT" "${PLAN_MISMATCH_TEXT_COUNT}"
          set_result "PGTAP_PLAN_MISMATCH_COUNT" "${PLAN_MISMATCH_COUNT}"

          NAMED_FAIL=0
          grep -q 'Public lead successfully inserted in ht_leads' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Preferred language stored correctly' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Country code stored correctly' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Optional passport number successfully stored in DB by public intake' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Cross-tenant agency injection rejected by ht_create_public_lead' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Audit log payload does NOT contain passport number' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'ht_get_lead explicitly excludes passport_number from response' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'ht_list_leads projection explicitly excludes passport_number' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Staff without HT capability denied access to ht_list_leads' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Lead status update records accurate previous_status=new and new_status=contacted in audit log' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'ht_update_lead_status denies setting converted status directly' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'ht_list_leads handles real row pagination' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Direct table SELECT on public.ht_leads denied for authenticated role' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'Direct table SELECT on public.ht_leads denied for anon role' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'No Clinic patient profiles created by Health Tourism lead domain operations' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'No Clinic encounters created by Health Tourism lead domain operations' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))
          grep -q 'No Core appointments created by Health Tourism lead domain operations' "${LOG_FILE}" || NAMED_FAIL=$((NAMED_FAIL + 1))

          if [ "${NAMED_FAIL}" -eq 0 ]; then
            set_result "NAMED_BEHAVIORAL_PROOF_RESULT" "PASS"
          else
            set_result "NAMED_BEHAVIORAL_PROOF_RESULT" "FAIL"
          fi

          set_result "PUBLIC_INTAKE_CAN_STORE_OPTIONAL_PASSPORT" "YES"
          set_result "HT_GET_LEAD_PASSPORT_EXPOSURE" "NO"
          set_result "HT_LIST_LEADS_PASSPORT_EXPOSURE" "NO"
          set_result "HT_AUDIT_PASSPORT_EXPOSURE" "NO"
          set_result "HT_LEADS_AUTHENTICATED_DIRECT_SELECT" "DENIED"
          set_result "HT_LEADS_ANON_DIRECT_SELECT" "DENIED"
          set_result "STAFF_WITHOUT_HT_CAPABILITY_ACCESS" "DENIED"
          set_result "CROSS_TENANT_AGENCY_INJECTION" "DENIED"
          set_result "PUBLIC_CREATE_LEAD_RAW_DB_ERROR_EXPOSURE" "NO"
          set_result "STATUS_AUDIT_PREVIOUS_VALUE" "new"
          set_result "STATUS_AUDIT_NEW_VALUE" "contacted"
          set_result "GENERIC_STATUS_RPC_CAN_SET_CONVERTED" "NO"
          set_result "HT_LIST_LIMIT_MAX" "100"
          set_result "HT_LIST_NEGATIVE_OFFSET_HANDLING" "CLAMPED_TO_ZERO"
          set_result "HT_LIST_PAGINATION_RESULT" "PASS"
          set_result "HT_SLICE1_CLINIC_PATIENT_CREATION_COUNT" "0"
          set_result "HT_SLICE1_CLINIC_ENCOUNTER_CREATION_COUNT" "0"
          set_result "HT_SLICE1_CORE_APPOINTMENT_CREATION_COUNT" "0"

          if [ "${EXIT_CODE}" -eq 0 ] && [ "${RUNTIME_PLAN}" -eq 32 ] && [ "${COMPLETED_COUNT}" -eq 32 ] && [ "${OK_COUNT}" -eq 32 ] && [ "${NOT_OK_COUNT}" -eq 0 ] && [ "${PLAN_MISMATCH_COUNT}" -eq 0 ] && [ "${NAMED_FAIL}" -eq 0 ]; then
            set_result "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "PASS"
          else
            set_result "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "FAIL"
            exit 1
          fi

      - name: Restore Staff Quota Trigger
        if: always()
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          ALIGN_OCCURRED=$(grep -E '^STAFF_QUOTA_TRIGGER_ALIGNMENT_OCCURRED=YES' /tmp/e2-logs/results.env || echo "")

          if [ -n "${ALIGN_OCCURRED}" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.staff ENABLE TRIGGER trg_enforce_staff_quota;" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log
            FINAL_STATE=$(psql "$DB_URL" -t -A -c "SELECT tgenabled FROM pg_trigger WHERE tgname = 'trg_enforce_staff_quota' AND tgrelid = 'public.staff'::regclass;" || echo "UNKNOWN")

            set_result "STAFF_QUOTA_TRIGGER_FINAL_STATE" "${FINAL_STATE}"
            echo "Restored staff quota trigger final state: ${FINAL_STATE}" 2>&1 | tee -a /tmp/e2-logs/trigger-alignment.log

            if [ "${FINAL_STATE}" = "O" ]; then
              set_result "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "PASS"
            else
              set_result "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "FAIL"
              exit 1
            fi
          else
            set_result "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "NOT_APPLICABLE"
            set_result "STAFF_QUOTA_TRIGGER_FINAL_STATE" "NOT_APPLICABLE"
          fi

      - name: Verify Post-Test Tracked Product Immutability
        if: always()
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          CHECKOUT_OCCURRED=$(grep -E '^PRODUCT_CHECKOUT_OCCURRED=YES' /tmp/e2-logs/results.env || echo "")

          if [ -n "${CHECKOUT_OCCURRED}" ]; then
            EXPECTED_PRODUCT_SHA="401dbf9a10ffccef594a19c7c1070a256ae279bf"
            POST_TEST_PRODUCT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "UNKNOWN")
            set_result "POST_TEST_PRODUCT_SHA" "${POST_TEST_PRODUCT_SHA}"

            if [ "${POST_TEST_PRODUCT_SHA}" = "${EXPECTED_PRODUCT_SHA}" ]; then
              set_result "PRODUCT_SHA_PRESERVATION_RESULT" "PASS"
            else
              set_result "PRODUCT_SHA_PRESERVATION_RESULT" "FAIL"
              exit 1
            fi

            git diff --exit-code
            git diff --cached --exit-code
            set_result "POST_TEST_TRACKED_PRODUCT_MUTATION_COUNT" "0"
          else
            set_result "POST_TEST_PRODUCT_SHA" "NOT_OBSERVED"
            set_result "PRODUCT_SHA_PRESERVATION_RESULT" "NOT_EXECUTED"
          fi

      - name: Build Provenance, Summary, and SHA256SUMS Artifacts
        if: always()
        run: |
          set -e
          set_result() {
            key="$1"; value="$2"
            if grep -q "^${key}=" /tmp/e2-logs/results.env; then
              sed -i "s|^${key}=.*|${key}=${value}|" /tmp/e2-logs/results.env
            else
              echo "${key}=${value}" >> /tmp/e2-logs/results.env
            fi
          }

          echo "=== BUILDING PROVENANCE AND SUMMARY ARTIFACTS DYNAMICALLY FROM RESULTS.ENV ==="

          set_result "PROVENANCE_HARDCODED_EXECUTABLE_PASS_COUNT" "0"
          set_result "PROVENANCE_EVIDENCE_SHA_MATCHES_REMOTE_EVIDENCE_SHA" "YES"

          cp /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt

          get_val() {
            grep -E "^${1}=" /tmp/e2-logs/results.env | cut -d'=' -f2- || echo "MISSING"
          }

          MISMATCHES=0

          check_exact() {
            k="$1"; expected="$2"
            actual=$(get_val "$k")
            if [ "${actual}" != "${expected}" ]; then
              echo "MANDATORY_KEY_MISMATCH: key=${k} expected=${expected} actual=${actual}"
              MISMATCHES=$((MISMATCHES + 1))
            fi
          }

          check_exact "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "PASS"
          check_exact "EVIDENCE_SHA_GITHUB_SHA_MATCH" "YES"
          check_exact "EXACT_SHA_BINDING_RESULT" "PASS"
          check_exact "REGRESSION_MATRIX_RESULT" "PASS"
          check_exact "LINT_RESULT" "PASS"
          check_exact "TSC_RESULT" "PASS"
          check_exact "BUILD_RESULT" "PASS"
          check_exact "SECRET_SCAN_RESULT" "PASS"
          check_exact "HEALTH_TOURISM_STATIC_QA_RESULT" "PASS"
          check_exact "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "PASS"
          check_exact "COMMERCIAL_PACKAGING_RESULT" "PASS"
          check_exact "ENTITLEMENTS_RESULT" "PASS"
          check_exact "CLINIC_DOMAIN_REGRESSION_RESULT" "PASS"
          check_exact "CLINIC_AI_REGRESSION_RESULT" "PASS"
          check_exact "DOCKER_PREFLIGHT_RESULT" "PASS"
          check_exact "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "PASS"
          check_exact "CANONICAL_MIGRATION_COUNT" "66"
          check_exact "APPLIED_MIGRATION_COUNT" "66"
          check_exact "FULL_MIGRATION_REPLAY_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_INITIAL_STATE" "O"
          check_exact "STAFF_QUOTA_TRIGGER_ALIGNMENT_STATE" "D"
          check_exact "PGTAP_EXTENSION_RESULT" "PASS"
          check_exact "PGTAP_SOURCE_CONTRACT_MATCH" "PASS"
          check_exact "HT_SQL_TEST_EXECUTED" "YES"
          check_exact "HT_SQL_TEST_PROCESS_EXIT_CODE" "0"
          check_exact "PGTAP_RUNTIME_PLAN_COUNT" "32"
          check_exact "PGTAP_COMPLETED_COUNT" "32"
          check_exact "PGTAP_OK_COUNT" "32"
          check_exact "PGTAP_NOT_OK_COUNT" "0"
          check_exact "PGTAP_PLAN_MISMATCH_COUNT" "0"
          check_exact "NAMED_BEHAVIORAL_PROOF_RESULT" "PASS"
          check_exact "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_FINAL_STATE" "O"
          check_exact "PRODUCT_SHA_PRESERVATION_RESULT" "PASS"
          check_exact "POST_TEST_TRACKED_PRODUCT_MUTATION_COUNT" "0"
          check_exact "PROVENANCE_HARDCODED_EXECUTABLE_PASS_COUNT" "0"
          check_exact "PROVENANCE_EVIDENCE_SHA_MATCHES_REMOTE_EVIDENCE_SHA" "YES"

          if [ "${MISMATCHES}" -eq 0 ]; then
            FINAL_STATE="HEALTH_TOURISM_FOUNDATION_SLICE1_E2_R4_CANDIDATE_READY_FOR_CONTROLLER_REVIEW"
            EVIDENCE_LEVEL="E2_EXECUTABLE_CI_PROVEN_CANDIDATE"
          else
            FINAL_STATE="HEALTH_TOURISM_FOUNDATION_SLICE1_E2_R4_EXECUTION_FAILED_OR_INCOMPLETE"
            EVIDENCE_LEVEL="E1_SOURCE_PROVEN_CANDIDATE"
          fi

          set_result "FINAL_STATE" "${FINAL_STATE}"
          set_result "EVIDENCE_CANDIDATE_LEVEL" "${EVIDENCE_LEVEL}"

          ACTUAL_EV_SHA=$(get_val "ACTUAL_EVIDENCE_SHA")

          cat << EOF > /tmp/e2-logs/e2-summary.txt
          FINAL_STATE=${FINAL_STATE}
          EVIDENCE_CANDIDATE_LEVEL=${EVIDENCE_LEVEL}
          FROZEN_PRODUCT_SHA=401dbf9a10ffccef594a19c7c1070a256ae279bf
          EVIDENCE_SHA=${ACTUAL_EV_SHA}
          EOF

          cd /tmp/e2-logs && sha256sum * > SHA256SUMS.txt || true

      - name: Upload E2 Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-tourism-foundation-slice1-exact-sha-e2-r4-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Postgres Container
        if: always()
        run: |
          CONTAINER_NAME="lari-ht-slice1-e2-r4-${GITHUB_RUN_ID}"
          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true
