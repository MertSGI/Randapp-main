          else
            echo "BUILD_RESULT=FAIL" > /tmp/e2-artifacts/26-build.env
            echo "BUILD_RESULT_FAILURE_REASON=BUILD_EXIT_${status}" >> /tmp/e2-artifacts/26-build.env
          fi

      - name: Secret Scan & Safety Check
        id: secret_scan
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "SECRET_SCAN_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/27-secret-scan.env
            echo "SECRET_SCAN_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/27-secret-scan.env
            exit 0
          fi

          set +e
          node scripts/scan-frontend-secrets.mjs 2>&1 | tee /tmp/e2-artifacts/secret-scan.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ${status} -eq 0 ]; then
            echo "SECRET_SCAN_RESULT=PASS" > /tmp/e2-artifacts/27-secret-scan.env
          else
            echo "SECRET_SCAN_RESULT=FAIL" > /tmp/e2-artifacts/27-secret-scan.env
            echo "SECRET_SCAN_RESULT_FAILURE_REASON=SECRET_SCAN_EXIT_${status}" >> /tmp/e2-artifacts/27-secret-scan.env
          fi

      - name: Write Explicit Containment Evidence
        id: containment_evidence
        if: always()
        run: |
          cat << EOF > /tmp/e2-artifacts/28-containment.env
          REMOTE_SUPABASE_ACCESS_COUNT=0
          SHARED_STAGING_ACCESS_COUNT=0
          PRODUCTION_ACCESS_COUNT=0
          DEPLOYMENT_COUNT=0
          CONTROL_PLANE_MUTATION_COUNT=0
          AOS_MUTATION_COUNT=0
          EOF

      - name: Aggregate Evidence & Evaluate Composite Gate
        id: generate_results
        if: always()
        run: |
          CHECKED_SHA=$(git rev-parse HEAD)
          cat << EOF > /tmp/e2-artifacts/provenance.json
          {
            "candidate_sha": "e74d097b2ba1160bc852e84503aa6368b23d43eb",
            "evidence_workflow_sha": "${GITHUB_SHA}",
            "checked_out_sha": "${CHECKED_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "job_key": "${GITHUB_JOB}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          node scripts/aggregate-lari-e2-evidence.mjs

      - name: Upload E2 Evidence Artifacts
        id: upload_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lari-health-tourism-slice4-final-e2-r9-evidence
          path: /tmp/e2-artifacts/*

      - name: Enforce Slice 4 E2 Authority Result
        id: enforce_e2_result
        if: always()
        run: |
          if [ ! -f /tmp/e2-artifacts/results.env ]; then
            echo "❌ CRITICAL: /tmp/e2-artifacts/results.env is absent!"
            exit 1
          fi
          cat /tmp/e2-artifacts/results.env
          if grep -Fxq "SLICE4_E2_RESULT=PASS_CANDIDATE" /tmp/e2-artifacts/results.env; then
            echo "✅ Slice 4 E2 Composite Acceptance PASSED CANDIDATE"
            exit 0
          else
            echo "❌ Slice 4 E2 Composite Acceptance FAILED"
            exit 1
          fi
