          set -e

          if [ ${pgtap_setup_status} -ne 0 ]; then
            write_not_executed "/tmp/e2-artifacts/06-pgtap-foundation.env" "FOUNDATION" "PGTAP_SETUP_FAILED"
            write_not_executed "/tmp/e2-artifacts/07-pgtap-slice3.env" "SLICE3" "PGTAP_SETUP_FAILED"
            write_not_executed "/tmp/e2-artifacts/08-pgtap-slice4-block1.env" "SLICE4_BLOCK1" "PGTAP_SETUP_FAILED"
            write_not_executed "/tmp/e2-artifacts/09-pgtap-slice4-block2.env" "SLICE4_BLOCK2" "PGTAP_SETUP_FAILED"
            echo "ZERO_TEST_SUITE_COUNT=NOT_OBSERVED" > /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT=FAIL" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT_FAILURE_REASON=PGTAP_SETUP_EXIT_${pgtap_setup_status}" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            exit 0
          fi

          SUITE_FAILURES=0
          ZERO_TEST_COUNT=0

          run_tap_suite() {
            local suite_file="$1"
            local result_prefix="$2"
            local frag_file="$3"
            local log_file="/tmp/e2-artifacts/pgtap-${result_prefix}.txt"
            
            echo "=== Running TAP suite ${suite_file} ==="
            set +e
            pg_prove --verbose -h 127.0.0.1 -p 54322 -U postgres -d postgres "${suite_file}" > "${log_file}" 2>&1
            local prove_status=$?
            set -e

            local planned_count=0
            local plan_line
            plan_line=$(grep -E "^1\.\.[0-9]+" "${log_file}" | head -n 1 || true)
            if [ -n "${plan_line}" ]; then
              planned_count=$(echo "${plan_line}" | cut -d'.' -f3)
            fi

            local passed_count
            passed_count=$(grep -c "^ok " "${log_file}" || true)
            passed_count=${passed_count:-0}

            local failed_count
            failed_count=$(grep -c "^not ok " "${log_file}" || true)
            failed_count=${failed_count:-0}

            local executed_count=$((passed_count + failed_count))

            echo "${result_prefix}_PGTAP_PLANNED_COUNT=${planned_count}" > "${frag_file}"
            echo "${result_prefix}_PGTAP_EXECUTED_COUNT=${executed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_COUNT=${executed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_PASSED_COUNT=${passed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_FAILED_COUNT=${failed_count}" >> "${frag_file}"

            if [ "${executed_count}" -eq 0 ]; then
              echo "ERROR: Zero tests executed in ${suite_file}!"
              ZERO_TEST_COUNT=$((ZERO_TEST_COUNT + 1))
              echo "${result_prefix}_PGTAP_RESULT=FAIL" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_RESULT_FAILURE_REASON=ZERO_TESTS_EXECUTED" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_FAILURE_CLASS=SETUP_OR_PARSE_FAILURE" >> "${frag_file}"
              SUITE_FAILURES=$((SUITE_FAILURES + 1))
              return 0
            fi

            if [ "${prove_status}" -ne 0 ] || [ "${planned_count}" -eq 0 ] || [ "${executed_count}" -ne "${planned_count}" ] || [ "${failed_count}" -gt 0 ]; then
              echo "${result_prefix}_PGTAP_RESULT=FAIL" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_RESULT_FAILURE_REASON=PG_PROVE_EXIT_${prove_status}_PLANNED_${planned_count}_EXECUTED_${executed_count}_FAILED_${failed_count}" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_FAILURE_CLASS=ASSERTION_FAILURE" >> "${frag_file}"
              echo "ERROR: ${suite_file} failed (prove_status=${prove_status}, planned=${planned_count}, executed=${executed_count}, failed=${failed_count})"
              SUITE_FAILURES=$((SUITE_FAILURES + 1))
              return 0
            fi

            echo "${result_prefix}_PGTAP_RESULT=PASS" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_FAILURE_CLASS=NONE" >> "${frag_file}"
          }

          run_tap_suite "supabase/tests/health_tourism_foundation_server_authority_tests.sql" "FOUNDATION" "/tmp/e2-artifacts/06-pgtap-foundation.env"
          run_tap_suite "supabase/tests/health_tourism_lead_ops_ai_assist_tests.sql" "SLICE3" "/tmp/e2-artifacts/07-pgtap-slice3.env"
          run_tap_suite "supabase/tests/health_tourism_clinic_acceptance_tests.sql" "SLICE4_BLOCK1" "/tmp/e2-artifacts/08-pgtap-slice4-block1.env"
          run_tap_suite "supabase/tests/health_tourism_clinic_acceptance_workspace_tests.sql" "SLICE4_BLOCK2" "/tmp/e2-artifacts/09-pgtap-slice4-block2.env"

          echo "ZERO_TEST_SUITE_COUNT=${ZERO_TEST_COUNT}" > /tmp/e2-artifacts/13b-pgtap-summary.env
          if [ "${SUITE_FAILURES}" -gt 0 ]; then
            echo "PGTAP_PHASE_RESULT=FAIL" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT_FAILURE_REASON=${SUITE_FAILURES}_SUITES_FAILED" >> /tmp/e2-artifacts/13b-pgtap-summary.env
          else
            echo "PGTAP_PHASE_RESULT=PASS" >> /tmp/e2-artifacts/13b-pgtap-summary.env
          fi

      - name: Run Real 2-Session Concurrency Harness
