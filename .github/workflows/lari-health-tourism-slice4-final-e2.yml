name: LARI Health Tourism Slice 4 Final E2 Composite Acceptance

on:
  workflow_dispatch:

jobs:
  slice4-final-e2:
    name: Hosted Disposable E2 Composite Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Test-Support Commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: '0324f084693a0b3e50d33343ae47108007b6eca1'

      - name: Initialize Evidence Directory
        id: init_artifacts
        run: |
          mkdir -p /tmp/e2-artifacts

      - name: Setup Node.js Environment
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tool Dependencies (psql & pg_prove)
        id: tool_setup
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client libtap-parser-sourcehandler-pgtap-perl
          command -v psql
          command -v pg_prove

      - name: Start Pinned Supabase Postgres Container
        id: postgres_start
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-slice4-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        id: postgres_ready
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then break; fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();"

      - name: Execute Managed Runtime Bootstrap Fixture
        id: bootstrap
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: migration_replay
        run: |
          set -e
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          MIGRATION_TOTAL=${#MIGRATIONS[@]}
          if [ "${MIGRATION_TOTAL}" -ne 69 ]; then exit 1; fi

          APPLIED_COUNT=0
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done

          echo "MIGRATION_REPLAY_RESULT=PASS" > /tmp/e2-artifacts/01-migration.env
          echo "MIGRATION_COUNT=${APPLIED_COUNT}/${MIGRATION_TOTAL}" >> /tmp/e2-artifacts/01-migration.env

      - name: Verify Commercial Authority & Quota Contract
        id: commercial_verification
        if: always()
        run: |
          if [ "${{ steps.migration_replay.conclusion }}" != "success" ]; then
            echo "COMMERCIAL_BOOTSTRAP_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_BOOTSTRAP_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_ELIGIBILITY_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_CORE_BOOKING_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_STAFF_MANAGEMENT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_SERVICE_MANAGEMENT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_LARI_MINISITE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_STAFF_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_SERVICES_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_BRANCHES_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_MONTHLY_APPOINTMENTS_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_FIXTURE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_QUOTA_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            exit 0
          fi

          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/slice4_e2_commercial_verification.sql 2>&1 | tee /tmp/e2-artifacts/commercial-verification.log

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/commercial-verification.log", "utf8");
            const keys = [
              "COMMERCIAL_BOOTSTRAP_RESULT", "COMMERCIAL_ELIGIBILITY_RESULT",
              "COMMERCIAL_CORE_BOOKING_RESULT", "COMMERCIAL_STAFF_MANAGEMENT_RESULT",
              "COMMERCIAL_SERVICE_MANAGEMENT_RESULT", "COMMERCIAL_LARI_MINISITE_RESULT",
              "COMMERCIAL_MAX_STAFF_RESULT", "COMMERCIAL_MAX_SERVICES_RESULT",
              "COMMERCIAL_MAX_BRANCHES_RESULT", "COMMERCIAL_MAX_MONTHLY_APPOINTMENTS_RESULT",
              "COMMERCIAL_FIXTURE_RESULT", "COMMERCIAL_QUOTA_RESULT"
            ];
            let fragment = "";
            for (const k of keys) {
              if (log.includes(k + "=PASS")) {
                fragment += k + "=PASS\n";
              } else {
                fragment += k + "=FAIL\n";
              }
            }
            fs.writeFileSync("/tmp/e2-artifacts/02-commercial.env", fragment);
          '

      - name: Install Node Dependencies
        id: install_deps
        run: |
          npm ci

      - name: Run R9 Evidence Contract Self-Tests
        id: selftest
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "R9_SELFTEST_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/03-r9-selftest.env
            echo "R9_SELFTEST_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/03-r9-selftest.env
            exit 0
          fi

          set -euo pipefail
          node scripts/test-r9-contracts-selftest.mjs 2>&1 | tee /tmp/e2-artifacts/contract-selftest.log
          echo "R9_SELFTEST_RESULT=PASS" > /tmp/e2-artifacts/03-r9-selftest.env

      - name: Execute Static Fixture UUID Contract Check
        id: uuid_contract
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "FIXTURE_UUID_STATIC_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/04-uuid-static.env
            echo "FIXTURE_UUID_STATIC_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/04-uuid-static.env
            echo "INVALID_UUID_DISTINCT_COUNT=0" >> /tmp/e2-artifacts/04-uuid-static.env
            echo "INVALID_UUID_OCCURRENCE_COUNT=0" >> /tmp/e2-artifacts/04-uuid-static.env
            exit 0
          fi

          set -euo pipefail
          node scripts/test-health-tourism-slice4-fixture-uuid-contract.mjs 2>&1 | tee /tmp/e2-artifacts/fixture-uuid-static.log

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/fixture-uuid-static.log", "utf8");
            const res = log.match(/FIXTURE_UUID_STATIC_RESULT=(PASS|FAIL)/)?.[1] || "FAIL";
            const dist = log.match(/INVALID_UUID_DISTINCT_COUNT=(\d+)/)?.[1] || "0";
            const occ = log.match(/INVALID_UUID_OCCURRENCE_COUNT=(\d+)/)?.[1] || "0";

            let env = "";
            env += `FIXTURE_UUID_STATIC_RESULT=${res}\n`;
            env += `INVALID_UUID_DISTINCT_COUNT=${dist}\n`;
            env += `INVALID_UUID_OCCURRENCE_COUNT=${occ}\n`;
            fs.writeFileSync("/tmp/e2-artifacts/04-uuid-static.env", env);
          '

      - name: Execute Static Fixture Arity Contract Check
        id: arity_contract
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "FIXTURE_ARITY_STATIC_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/05-arity-static.env
            echo "FIXTURE_ARITY_STATIC_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_CHECKED_INSERT_COUNT=0" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_NON_VALUES_INSERT_COUNT=0" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_MISMATCH_DISTINCT_COUNT=0" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_MISMATCH_OCCURRENCE_COUNT=0" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_UNSUPPORTED_STATEMENT_COUNT=0" >> /tmp/e2-artifacts/05-arity-static.env
            exit 0
          fi

          set -euo pipefail
          node scripts/test-health-tourism-slice4-fixture-arity-contract.mjs 2>&1 | tee /tmp/e2-artifacts/fixture-arity-static.log

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/fixture-arity-static.log", "utf8");
            const getVal = (pattern) => log.match(pattern)?.[1] || "0";

            let env = "";
            env += `FIXTURE_ARITY_STATIC_RESULT=${log.match(/FIXTURE_ARITY_STATIC_RESULT=(PASS|FAIL)/)?.[1] || "FAIL"}\n`;
            env += `ARITY_CHECKED_INSERT_COUNT=${getVal(/ARITY_CHECKED_INSERT_COUNT=(\d+)/)}\n`;
            env += `ARITY_NON_VALUES_INSERT_COUNT=${getVal(/ARITY_NON_VALUES_INSERT_COUNT=(\d+)/)}\n`;
            env += `ARITY_MISMATCH_DISTINCT_COUNT=${getVal(/ARITY_MISMATCH_DISTINCT_COUNT=(\d+)/)}\n`;
            env += `ARITY_MISMATCH_OCCURRENCE_COUNT=${getVal(/ARITY_MISMATCH_OCCURRENCE_COUNT=(\d+)/)}\n`;
            env += `ARITY_UNSUPPORTED_STATEMENT_COUNT=${getVal(/ARITY_UNSUPPORTED_STATEMENT_COUNT=(\d+)/)}\n`;
            fs.writeFileSync("/tmp/e2-artifacts/05-arity-static.env", env);
          '

      - name: Execute pgTAP DB Acceptance Suites
        id: pgtap_suites
        if: always()
        run: |
          write_not_executed() {
            local file="$1"
            local prefix="$2"
            echo "${prefix}_PGTAP_PLANNED_COUNT=0" > "${file}"
            echo "${prefix}_PGTAP_EXECUTED_COUNT=0" >> "${file}"
            echo "${prefix}_PGTAP_COUNT=0" >> "${file}"
            echo "${prefix}_PGTAP_PASSED_COUNT=0" >> "${file}"
            echo "${prefix}_PGTAP_FAILED_COUNT=0" >> "${file}"
            echo "${prefix}_PGTAP_RESULT=NOT_EXECUTED" >> "${file}"
            echo "${prefix}_PGTAP_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> "${file}"
            echo "${prefix}_PGTAP_FAILURE_CLASS=NOT_EXECUTED" >> "${file}"
          }

          if [ "${{ steps.migration_replay.conclusion }}" != "success" ]; then
            write_not_executed "/tmp/e2-artifacts/06-pgtap-foundation.env" "FOUNDATION"
            write_not_executed "/tmp/e2-artifacts/07-pgtap-slice3.env" "SLICE3"
            write_not_executed "/tmp/e2-artifacts/08-pgtap-slice4-block1.env" "SLICE4_BLOCK1"
            write_not_executed "/tmp/e2-artifacts/09-pgtap-slice4-block2.env" "SLICE4_BLOCK2"
            write_not_executed "/tmp/e2-artifacts/10-pgtap-clinic-domain.env" "CLINIC_DOMAIN"
            write_not_executed "/tmp/e2-artifacts/11-pgtap-clinic-ops.env" "CLINIC_OPS"
            write_not_executed "/tmp/e2-artifacts/12-pgtap-clinic-hardening.env" "CLINIC_HARDENING"
            write_not_executed "/tmp/e2-artifacts/13-pgtap-public-booking.env" "PUBLIC_BOOKING"
            echo "ZERO_TEST_SUITE_COUNT=8" > /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            exit 0
          fi

          set -euo pipefail
          export PGPASSWORD=postgres
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

          SUITE_FAILURES=0
          ZERO_TEST_COUNT=0

          run_suite() {
            local suite_file="$1"
            local result_prefix="$2"
            local frag_file="$3"
            local log_file="/tmp/e2-artifacts/pgtap-${result_prefix}.txt"
            
            echo "=== Running ${suite_file} ==="
            set +e
            pg_prove --verbose -h 127.0.0.1 -p 54322 -U postgres -d postgres "${suite_file}" > "${log_file}" 2>&1
            local prove_status=$?
            set -e

            local planned_count=0
            local plan_line
            plan_line=$(grep -E "^1\.\.[0-9]+" "${log_file}" | head -n 1 || true)
            if [ -n "${plan_line}" ]; then
              planned_count=$(echo "${plan_line}" | cut -d'.' -f3)
            fi

            local passed_count
            passed_count=$(grep -c "^ok " "${log_file}" || true)
            passed_count=${passed_count:-0}

            local failed_count
            failed_count=$(grep -c "^not ok " "${log_file}" || true)
            failed_count=${failed_count:-0}

            local executed_count=$((passed_count + failed_count))

            echo "${result_prefix}_PGTAP_PLANNED_COUNT=${planned_count}" > "${frag_file}"
            echo "${result_prefix}_PGTAP_EXECUTED_COUNT=${executed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_COUNT=${executed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_PASSED_COUNT=${passed_count}" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_FAILED_COUNT=${failed_count}" >> "${frag_file}"

            if [ "${executed_count}" -eq 0 ]; then
              echo "ERROR: Zero tests executed in ${suite_file}!"
              ZERO_TEST_COUNT=$((ZERO_TEST_COUNT + 1))
              echo "${result_prefix}_PGTAP_RESULT=FAIL" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_FAILURE_CLASS=SETUP_OR_PARSE_FAILURE" >> "${frag_file}"
              SUITE_FAILURES=$((SUITE_FAILURES + 1))
              return 0
            fi

            if [ "${prove_status}" -ne 0 ] || [ "${planned_count}" -eq 0 ] || [ "${executed_count}" -ne "${planned_count}" ] || [ "${failed_count}" -gt 0 ]; then
              echo "${result_prefix}_PGTAP_RESULT=FAIL" >> "${frag_file}"
              echo "${result_prefix}_PGTAP_FAILURE_CLASS=ASSERTION_FAILURE" >> "${frag_file}"
              echo "ERROR: ${suite_file} failed (prove_status=${prove_status}, planned=${planned_count}, executed=${executed_count}, failed=${failed_count})"
              SUITE_FAILURES=$((SUITE_FAILURES + 1))
              return 0
            fi

            echo "${result_prefix}_PGTAP_RESULT=PASS" >> "${frag_file}"
            echo "${result_prefix}_PGTAP_FAILURE_CLASS=NONE" >> "${frag_file}"
          }

          run_suite "supabase/tests/health_tourism_foundation_server_authority_tests.sql" "FOUNDATION" "/tmp/e2-artifacts/06-pgtap-foundation.env"
          run_suite "supabase/tests/health_tourism_lead_ops_ai_assist_tests.sql" "SLICE3" "/tmp/e2-artifacts/07-pgtap-slice3.env"
          run_suite "supabase/tests/health_tourism_clinic_acceptance_tests.sql" "SLICE4_BLOCK1" "/tmp/e2-artifacts/08-pgtap-slice4-block1.env"
          run_suite "supabase/tests/health_tourism_clinic_acceptance_workspace_tests.sql" "SLICE4_BLOCK2" "/tmp/e2-artifacts/09-pgtap-slice4-block2.env"
          run_suite "supabase/tests/clinic_domain_server_authority_tests.sql" "CLINIC_DOMAIN" "/tmp/e2-artifacts/10-pgtap-clinic-domain.env"
          run_suite "supabase/tests/clinic_operational_integration_tests.sql" "CLINIC_OPS" "/tmp/e2-artifacts/11-pgtap-clinic-ops.env"
          run_suite "supabase/tests/clinic_workspace_authority_hardening_tests.sql" "CLINIC_HARDENING" "/tmp/e2-artifacts/12-pgtap-clinic-hardening.env"
          run_suite "supabase/tests/public_booking_rpc_behavioral_tests.sql" "PUBLIC_BOOKING" "/tmp/e2-artifacts/13-pgtap-public-booking.env"

          echo "ZERO_TEST_SUITE_COUNT=${ZERO_TEST_COUNT}" > /tmp/e2-artifacts/13b-pgtap-summary.env
          if [ "${SUITE_FAILURES}" -gt 0 ]; then
            echo "PGTAP_PHASE_RESULT=FAIL" >> /tmp/e2-artifacts/13b-pgtap-summary.env
          else
            echo "PGTAP_PHASE_RESULT=PASS" >> /tmp/e2-artifacts/13b-pgtap-summary.env
          fi

      - name: Run Real 2-Session Concurrency Harness
        id: concurrency
        if: always()
        run: |
          if [ "${{ steps.migration_replay.conclusion }}" != "success" ] || [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "REAL_TWO_SESSION_CONCURRENCY_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/14-concurrency.env
            echo "REAL_TWO_SESSION_CONCURRENCY_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "CONTROLLER_LOCK_BARRIER_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "INDEPENDENT_DB_CONNECTION_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "CONCURRENCY_ROUND_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_1_WINNER=none" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_1_ACTIVE_APPOINTMENT_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_2_WINNER=none" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_2_ACTIVE_APPOINTMENT_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_3_WINNER=none" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_3_ACTIVE_APPOINTMENT_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "HT_WIN_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "HT_WIN_PROVENANCE_RESULT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "BOTH_SUCCESS_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "DEADLOCK_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "TIMEOUT_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_CUSTOMER_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_APPOINTMENT_COUNT=0" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_ENCOUNTER_AUTOCREATE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_EXTERNAL_SIDE_EFFECT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            exit 0
          fi

          set -euo pipefail
          export PGHOST=127.0.0.1
          export PGPORT=54322
          export PGDATABASE=postgres
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export E2_MODE=true

          echo "=== RUNNING REAL 2-SESSION CONCURRENCY HARNESS ==="
          node scripts/test-health-tourism-slice4-booking-concurrency.mjs 2>&1 | tee /tmp/e2-artifacts/concurrency-raw.log

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/concurrency-raw.log", "utf8");

            const getRequiredMatch = (pattern, name) => {
              const m = log.match(pattern);
              if (!m) {
                console.error(`HARNESS_PARSER_FATAL: Required metric "${name}" absent from harness log!`);
                process.exit(1);
              }
              return m[1];
            };

            const concurrencyResult = getRequiredMatch(/REAL_TWO_SESSION_CONCURRENCY_RESULT=(PASS|FAIL|NOT_EXECUTED)/, "REAL_TWO_SESSION_CONCURRENCY_RESULT");
            const lockBarrierResult = getRequiredMatch(/CONTROLLER_LOCK_BARRIER_RESULT=(\w+)/, "CONTROLLER_LOCK_BARRIER_RESULT");
            const bothBlockedResult = getRequiredMatch(/BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=(\w+)/, "BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT");
            const connCount = parseInt(getRequiredMatch(/INDEPENDENT_DB_CONNECTION_COUNT=(\d+)/, "INDEPENDENT_DB_CONNECTION_COUNT"), 10);
            const roundCount = parseInt(getRequiredMatch(/CONCURRENCY_ROUND_COUNT=(\d+)/, "CONCURRENCY_ROUND_COUNT"), 10);

            const r1Winner = getRequiredMatch(/Round 1 Winner:\s*(\w+)/, "ROUND_1_WINNER");
            const r1Active = parseInt(getRequiredMatch(/Round 1:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/, "ROUND_1_ACTIVE_APPOINTMENT_COUNT"), 10);
            const r2Winner = getRequiredMatch(/Round 2 Winner:\s*(\w+)/, "ROUND_2_WINNER");
            const r2Active = parseInt(getRequiredMatch(/Round 2:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/, "ROUND_2_ACTIVE_APPOINTMENT_COUNT"), 10);
            const r3Winner = getRequiredMatch(/Round 3 Winner:\s*(\w+)/, "ROUND_3_WINNER");
            const r3Active = parseInt(getRequiredMatch(/Round 3:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/, "ROUND_3_ACTIVE_APPOINTMENT_COUNT"), 10);

            const htWinCount = parseInt(getRequiredMatch(/HT_WIN_COUNT=(\d+)/, "HT_WIN_COUNT"), 10);
            const htWinProvResult = getRequiredMatch(/HT_WIN_PROVENANCE_RESULT=(PASS|NOT_OBSERVED)/, "HT_WIN_PROVENANCE_RESULT");

            const bothSuccess = parseInt(getRequiredMatch(/BOTH_SUCCESS_COUNT=(\d+)/, "BOTH_SUCCESS_COUNT"), 10);
            const deadlock = parseInt(getRequiredMatch(/DEADLOCK_COUNT=(\d+)/, "DEADLOCK_COUNT"), 10);
            const timeout = parseInt(getRequiredMatch(/TIMEOUT_COUNT=(\d+)/, "TIMEOUT_COUNT"), 10);

            const losingCust = parseInt(getRequiredMatch(/LOSING_HT_PARTIAL_CUSTOMER_COUNT=(\d+)/, "LOSING_HT_PARTIAL_CUSTOMER_COUNT"), 10);
            const losingProf = parseInt(getRequiredMatch(/LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=(\d+)/, "LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT"), 10);
            const losingAppt = parseInt(getRequiredMatch(/LOSING_HT_PARTIAL_APPOINTMENT_COUNT=(\d+)/, "LOSING_HT_PARTIAL_APPOINTMENT_COUNT"), 10);

            const noEncounter = getRequiredMatch(/NO_ENCOUNTER_AUTOCREATE_RESULT=(PASS|FAIL)/, "NO_ENCOUNTER_AUTOCREATE_RESULT");
            const noSideEffect = getRequiredMatch(/NO_EXTERNAL_SIDE_EFFECT_RESULT=(PASS|FAIL)/, "NO_EXTERNAL_SIDE_EFFECT_RESULT");

            let envAdd = "";
            envAdd += `REAL_TWO_SESSION_CONCURRENCY_RESULT=${concurrencyResult}\n`;
            envAdd += `CONTROLLER_LOCK_BARRIER_RESULT=${lockBarrierResult}\n`;
            envAdd += `BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=${bothBlockedResult}\n`;
            envAdd += `INDEPENDENT_DB_CONNECTION_COUNT=${connCount}\n`;
            envAdd += `CONCURRENCY_ROUND_COUNT=${roundCount}\n`;
            envAdd += `ROUND_1_WINNER=${r1Winner}\n`;
            envAdd += `ROUND_1_ACTIVE_APPOINTMENT_COUNT=${r1Active}\n`;
            envAdd += `ROUND_2_WINNER=${r2Winner}\n`;
            envAdd += `ROUND_2_ACTIVE_APPOINTMENT_COUNT=${r2Active}\n`;
            envAdd += `ROUND_3_WINNER=${r3Winner}\n`;
            envAdd += `ROUND_3_ACTIVE_APPOINTMENT_COUNT=${r3Active}\n`;
            envAdd += `HT_WIN_COUNT=${htWinCount}\n`;
            envAdd += `HT_WIN_PROVENANCE_RESULT=${htWinProvResult}\n`;
            envAdd += `BOTH_SUCCESS_COUNT=${bothSuccess}\n`;
            envAdd += `DEADLOCK_COUNT=${deadlock}\n`;
            envAdd += `TIMEOUT_COUNT=${timeout}\n`;
            envAdd += `LOSING_HT_PARTIAL_CUSTOMER_COUNT=${losingCust}\n`;
            envAdd += `LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=${losingProf}\n`;
            envAdd += `LOSING_HT_PARTIAL_APPOINTMENT_COUNT=${losingAppt}\n`;
            envAdd += `NO_ENCOUNTER_AUTOCREATE_RESULT=${noEncounter}\n`;
            envAdd += `NO_EXTERNAL_SIDE_EFFECT_RESULT=${noSideEffect}\n`;

            fs.writeFileSync("/tmp/e2-artifacts/14-concurrency.env", envAdd);
          '

      - name: Application & Executable Regression Suites
        id: block2_application
        if: always()
        run: |
          run_app_cmd() {
            local cmd="$1"
            local item_key="$2"
            local grp_key="$3"
            local file="$4"

            if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
              echo "${item_key}=NOT_EXECUTED" > "${file}"
              echo "${item_key}_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> "${file}"
              if [ -n "${grp_key}" ]; then echo "${grp_key}=NOT_EXECUTED" >> "${file}"; fi
              return 0
            fi

            set +e
            eval "${cmd}" >> /tmp/e2-artifacts/application-results.txt 2>&1
            local status=${PIPESTATUS[0]}
            set -e

            if [ ${status} -eq 0 ]; then
              echo "${item_key}=PASS" > "${file}"
              if [ -n "${grp_key}" ]; then echo "${grp_key}=PASS" >> "${file}"; fi
            else
              echo "${item_key}=FAIL" > "${file}"
              echo "${item_key}_FAILURE_REASON=EXIT_CODE_${status}" >> "${file}"
              if [ -n "${grp_key}" ]; then echo "${grp_key}=FAIL" >> "${file}"; fi
            fi
          }

          run_app_cmd "npm run test:ht-slice4-block2" "HT_SLICE4_BLOCK2_APP_RESULT" "BLOCK2_APPLICATION_RESULT" "/tmp/e2-artifacts/15-app-ht-slice4-block2.env"
          run_app_cmd "npm run test:ht-slice4-block1" "HT_SLICE4_BLOCK1_APP_RESULT" "BLOCK1_REGRESSION" "/tmp/e2-artifacts/16-app-ht-slice4-block1.env"
          run_app_cmd "npm run qa:health-tourism-foundation" "HT_FOUNDATION_APP_RESULT" "FOUNDATION_REGRESSION" "/tmp/e2-artifacts/17-app-ht-foundation.env"
          run_app_cmd "npm run qa:health-tourism-slice3" "HT_SLICE3_APP_RESULT" "SLICE3_REGRESSION" "/tmp/e2-artifacts/18-app-ht-slice3.env"

          run_app_cmd "npm run qa:clinic-domain" "CLINIC_DOMAIN_APP_RESULT" "" "/tmp/e2-artifacts/19-app-clinic-domain.env"
          run_app_cmd "npm run qa:clinic-application-contracts" "CLINIC_APPLICATION_CONTRACTS_APP_RESULT" "" "/tmp/e2-artifacts/20-app-clinic-contracts.env"
          run_app_cmd "npm run qa:clinic-operational" "CLINIC_OPERATIONAL_APP_RESULT" "" "/tmp/e2-artifacts/21-app-clinic-operational.env"
          run_app_cmd "npm run qa:clinic-workspace" "CLINIC_WORKSPACE_APP_RESULT" "" "/tmp/e2-artifacts/22-app-clinic-workspace.env"

          if grep -q "=PASS" /tmp/e2-artifacts/19-app-clinic-domain.env && \
             grep -q "=PASS" /tmp/e2-artifacts/20-app-clinic-contracts.env && \
             grep -q "=PASS" /tmp/e2-artifacts/21-app-clinic-operational.env && \
             grep -q "=PASS" /tmp/e2-artifacts/22-app-clinic-workspace.env; then
            echo "CLINIC_REGRESSION=PASS" > /tmp/e2-artifacts/22b-app-clinic-summary.env
          else
            echo "CLINIC_REGRESSION=FAIL" > /tmp/e2-artifacts/22b-app-clinic-summary.env
          fi

          run_app_cmd "node scripts/test-health-tourism-slice2-public-intake.mjs" "HT_SLICE2_APP_RESULT" "SLICE2_REGRESSION" "/tmp/e2-artifacts/23-app-ht-slice2.env"

      - name: Typecheck Application
        id: typecheck
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "TYPECHECK_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/24-typecheck.env
            echo "TYPECHECK_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/24-typecheck.env
            exit 0
          fi

          set +e
          npm run typecheck 2>&1 | tee /tmp/e2-artifacts/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ${status} -eq 0 ]; then
            echo "TYPECHECK_RESULT=PASS" > /tmp/e2-artifacts/24-typecheck.env
          else
            echo "TYPECHECK_RESULT=FAIL" > /tmp/e2-artifacts/24-typecheck.env
            echo "TYPECHECK_RESULT_FAILURE_REASON=TYPECHECK_EXIT_${status}" >> /tmp/e2-artifacts/24-typecheck.env
          fi

      - name: Lint Application
        id: lint
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "LINT_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/25-lint.env
            echo "LINT_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/25-lint.env
            exit 0
          fi

          set +e
          npm run lint 2>&1 | tee /tmp/e2-artifacts/lint.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ${status} -eq 0 ]; then
            echo "LINT_RESULT=PASS" > /tmp/e2-artifacts/25-lint.env
          else
            echo "LINT_RESULT=FAIL" > /tmp/e2-artifacts/25-lint.env
            echo "LINT_RESULT_FAILURE_REASON=LINT_EXIT_${status}" >> /tmp/e2-artifacts/25-lint.env
          fi

      - name: Build Application Bundle
        id: build
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "BUILD_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/26-build.env
            echo "BUILD_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/26-build.env
            exit 0
          fi

          set +e
          npm run build 2>&1 | tee /tmp/e2-artifacts/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ${status} -eq 0 ]; then
            echo "BUILD_RESULT=PASS" > /tmp/e2-artifacts/26-build.env
          else
            echo "BUILD_RESULT=FAIL" > /tmp/e2-artifacts/26-build.env
            echo "BUILD_RESULT_FAILURE_REASON=BUILD_EXIT_${status}" >> /tmp/e2-artifacts/26-build.env
          fi

      - name: Secret Scan & Safety Check
        id: secret_scan
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "SECRET_SCAN_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/27-secret-scan.env
            echo "SECRET_SCAN_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/27-secret-scan.env
            exit 0
          fi

          set +e
          node scripts/scan-frontend-secrets.mjs 2>&1 | tee /tmp/e2-artifacts/secret-scan.log
          status=${PIPESTATUS[0]}
          set -e
          if [ ${status} -eq 0 ]; then
            echo "SECRET_SCAN_RESULT=PASS" > /tmp/e2-artifacts/27-secret-scan.env
          else
            echo "SECRET_SCAN_RESULT=FAIL" > /tmp/e2-artifacts/27-secret-scan.env
            echo "SECRET_SCAN_RESULT_FAILURE_REASON=SECRET_SCAN_EXIT_${status}" >> /tmp/e2-artifacts/27-secret-scan.env
          fi

      - name: Write Explicit Containment Evidence
        id: containment_evidence
        if: always()
        run: |
          cat << EOF > /tmp/e2-artifacts/28-containment.env
          REMOTE_SUPABASE_ACCESS_COUNT=0
          SHARED_STAGING_ACCESS_COUNT=0
          PRODUCTION_ACCESS_COUNT=0
          DEPLOYMENT_COUNT=0
          CONTROL_PLANE_MUTATION_COUNT=0
          AOS_MUTATION_COUNT=0
          EOF

      - name: Aggregate Evidence & Evaluate Composite Gate
        id: generate_results
        if: always()
        run: |
          CHECKED_SHA=$(git rev-parse HEAD)
          cat << EOF > /tmp/e2-artifacts/provenance.json
          {
            "candidate_sha": "e74d097b2ba1160bc852e84503aa6368b23d43eb",
            "evidence_workflow_sha": "${GITHUB_SHA}",
            "checked_out_sha": "${CHECKED_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "job_key": "${GITHUB_JOB}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          node scripts/aggregate-lari-e2-evidence.mjs

      - name: Upload E2 Evidence Artifacts
        id: upload_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lari-health-tourism-slice4-final-e2-r9-evidence
          path: /tmp/e2-artifacts/*

      - name: Enforce Slice 4 E2 Authority Result
        id: enforce_e2_result
        if: always()
        run: |
          cat /tmp/e2-artifacts/results.env
          if grep -q "SLICE4_E2_RESULT=PASS_CANDIDATE" /tmp/e2-artifacts/results.env; then
            echo "✅ Slice 4 E2 Composite Acceptance PASSED CANDIDATE"
            exit 0
          else
            echo "❌ Slice 4 E2 Composite Acceptance FAILED"
            exit 1
          fi
