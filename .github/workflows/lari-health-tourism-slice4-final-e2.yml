            echo "REAL_TWO_SESSION_CONCURRENCY_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/14-concurrency.env
            echo "REAL_TWO_SESSION_CONCURRENCY_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "CONTROLLER_LOCK_BARRIER_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "CONTROLLER_LOCK_BARRIER_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "INDEPENDENT_DB_CONNECTION_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "CONCURRENCY_ROUND_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_1_WINNER=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_1_ACTIVE_APPOINTMENT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_2_WINNER=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_2_ACTIVE_APPOINTMENT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_3_WINNER=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "ROUND_3_ACTIVE_APPOINTMENT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "HT_WIN_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "HT_WIN_PROVENANCE_RESULT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "BOTH_SUCCESS_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "DEADLOCK_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "TIMEOUT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_CUSTOMER_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "LOSING_HT_PARTIAL_APPOINTMENT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_ENCOUNTER_AUTOCREATE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_ENCOUNTER_AUTOCREATE_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_EXTERNAL_SIDE_EFFECT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/14-concurrency.env
            echo "NO_EXTERNAL_SIDE_EFFECT_RESULT_NOT_EXECUTED_REASON=PREREQUISITE_FAILED" >> /tmp/e2-artifacts/14-concurrency.env
            exit 0
          fi

          export PGHOST=127.0.0.1
          export PGPORT=54322
          export PGDATABASE=postgres
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export E2_MODE=true

          echo "=== RUNNING REAL 2-SESSION CONCURRENCY HARNESS ==="
          set +e
          node scripts/test-health-tourism-slice4-booking-concurrency.mjs > /tmp/e2-artifacts/concurrency-raw.log 2>&1
          conc_status=$?
          set -e

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/concurrency-raw.log", "utf8");
            const rawExit = '${conc_status}';
            const exitCode = Number(rawExit);

            if (!Number.isInteger(exitCode) || exitCode < 0) {
              throw new Error("INVALID_CONCURRENCY_EXIT_CODE_" + rawExit);
            }

            const getOptMatch = (pattern) => {
              const m = log.match(pattern);
              return m ? m[1] : undefined;
            };

            const rawConcRes = getOptMatch(/REAL_TWO_SESSION_CONCURRENCY_RESULT=(PASS|FAIL|NOT_EXECUTED)/);
            const lockBarrierResult = getOptMatch(/CONTROLLER_LOCK_BARRIER_RESULT=(\w+)/);
            const bothBlockedResult = getOptMatch(/BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=(\w+)/);
            const connCount = getOptMatch(/INDEPENDENT_DB_CONNECTION_COUNT=(\d+)/);
            const roundCount = getOptMatch(/CONCURRENCY_ROUND_COUNT=(\d+)/);

            const r1Winner = getOptMatch(/Round 1 Winner:\s*(ht|core)/);
            const r1Active = getOptMatch(/Round 1:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/);
            const r2Winner = getOptMatch(/Round 2 Winner:\s*(ht|core)/);
            const r2Active = getOptMatch(/Round 2:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/);
            const r3Winner = getOptMatch(/Round 3 Winner:\s*(ht|core)/);
            const r3Active = getOptMatch(/Round 3:\s*ACTIVE_APPOINTMENTS_AT_CONTESTED_SLOT\s*=\s*(\d+)/);

            const htWinCount = getOptMatch(/HT_WIN_COUNT=(\d+)/);
            const htWinProvResult = getOptMatch(/HT_WIN_PROVENANCE_RESULT=(PASS|NOT_OBSERVED)/);

            const bothSuccess = getOptMatch(/BOTH_SUCCESS_COUNT=(\d+)/);
            const deadlock = getOptMatch(/DEADLOCK_COUNT=(\d+)/);
            const timeout = getOptMatch(/TIMEOUT_COUNT=(\d+)/);

            const losingCust = getOptMatch(/LOSING_HT_PARTIAL_CUSTOMER_COUNT=(\d+)/);
            const losingProf = getOptMatch(/LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=(\d+)/);
            const losingAppt = getOptMatch(/LOSING_HT_PARTIAL_APPOINTMENT_COUNT=(\d+)/);

            const noEncounter = getOptMatch(/NO_ENCOUNTER_AUTOCREATE_RESULT=(PASS|FAIL)/);
            const noSideEffect = getOptMatch(/NO_EXTERNAL_SIDE_EFFECT_RESULT=(PASS|FAIL)/);

            let concurrencyResult = "FAIL";
            let concurrencyFailReason = "";

            if (exitCode !== 0) {
              concurrencyResult = "FAIL";
              concurrencyFailReason = "HARNESS_EXIT_" + exitCode;
            } else if (!rawConcRes || !lockBarrierResult || !bothBlockedResult || !connCount || !roundCount || !r1Winner || !r1Active || !r2Winner || !r2Active || !r3Winner || !r3Active || !htWinCount || !htWinProvResult || !bothSuccess || !deadlock || !timeout || !losingCust || !losingProf || !losingAppt || !noEncounter || !noSideEffect) {
              concurrencyResult = "FAIL";
              concurrencyFailReason = "CONCURRENCY_EVIDENCE_PARSE_INCOMPLETE";
            } else {
              concurrencyResult = rawConcRes;
              if (concurrencyResult === "FAIL") concurrencyFailReason = "CONCURRENCY_HARNESS_REPORTED_FAIL";
            }

            const evalStatus = (val, keyName) => {
              if (val) return val;
              if (exitCode !== 0) return "NOT_EXECUTED";
              return "FAIL";
            };

            const finalLockBarrier = evalStatus(lockBarrierResult, "CONTROLLER_LOCK_BARRIER_RESULT");
            const finalBothBlocked = evalStatus(bothBlockedResult, "BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT");
            const finalNoEncounter = evalStatus(noEncounter, "NO_ENCOUNTER_AUTOCREATE_RESULT");
            const finalNoSideEffect = evalStatus(noSideEffect, "NO_EXTERNAL_SIDE_EFFECT_RESULT");

            let envAdd = "";
            envAdd += `REAL_TWO_SESSION_CONCURRENCY_RESULT=${concurrencyResult}\n`;
            if (concurrencyResult === "FAIL") envAdd += `REAL_TWO_SESSION_CONCURRENCY_RESULT_FAILURE_REASON=${concurrencyFailReason}\n`;

            envAdd += `CONTROLLER_LOCK_BARRIER_RESULT=${finalLockBarrier}\n`;
            if (finalLockBarrier === "FAIL") {
              envAdd += `CONTROLLER_LOCK_BARRIER_RESULT_FAILURE_REASON=LOCK_BARRIER_FAILED\n`;
            } else if (finalLockBarrier === "NOT_EXECUTED") {
              envAdd += `CONTROLLER_LOCK_BARRIER_RESULT_NOT_EXECUTED_REASON=HARNESS_TERMINATED_BEFORE_CONTROLLER_LOCK_BARRIER_RESULT\n`;
            }

            envAdd += `BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT=${finalBothBlocked}\n`;
            if (finalBothBlocked === "FAIL") {
              envAdd += `BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT_FAILURE_REASON=BARRIER_RELEASE_FAILED\n`;
            } else if (finalBothBlocked === "NOT_EXECUTED") {
              envAdd += `BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT_NOT_EXECUTED_REASON=HARNESS_TERMINATED_BEFORE_BOTH_CALLS_BLOCKED_BEFORE_RELEASE_RESULT\n`;
            }

            envAdd += `INDEPENDENT_DB_CONNECTION_COUNT=${connCount || "NOT_OBSERVED"}\n`;
            envAdd += `CONCURRENCY_ROUND_COUNT=${roundCount || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_1_WINNER=${r1Winner || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_1_ACTIVE_APPOINTMENT_COUNT=${r1Active || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_2_WINNER=${r2Winner || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_2_ACTIVE_APPOINTMENT_COUNT=${r2Active || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_3_WINNER=${r3Winner || "NOT_OBSERVED"}\n`;
            envAdd += `ROUND_3_ACTIVE_APPOINTMENT_COUNT=${r3Active || "NOT_OBSERVED"}\n`;
            envAdd += `HT_WIN_COUNT=${htWinCount || "NOT_OBSERVED"}\n`;
            envAdd += `HT_WIN_PROVENANCE_RESULT=${htWinProvResult || "NOT_OBSERVED"}\n`;
            envAdd += `BOTH_SUCCESS_COUNT=${bothSuccess || "NOT_OBSERVED"}\n`;
            envAdd += `DEADLOCK_COUNT=${deadlock || "NOT_OBSERVED"}\n`;
            envAdd += `TIMEOUT_COUNT=${timeout || "NOT_OBSERVED"}\n`;
            envAdd += `LOSING_HT_PARTIAL_CUSTOMER_COUNT=${losingCust || "NOT_OBSERVED"}\n`;
            envAdd += `LOSING_HT_PARTIAL_PATIENT_PROFILE_COUNT=${losingProf || "NOT_OBSERVED"}\n`;
            envAdd += `LOSING_HT_PARTIAL_APPOINTMENT_COUNT=${losingAppt || "NOT_OBSERVED"}\n`;

            envAdd += `NO_ENCOUNTER_AUTOCREATE_RESULT=${finalNoEncounter}\n`;
            if (finalNoEncounter === "FAIL") {
              envAdd += `NO_ENCOUNTER_AUTOCREATE_RESULT_FAILURE_REASON=ENCOUNTER_AUTOCREATE_DETECTED\n`;
            } else if (finalNoEncounter === "NOT_EXECUTED") {
              envAdd += `NO_ENCOUNTER_AUTOCREATE_RESULT_NOT_EXECUTED_REASON=HARNESS_TERMINATED_BEFORE_NO_ENCOUNTER_AUTOCREATE_RESULT\n`;
            }

            envAdd += `NO_EXTERNAL_SIDE_EFFECT_RESULT=${finalNoSideEffect}\n`;
            if (finalNoSideEffect === "FAIL") {
              envAdd += `NO_EXTERNAL_SIDE_EFFECT_RESULT_FAILURE_REASON=EXTERNAL_SIDE_EFFECT_DETECTED\n`;
            } else if (finalNoSideEffect === "NOT_EXECUTED") {
              envAdd += `NO_EXTERNAL_SIDE_EFFECT_RESULT_NOT_EXECUTED_REASON=HARNESS_TERMINATED_BEFORE_NO_EXTERNAL_SIDE_EFFECT_RESULT\n`;
            }

            fs.writeFileSync("/tmp/e2-artifacts/14-concurrency.env", envAdd);
          '

