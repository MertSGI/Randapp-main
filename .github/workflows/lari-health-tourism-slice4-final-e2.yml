name: LARI Health Tourism Slice 4 Final E2 Composite Acceptance

on:
  workflow_dispatch:

jobs:
  slice4-final-e2:
    name: Hosted Disposable E2 Composite Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Test-Support Commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: '7fd98fc369a3a886589db7be4e083b19b93378b5'

      - name: Initialize Evidence Directory
        id: init_artifacts
        run: |
          mkdir -p /tmp/e2-artifacts

      - name: Setup Node.js Environment
        id: setup_node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tool Dependencies (psql & pg_prove)
        id: tool_setup
        if: always()
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client libtap-parser-sourcehandler-pgtap-perl
          command -v psql
          command -v pg_prove

      - name: Start Pinned Supabase Postgres Container
        id: postgres_start
        if: always()
        run: |
          if [ "${{ steps.tool_setup.conclusion }}" != "success" ]; then
            echo "Tool setup failed."
            exit 1
          fi
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-slice4-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        id: postgres_ready
        if: always()
        run: |
          if [ "${{ steps.postgres_start.conclusion }}" != "success" ]; then
            echo "Postgres container start failed or skipped."
            exit 1
          fi
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          READY=0
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ ${READY} -ne 1 ]; then
            echo "Postgres readiness check timed out."
            exit 1
          fi
          psql "$DB_URL" -c "SELECT version();"

      - name: Execute Managed Runtime Bootstrap Fixture
        id: bootstrap
        if: always()
        run: |
          if [ "${{ steps.postgres_ready.conclusion }}" != "success" ]; then
            echo "Postgres readiness failed or skipped."
            exit 1
          fi
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: migration_replay
        if: always()
        run: |
          PREREQ_REASON=""
          if [ "${{ steps.tool_setup.conclusion }}" != "success" ]; then
            PREREQ_REASON="TOOL_SETUP_FAILED"
          elif [ "${{ steps.postgres_start.conclusion }}" != "success" ]; then
            PREREQ_REASON="POSTGRES_START_FAILED"
          elif [ "${{ steps.postgres_ready.conclusion }}" != "success" ]; then
            PREREQ_REASON="POSTGRES_READINESS_FAILED"
          elif [ "${{ steps.bootstrap.conclusion }}" != "success" ]; then
            PREREQ_REASON="BOOTSTRAP_FAILED"
          fi

          if [ -n "${PREREQ_REASON}" ]; then
            echo "MIGRATION_REPLAY_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_REPLAY_RESULT_NOT_EXECUTED_REASON=${PREREQ_REASON}" >> /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/01-migration.env
            exit 0
          fi

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          MIGRATION_TOTAL=${#MIGRATIONS[@]}
          if [ "${MIGRATION_TOTAL}" -ne 69 ]; then
            echo "MIGRATION_REPLAY_RESULT=FAIL" > /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_REPLAY_RESULT_FAILURE_REASON=MANIFEST_COUNT_MISMATCH_${MIGRATION_TOTAL}" >> /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_COUNT=0/${MIGRATION_TOTAL}" >> /tmp/e2-artifacts/01-migration.env
            exit 0
          fi

          APPLIED_COUNT=0
          FAILED_MIGRATION=""
          FAILED_EXIT=0

          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              set +e
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
              bridge_status=$?
              set -e
              if [ ${bridge_status} -ne 0 ]; then
                FAILED_MIGRATION="bridge_before_38"
                FAILED_EXIT=${bridge_status}
                break
              fi
            fi

            set +e
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}"
            mig_status=$?
            set -e

            if [ ${mig_status} -eq 0 ]; then
              APPLIED_COUNT=$((APPLIED_COUNT + 1))
            else
              FAILED_MIGRATION="${migration}"
              FAILED_EXIT=${mig_status}
              break
            fi
          done

          if [ -n "${FAILED_MIGRATION}" ]; then
            echo "MIGRATION_REPLAY_RESULT=FAIL" > /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_REPLAY_RESULT_FAILURE_REASON=MIGRATION_FAILED_${FAILED_MIGRATION}_EXIT_${FAILED_EXIT}" >> /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_COUNT=${APPLIED_COUNT}/${MIGRATION_TOTAL}" >> /tmp/e2-artifacts/01-migration.env
          else
            echo "MIGRATION_REPLAY_RESULT=PASS" > /tmp/e2-artifacts/01-migration.env
            echo "MIGRATION_COUNT=${APPLIED_COUNT}/${MIGRATION_TOTAL}" >> /tmp/e2-artifacts/01-migration.env
          fi

      - name: Verify Commercial Authority & Quota Contract
        id: commercial_verification
        if: always()
        run: |
          if [ "${{ steps.migration_replay.conclusion }}" != "success" ] || [ ! -f /tmp/e2-artifacts/01-migration.env ] || grep -q "MIGRATION_REPLAY_RESULT=FAIL" /tmp/e2-artifacts/01-migration.env || grep -q "MIGRATION_REPLAY_RESULT=NOT_EXECUTED" /tmp/e2-artifacts/01-migration.env; then
            echo "COMMERCIAL_BOOTSTRAP_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_BOOTSTRAP_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_ELIGIBILITY_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_ELIGIBILITY_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_CORE_BOOKING_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_CORE_BOOKING_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_STAFF_MANAGEMENT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_STAFF_MANAGEMENT_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_SERVICE_MANAGEMENT_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_SERVICE_MANAGEMENT_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_LARI_MINISITE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_LARI_MINISITE_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_STAFF_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_STAFF_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_SERVICES_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_SERVICES_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_BRANCHES_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_BRANCHES_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_MONTHLY_APPOINTMENTS_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_MAX_MONTHLY_APPOINTMENTS_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_FIXTURE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_FIXTURE_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_QUOTA_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/02-commercial.env
            echo "COMMERCIAL_QUOTA_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/02-commercial.env
            exit 0
          fi

          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/slice4_e2_commercial_verification.sql > /tmp/e2-artifacts/commercial-verification.log 2>&1
          psql_exit=$?
          set -e

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/commercial-verification.log", "utf8");
            const rawExit = '${psql_exit}';
            const exitCode = Number(rawExit);

            if (!Number.isInteger(exitCode) || exitCode < 0) {
              throw new Error("INVALID_PSQL_EXIT_CODE_" + rawExit);
            }

            const keys = [
              "COMMERCIAL_BOOTSTRAP_RESULT", "COMMERCIAL_ELIGIBILITY_RESULT",
              "COMMERCIAL_CORE_BOOKING_RESULT", "COMMERCIAL_STAFF_MANAGEMENT_RESULT",
              "COMMERCIAL_SERVICE_MANAGEMENT_RESULT", "COMMERCIAL_LARI_MINISITE_RESULT",
              "COMMERCIAL_MAX_STAFF_RESULT", "COMMERCIAL_MAX_SERVICES_RESULT",
              "COMMERCIAL_MAX_BRANCHES_RESULT", "COMMERCIAL_MAX_MONTHLY_APPOINTMENTS_RESULT",
              "COMMERCIAL_FIXTURE_RESULT", "COMMERCIAL_QUOTA_RESULT"
            ];
            let fragment = "";
            for (const k of keys) {
              if (exitCode !== 0) {
                if (k === "COMMERCIAL_FIXTURE_RESULT") {
                  fragment += k + "=FAIL\n";
                  fragment += k + "_FAILURE_REASON=COMMERCIAL_VERIFICATION_PSQL_EXIT_" + exitCode + "\n";
                } else if (log.includes(k + "=PASS")) {
                  fragment += k + "=PASS\n";
                } else {
                  fragment += k + "=FAIL\n";
                  fragment += k + "_FAILURE_REASON=COMMERCIAL_VERIFICATION_PSQL_EXIT_" + exitCode + "\n";
                }
              } else {
                if (log.includes(k + "=PASS")) {
                  fragment += k + "=PASS\n";
                } else {
                  fragment += k + "=FAIL\n";
                  fragment += k + "_FAILURE_REASON=MISSING_" + k + "_PASS_MARKER\n";
                }
              }
            }
            fs.writeFileSync("/tmp/e2-artifacts/02-commercial.env", fragment);
          '

      - name: Install Node Dependencies
        id: install_deps
        if: always()
        run: |
          npm ci

      - name: Run R9 Evidence Contract Self-Tests
        id: selftest
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "R9_SELFTEST_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/03-r9-selftest.env
            echo "R9_SELFTEST_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/03-r9-selftest.env
            exit 0
          fi

          set +e
          node scripts/test-r9-contracts-selftest.mjs > /tmp/e2-artifacts/contract-selftest.log 2>&1
          st_status=$?
          set -e

          if [ ${st_status} -eq 0 ]; then
            echo "R9_SELFTEST_RESULT=PASS" > /tmp/e2-artifacts/03-r9-selftest.env
          else
            echo "R9_SELFTEST_RESULT=FAIL" > /tmp/e2-artifacts/03-r9-selftest.env
            echo "R9_SELFTEST_RESULT_FAILURE_REASON=SELFTEST_EXIT_${st_status}" >> /tmp/e2-artifacts/03-r9-selftest.env
          fi

      - name: Execute Static Fixture UUID Contract Check
        id: uuid_contract
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "FIXTURE_UUID_STATIC_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/04-uuid-static.env
            echo "FIXTURE_UUID_STATIC_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/04-uuid-static.env
            echo "INVALID_UUID_DISTINCT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/04-uuid-static.env
            echo "INVALID_UUID_OCCURRENCE_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/04-uuid-static.env
            exit 0
          fi

          set +e
          node scripts/test-health-tourism-slice4-fixture-uuid-contract.mjs > /tmp/e2-artifacts/fixture-uuid-static.log 2>&1
          uuid_status=$?
          set -e

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/fixture-uuid-static.log", "utf8");
            const rawExit = '${uuid_status}';
            const exitCode = Number(rawExit);

            if (!Number.isInteger(exitCode) || exitCode < 0) {
              throw new Error("INVALID_UUID_EXIT_CODE_" + rawExit);
            }

            const hasMarker = log.includes("FIXTURE_UUID_STATIC_RESULT=");
            const rawRes = log.match(/FIXTURE_UUID_STATIC_RESULT=(PASS|FAIL)/)?.[1];
            const dist = log.match(/INVALID_UUID_DISTINCT_COUNT=(\d+)/)?.[1] || "NOT_OBSERVED";
            const occ = log.match(/INVALID_UUID_OCCURRENCE_COUNT=(\d+)/)?.[1] || "NOT_OBSERVED";

            let res = "FAIL";
            let reason = "";
            if (exitCode !== 0) {
              res = "FAIL";
              reason = "UUID_SCANNER_EXIT_" + exitCode;
            } else if (!hasMarker || !rawRes) {
              res = "FAIL";
              reason = "UUID_RESULT_MARKER_MISSING";
            } else {
              res = rawRes;
              if (res === "FAIL") reason = "UUID_SCANNER_MARKER_FAILED";
            }

            let env = "";
            env += `FIXTURE_UUID_STATIC_RESULT=${res}\n`;
            if (res === "FAIL") {
              env += `FIXTURE_UUID_STATIC_RESULT_FAILURE_REASON=${reason}\n`;
            }
            env += `INVALID_UUID_DISTINCT_COUNT=${dist}\n`;
            env += `INVALID_UUID_OCCURRENCE_COUNT=${occ}\n`;
            fs.writeFileSync("/tmp/e2-artifacts/04-uuid-static.env", env);
          '

      - name: Execute Static Fixture Arity Contract Check
        id: arity_contract
        if: always()
        run: |
          if [ "${{ steps.install_deps.conclusion }}" != "success" ]; then
            echo "FIXTURE_ARITY_STATIC_RESULT=NOT_EXECUTED" > /tmp/e2-artifacts/05-arity-static.env
            echo "FIXTURE_ARITY_STATIC_RESULT_NOT_EXECUTED_REASON=NPM_CI_FAILED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_CHECKED_INSERT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_NON_VALUES_INSERT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_MISMATCH_DISTINCT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_MISMATCH_OCCURRENCE_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/05-arity-static.env
            echo "ARITY_UNSUPPORTED_STATEMENT_COUNT=NOT_OBSERVED" >> /tmp/e2-artifacts/05-arity-static.env
            exit 0
          fi

          set +e
          node scripts/test-health-tourism-slice4-fixture-arity-contract.mjs > /tmp/e2-artifacts/fixture-arity-static.log 2>&1
          arity_status=$?
          set -e

          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/e2-artifacts/fixture-arity-static.log", "utf8");
            const rawExit = '${arity_status}';
            const exitCode = Number(rawExit);

            if (!Number.isInteger(exitCode) || exitCode < 0) {
              throw new Error("INVALID_ARITY_EXIT_CODE_" + rawExit);
            }

            const getVal = (pattern) => log.match(pattern)?.[1] || "NOT_OBSERVED";
            const hasMarker = log.includes("FIXTURE_ARITY_STATIC_RESULT=");
            const rawRes = log.match(/FIXTURE_ARITY_STATIC_RESULT=(PASS|FAIL)/)?.[1];

            let res = "FAIL";
            let reason = "";
            if (exitCode !== 0) {
              res = "FAIL";
              reason = "ARITY_SCANNER_EXIT_" + exitCode;
            } else if (!hasMarker || !rawRes) {
              res = "FAIL";
              reason = "ARITY_RESULT_MARKER_MISSING";
            } else {
              res = rawRes;
              if (res === "FAIL") reason = "ARITY_SCANNER_MARKER_FAILED";
            }

            let env = "";
            env += `FIXTURE_ARITY_STATIC_RESULT=${res}\n`;
            if (res === "FAIL") {
              env += `FIXTURE_ARITY_STATIC_RESULT_FAILURE_REASON=${reason}\n`;
            }
            env += `ARITY_CHECKED_INSERT_COUNT=${getVal(/ARITY_CHECKED_INSERT_COUNT=(\d+)/)}\n`;
            env += `ARITY_NON_VALUES_INSERT_COUNT=${getVal(/ARITY_NON_VALUES_INSERT_COUNT=(\d+)/)}\n`;
            env += `ARITY_MISMATCH_DISTINCT_COUNT=${getVal(/ARITY_MISMATCH_DISTINCT_COUNT=(\d+)/)}\n`;
            env += `ARITY_MISMATCH_OCCURRENCE_COUNT=${getVal(/ARITY_MISMATCH_OCCURRENCE_COUNT=(\d+)/)}\n`;
            env += `ARITY_UNSUPPORTED_STATEMENT_COUNT=${getVal(/ARITY_UNSUPPORTED_STATEMENT_COUNT=(\d+)/)}\n`;
            fs.writeFileSync("/tmp/e2-artifacts/05-arity-static.env", env);
          '

      - name: Execute pgTAP & Executable SQL DB Acceptance Suites
        id: pgtap_suites
        if: always()
        run: |
          write_not_executed() {
            local file="$1"
            local prefix="$2"
            local reason="$3"
            echo "${prefix}_PGTAP_PLANNED_COUNT=NOT_OBSERVED" > "${file}"
            echo "${prefix}_PGTAP_EXECUTED_COUNT=NOT_OBSERVED" >> "${file}"
            echo "${prefix}_PGTAP_COUNT=NOT_OBSERVED" >> "${file}"
            echo "${prefix}_PGTAP_PASSED_COUNT=NOT_OBSERVED" >> "${file}"
            echo "${prefix}_PGTAP_FAILED_COUNT=NOT_OBSERVED" >> "${file}"
            echo "${prefix}_PGTAP_RESULT=NOT_EXECUTED" >> "${file}"
            echo "${prefix}_PGTAP_RESULT_NOT_EXECUTED_REASON=${reason}" >> "${file}"
            echo "${prefix}_PGTAP_FAILURE_CLASS=NOT_EXECUTED" >> "${file}"
          }

          write_sql_not_executed() {
            local file="$1"
            local key="$2"
            local reason="$3"
            echo "${key}=NOT_EXECUTED" > "${file}"
            echo "${key}_NOT_EXECUTED_REASON=${reason}" >> "${file}"
          }

          if [ "${{ steps.migration_replay.conclusion }}" != "success" ] || [ ! -f /tmp/e2-artifacts/01-migration.env ] || grep -q "MIGRATION_REPLAY_RESULT=FAIL" /tmp/e2-artifacts/01-migration.env || grep -q "MIGRATION_REPLAY_RESULT=NOT_EXECUTED" /tmp/e2-artifacts/01-migration.env; then
            write_not_executed "/tmp/e2-artifacts/06-pgtap-foundation.env" "FOUNDATION" "MIGRATION_REPLAY_FAILED"
            write_not_executed "/tmp/e2-artifacts/07-pgtap-slice3.env" "SLICE3" "MIGRATION_REPLAY_FAILED"
            write_not_executed "/tmp/e2-artifacts/08-pgtap-slice4-block1.env" "SLICE4_BLOCK1" "MIGRATION_REPLAY_FAILED"
            write_not_executed "/tmp/e2-artifacts/09-pgtap-slice4-block2.env" "SLICE4_BLOCK2" "MIGRATION_REPLAY_FAILED"
            write_sql_not_executed "/tmp/e2-artifacts/10-sql-clinic-domain.env" "CLINIC_DOMAIN_SQL_EXECUTION_RESULT" "MIGRATION_REPLAY_FAILED"
            write_sql_not_executed "/tmp/e2-artifacts/11-sql-clinic-ops.env" "CLINIC_OPS_SQL_EXECUTION_RESULT" "MIGRATION_REPLAY_FAILED"
            write_sql_not_executed "/tmp/e2-artifacts/12-sql-clinic-hardening.env" "CLINIC_HARDENING_SQL_EXECUTION_RESULT" "MIGRATION_REPLAY_FAILED"
            write_sql_not_executed "/tmp/e2-artifacts/13-sql-public-booking.env" "PUBLIC_BOOKING_SQL_EXECUTION_RESULT" "MIGRATION_REPLAY_FAILED"
            echo "ZERO_TEST_SUITE_COUNT=NOT_OBSERVED" > /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT=NOT_EXECUTED" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            echo "PGTAP_PHASE_RESULT_NOT_EXECUTED_REASON=MIGRATION_REPLAY_FAILED" >> /tmp/e2-artifacts/13b-pgtap-summary.env
            exit 0
          fi

          export PGPASSWORD=postgres
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          run_sql_suite() {
            local suite_file="$1"
            local result_key="$2"
            local frag_file="$3"
            local marker="$4"
            local log_file="/tmp/e2-artifacts/sql-${result_key}.txt"

            echo "=== Running Executable SQL Suite ${suite_file} ==="
            set +e
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "${suite_file}" > "${log_file}" 2>&1
            local psql_exit=$?
            set -e

            if [ ${psql_exit} -ne 0 ]; then
              echo "${result_key}=FAIL" > "${frag_file}"
              echo "${result_key}_FAILURE_REASON=PSQL_EXIT_${psql_exit}" >> "${frag_file}"
              return 0
            fi

            if grep -q "${marker}" "${log_file}"; then
              echo "${result_key}=PASS" > "${frag_file}"
            else
              echo "${result_key}=FAIL" > "${frag_file}"
              echo "${result_key}_FAILURE_REASON=COMPLETION_MARKER_MISSING" >> "${frag_file}"
            fi
          }

          run_sql_suite "supabase/tests/clinic_domain_server_authority_tests.sql" "CLINIC_DOMAIN_SQL_EXECUTION_RESULT" "/tmp/e2-artifacts/10-sql-clinic-domain.env" "CLINIC_SQL_DB_EXECUTION=PASS"
          run_sql_suite "supabase/tests/clinic_operational_integration_tests.sql" "CLINIC_OPS_SQL_EXECUTION_RESULT" "/tmp/e2-artifacts/11-sql-clinic-ops.env" "CLINIC_BLOCK2_SQL_DB_EXECUTION=PASS"
          run_sql_suite "supabase/tests/clinic_workspace_authority_hardening_tests.sql" "CLINIC_HARDENING_SQL_EXECUTION_RESULT" "/tmp/e2-artifacts/12-sql-clinic-hardening.env" "CLINIC_WORKSPACE_AUTHORITY_HARDENING_DB_EXECUTION=PASS"
          run_sql_suite "supabase/tests/public_booking_rpc_behavioral_tests.sql" "PUBLIC_BOOKING_SQL_EXECUTION_RESULT" "/tmp/e2-artifacts/13-sql-public-booking.env" "PUBLIC_BOOKING_SQL_DB_EXECUTION=PASS"

          set +e
