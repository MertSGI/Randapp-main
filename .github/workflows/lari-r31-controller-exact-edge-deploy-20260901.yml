name: LARI R31 Controller Exact Edge Deploy 20260901

on:
  push:
    branches:
      - staging/supabase-staging-consistency
    paths:
      - .github/workflows/lari-r31-controller-exact-edge-deploy-20260901.yml

permissions:
  contents: read

jobs:
  deploy-r31-edge:
    name: Deploy R31 ht-ai-chat Edge Function
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: "miuecvkkmyvaciticwtm"
      EXPECTED_TARGET_SHA: "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a"

    steps:
      - name: Checkout exact frozen product SHA
        uses: actions/checkout@v4
        with:
          ref: "cc9c55e7fc841f4f16137b0a5e7c6f04b44b631a"

      - name: Verify Exact SHA Match
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD SHA:     ${HEAD_SHA}"
          echo "Expected SHA: ${EXPECTED_TARGET_SHA}"

          if [ "${HEAD_SHA}" != "${EXPECTED_TARGET_SHA}" ]; then
            echo "ERROR: HEAD SHA (${HEAD_SHA}) does not match expected target SHA (${EXPECTED_TARGET_SHA})"
            exit 1
          fi
          echo "EXACT_SHA_RESULT=PASS"

      - name: Secret Preflight
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ERROR: secrets.SUPABASE_ACCESS_TOKEN is missing or empty!"
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=YES"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.109.1"

      - name: Print Supabase CLI Version
        run: |
          supabase --version

      - name: Source Byte Proof Before Deploy
        run: |
          CANONICAL_INDEX_HASH=$(git show "${EXPECTED_TARGET_SHA}:supabase/functions/ht-ai-chat/index.ts" | sha256sum | awk '{print $1}')
          CANONICAL_POLICY_HASH=$(git show "${EXPECTED_TARGET_SHA}:supabase/functions/ht-ai-chat/provider-policy.ts" | sha256sum | awk '{print $1}')

          WORKTREE_INDEX_HASH=$(sha256sum supabase/functions/ht-ai-chat/index.ts | awk '{print $1}')
          WORKTREE_POLICY_HASH=$(sha256sum supabase/functions/ht-ai-chat/provider-policy.ts | awk '{print $1}')

          EXPECTED_INDEX="30498779f7a87c6c0e8669dfafd6eaf44cdcf478904b4390493c50b00409e810"
          EXPECTED_PROVIDER="8edb4386e9f43a62769dc05a14fdf50645caf17ad38bf4b1f92c5259b6f62bbb"

          echo "CANONICAL_INDEX_SHA256:         $CANONICAL_INDEX_HASH"
          echo "EXPECTED CANONICAL INDEX:       $EXPECTED_INDEX"
          echo "CANONICAL_PROVIDER_POLICY_SHA256: $CANONICAL_POLICY_HASH"
          echo "EXPECTED CANONICAL PROVIDER:    $EXPECTED_PROVIDER"
          echo "WORKTREE_INDEX_SHA256:          $WORKTREE_INDEX_HASH"
          echo "WORKTREE_PROVIDER_POLICY_SHA256:  $WORKTREE_POLICY_HASH"

          if [ "$CANONICAL_INDEX_HASH" != "$EXPECTED_INDEX" ]; then
            echo "ERROR: Canonical index hash mismatch!"
            exit 1
          fi
          echo "GIT_BLOB_INDEX_HASH_RESULT=PASS"

          if [ "$CANONICAL_POLICY_HASH" != "$EXPECTED_PROVIDER" ]; then
            echo "ERROR: Canonical provider policy hash mismatch!"
            exit 1
          fi
          echo "GIT_BLOB_POLICY_HASH_RESULT=PASS"

          if [ "$WORKTREE_INDEX_HASH" != "$CANONICAL_INDEX_HASH" ]; then
            echo "ERROR: Worktree index hash does not match canonical Git blob hash!"
            exit 1
          fi

          if [ "$WORKTREE_POLICY_HASH" != "$CANONICAL_POLICY_HASH" ]; then
            echo "ERROR: Worktree provider policy hash does not match canonical Git blob hash!"
            exit 1
          fi
          echo "WORKTREE_GIT_BLOB_BYTE_MATCH=PASS"

          if grep -q "\./provider-policy\.ts" supabase/functions/ht-ai-chat/index.ts; then
            echo "RELATIVE_IMPORT_RESULT=PASS"
          else
            echo "ERROR: Relative import search failed in index.ts"
            exit 1
          fi

      - name: Read-Only Connectivity Preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Running connectivity preflight..."
          LIST_OUT=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          echo "$LIST_OUT"
          if echo "$LIST_OUT" | grep -q "ht-ai-chat" && echo "$LIST_OUT" | grep -q "11"; then
            echo "GH_CONNECTIVITY_PREFLIGHT=PASS"
            echo "PRE_DEPLOY_VERSION=11"
          else
            echo "ERROR: Pre-deploy connectivity preflight did not observe ht-ai-chat version 11"
            exit 1
          fi

      - name: Exact Deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying ht-ai-chat to project $SUPABASE_PROJECT_ID..."
          supabase functions deploy ht-ai-chat \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
          echo "DEPLOYMENT_CALL_COUNT=1"
          echo "DEPLOYMENT_RESULT=PASS"

      - name: Post-Deploy Readback
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Reading back function list post-deployment..."
          POST_LIST=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          echo "$POST_LIST"
          if echo "$POST_LIST" | grep -q "ht-ai-chat" && echo "$POST_LIST" | grep -q "12"; then
            echo "POST_DEPLOY_LIST_RESULT=PASS"
            echo "POST_DEPLOY_VERSION=12"
          else
            echo "ERROR: Post-deploy readback did not show version 12!"
            exit 1
          fi
