name: LARI UI-V2 Booking E2E

on:
  push:
    branches:
      - "staging/ci-lari-ui-v2-booking-e2e-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-v2-booking-e2e:
    name: UI-V2 local booking journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DATA_MODE: local
      VITE_LAUNCH_MODE: local_pre_live
      VITE_PAYMENT_MODE: disabled
      VITE_PAYMENT_RUN_MODE: local_dry_run
      VITE_PAYMENT_PROVIDER: disabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build local-data payment-disabled application
        run: npm run build

      - name: Run UI-V2 booking E2E
        run: npm run qa:ui-v2-booking-e2e

      - name: Upload UI-V2 booking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-booking-e2e-${{ github.sha }}
          path: test-results/ui-v2-booking-e2e
          if-no-files-found: error
          retention-days: 14
