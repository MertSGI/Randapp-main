name: LARI P2A Isolated Local DB QA & Migration Verification

on:
  push:
    branches:
      - feature/p2a-commercial-core-foundation
  pull_request:
    branches:
      - feature/p2a-commercial-core-foundation

jobs:
  p2a-local-db-qa:
    name: Disposable Database-Only QA & Provisioning Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          docker --version
          docker info

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.145.0'

      - name: Start Disposable Local Postgres Database Container
        id: start_db
        run: |
          supabase db start
          supabase --version

      - name: Verify & Reset Local Migration Chain (001 to 20260902)
        run: |
          # Apply full local migration chain from 001 to 20260902 without seed data
          supabase db reset --local --no-seed
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== VERIFYING LOCAL APPLIED MIGRATION COUNT ==="
          psql "$DB_URL" -c "SELECT count(*) FROM supabase_migrations.schema_migrations;"
          psql "$DB_URL" -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version DESC LIMIT 3;"

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg ts-node typescript --no-save

      - name: Run Static SQL Security & Contract Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING STATIC INTEGRITY SUITE ==="
          psql "$DB_URL" -f supabase/tests/p2a_tenant_provisioning_static_test.sql

      - name: Run Sequential DB Integration & RLS Privacy Matrix Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING SEQUENTIAL PROVISIONING INTEGRATION & RLS PRIVACY MATRIX SUITE ==="
          psql "$DB_URL" -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql

      - name: Run Multi-Session Real DB Concurrency Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx ts-node supabase/tests/p2a_concurrency_harness.ts

      - name: Stop Disposable Local Database Stack
        if: always()
        run: |
          supabase db stop || supabase stop --no-backup
