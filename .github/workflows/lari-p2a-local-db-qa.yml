name: LARI P2A Isolated Local DB QA & Migration Verification

on:
  push:
    branches:
      - feature/p2a-commercial-core-foundation
  pull_request:
    branches:
      - feature/p2a-commercial-core-foundation

jobs:
  p2a-local-db-qa:
    name: Disposable Supabase DB Full-Chain QA & Provisioning Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          docker --version
          docker info

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Start Disposable Local Supabase Stack (Debug Mode)
        id: start_supabase
        run: |
          supabase start --debug

      - name: Diagnostic Collector on Startup Failure
        if: failure() && steps.start_supabase.outcome == 'failure'
        run: |
          echo "=== DISPOSABLE SUPABASE STARTUP DIAGNOSTIC REPORT ==="
          docker ps -a
          echo "=== DOCKER LOGS (CONTAINER STATES) ==="
          docker logs $(docker ps -a -q | head -n 5) || true

      - name: Reset & Execute Full Migration Chain (001 to 20260902)
        run: |
          supabase db reset --local --no-seed

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg ts-node typescript --no-save

      - name: Run Static SQL Security & Contract Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING STATIC INTEGRITY SUITE ==="
          psql "$DB_URL" -f supabase/tests/p2a_tenant_provisioning_static_test.sql

      - name: Run Sequential DB Integration Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING SEQUENTIAL PROVISIONING INTEGRATION MATRIX SUITE ==="
          psql "$DB_URL" -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql

      - name: Run Multi-Session Real DB Concurrency Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx ts-node supabase/tests/p2a_concurrency_harness.ts

      - name: Stop Local Supabase Stack
        if: always()
        run: |
          supabase stop --no-backup
