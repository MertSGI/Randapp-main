name: LARI P2A Isolated Local DB QA & Migration Verification

on:
  push:
    branches:
      - feature/p2a-commercial-core-foundation
      - ci/package-branch-authority-exact-sha-20260820
  pull_request:
    branches:
      - feature/p2a-commercial-core-foundation

jobs:
  p2a-local-db-qa:
    name: Disposable Direct Supabase Postgres QA & Provisioning Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Product SHA & Verify Exact Binding
        run: |
          REQUESTED_PRODUCT_SHA="2da11ca812391f7144e4e3c3acfc60c33bc4db45"
          git checkout "${REQUESTED_PRODUCT_SHA}"
          ACTUAL_TEST_WORKTREE_SHA=$(git rev-parse HEAD)
          echo "REQUESTED_PRODUCT_SHA = ${REQUESTED_PRODUCT_SHA}"
          echo "ACTUAL_TEST_WORKTREE_SHA = ${ACTUAL_TEST_WORKTREE_SHA}"
          if [ "${REQUESTED_PRODUCT_SHA}" != "${ACTUAL_TEST_WORKTREE_SHA}" ]; then
            echo "❌ SHA Mismatch! Requested product SHA does not match actual test worktree HEAD."
            exit 1
          fi
          echo "✅ Product SHA Binding Verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight Docker & Environment Check
        run: |
          docker --version
          docker info

      - name: Start Pinned Supabase Postgres Container Directly
        id: start_direct_db
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres container: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker run -d \
            --name lari-p2a-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Direct Postgres Custom Readiness Check
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Waiting for direct Postgres readiness on 127.0.0.1:54322..."
          for i in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres; then
              echo "Postgres container is ready!"
              break
            fi
            sleep 1
          done
          psql "$DB_URL" -c "SELECT version();"

      - name: Pre-Bootstrap Raw Container Inspection
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== PRE-BOOTSTRAP RAW CONTAINER INSPECTION ==="
          psql "$DB_URL" -c "SELECT rolname FROM pg_roles WHERE rolname IN ('anon', 'authenticated', 'service_role');"
          psql "$DB_URL" -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'auth';"

      - name: Execute Disposable Test Compatibility Bootstrap Fixture
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING TEST COMPATIBILITY BOOTSTRAP FIXTURE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/p2a_managed_runtime_bootstrap.sql
          echo "Compatibility bootstrap completed."

      - name: Build Migration Manifest & Apply Full SQL Migration Chain
        id: apply_migrations
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== BUILDING ORDERED MIGRATION MANIFEST ==="
          mapfile -t MIGRATIONS < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          echo "Migration file count: ${#MIGRATIONS[@]}"
          echo "First migration: ${MIGRATIONS[0]}"
          echo "Last migration: ${MIGRATIONS[-1]}"
          echo "=== MIGRATION MANIFEST FILES ==="
          printf '%s\n' "${MIGRATIONS[@]}"
          APPLIED_COUNT=0
          ORDINAL=1
          rm -f /tmp/p2a-applied-migrations.txt /tmp/p2a-failure-summary.txt /tmp/p2a-migration-*.log
          for migration in "${MIGRATIONS[@]}"; do
            if [ "${migration}" = "20260813_h1c_commercial_eligibility_and_quota_enforcement.sql" ]; then
              echo "=== HISTORICAL REPLAY COMPATIBILITY BRIDGE ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/fixtures/p2a_historical_replay_bridge_before_migration_38.sql"
            fi
            echo "=== APPLYING [${ORDINAL}/${#MIGRATIONS[@]}] ${migration} ==="
            if ! psql "$DB_URL" \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${migration}" \
              2>&1 | tee "/tmp/p2a-migration-${ORDINAL}.log"; then

              echo "FAILED_MIGRATION_ORDINAL=${ORDINAL}" \
                | tee /tmp/p2a-failure-summary.txt

              echo "FAILED_MIGRATION_FILENAME=${migration}" \
                | tee -a /tmp/p2a-failure-summary.txt

              echo "SUCCESSFULLY_APPLIED_COUNT_BEFORE_FAILURE=${APPLIED_COUNT}" \
                | tee -a /tmp/p2a-failure-summary.txt

              if [ -f /tmp/p2a-applied-migrations.txt ]; then
                echo "LAST_10_SUCCESSFUL_MIGRATIONS:" | tee -a /tmp/p2a-failure-summary.txt
                tail -n 10 /tmp/p2a-applied-migrations.txt | tee -a /tmp/p2a-failure-summary.txt
              fi

              echo "=== LAST 80 LINES OF FAILED MIGRATION LOG ===" | tee -a /tmp/p2a-failure-summary.txt
              tail -n 80 "/tmp/p2a-migration-${ORDINAL}.log" \
                | tee -a /tmp/p2a-failure-summary.txt

              cat /tmp/p2a-failure-summary.txt >> "$GITHUB_STEP_SUMMARY"

              exit 1
            fi
            echo "ordinal=${ORDINAL} filename=${migration}" >> /tmp/p2a-applied-migrations.txt
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            ORDINAL=$((ORDINAL + 1))
          done
          echo "Successfully applied ${APPLIED_COUNT} migration files."

      - name: Detailed Failure Diagnostic Dump
        if: failure() && steps.apply_migrations.outcome == 'failure'
        run: |
          echo "=== DIAGNOSTIC DUMP ON MIGRATION FAILURE ==="
          docker logs lari-p2a-postgres --tail 100 || true

      - name: Upload Migration Failure Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-migration-failure-diagnostics
          path: |
            /tmp/p2a-failure-summary.txt
            /tmp/p2a-applied-migrations.txt
            /tmp/p2a-migration-*.log
          if-no-files-found: ignore

      - name: Verify P2A Schema Post-Proof
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== VERIFYING P2A SCHEMA POST-PROOF ==="
          psql "$DB_URL" -c "SELECT proname FROM pg_proc WHERE proname IN ('provision_tenant_for_authenticated_owner', 'approve_and_publish_tenant', 'create_tenant_branch');"
          psql "$DB_URL" -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('tenant_provisioning_idempotency', 'tenants', 'subscriptions', 'tenant_onboarding_progress', 'branches');"

      - name: Install DB Test Dependencies
        run: |
          npm install pg @types/pg tsx ts-node typescript --no-save

      - name: Run Static SQL Security & Contract Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING STATIC INTEGRITY SUITE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_static_test.sql

      - name: Run Sequential DB Integration & RLS Privacy Matrix Suite
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING SEQUENTIAL PROVISIONING INTEGRATION & RLS PRIVACY MATRIX SUITE ==="
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p2a_tenant_provisioning_integration_tests.sql 2>&1 | tee /tmp/p2a-integration-suite.log; then
            echo "=== INTEGRATION TEST SUITE FAILURE ===" >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 /tmp/p2a-integration-suite.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run Multi-Session Real DB Concurrency Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/p2a_concurrency_harness.ts

      - name: Run Sequential Package Branch Server Authority Functional SQL Suite
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== RUNNING PACKAGE BRANCH FUNCTIONAL SQL SUITE ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/package_branch_server_authority_tests.sql

      - name: Run Package Branch Real Multi-Session Concurrency & RLS Harness
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" npx tsx supabase/tests/package_branch_concurrency_harness.ts

      - name: Run Package Branch Static QA
        run: |
          node scripts/test-package-branch-server-authority.mjs

      - name: Run Branch Booking QA
        run: |
          node scripts/verify-branch-aware-booking.mjs

      - name: Run Frontend Secrets & Data Mode Regression Checks
        run: |
          npm run check:secrets
          npx tsx scripts/test-data-mode-regression.mjs
          npx tsx node_modules/typescript/bin/tsc --noEmit

      - name: Run Frontend Production Build Verification
        run: |
          echo "=== RUNNING PRODUCTION FRONTEND BUILD ==="
          npm run build

      - name: Run Git Diff & Whitespace Check
        run: |
          echo "=== RUNNING GIT DIFF & WHITESPACE CHECK ==="
          git diff --check

      - name: Cleanup Disposable Container
        if: always()
        run: |
          docker logs lari-p2a-postgres || true
          docker rm -f lari-p2a-postgres || true
