name: LARI PG17 Role Restore Qualification

on:
  pull_request:
    branches:
      - staging/supabase-staging-consistency
      - 'review/lari-*'
  push:
    branches:
      - 'review/lari-backup-pristine-restore-*'
      - 'review/lari-b13-*'
      - 'review/lari-b15-*'
      - 'review/lari-*'

permissions:
  contents: read

jobs:
  qualification:
    name: PostgreSQL 17.6 Role & Pristine Restore Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout target revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PostgreSQL 17 client and encryption tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl stop postgresql || true
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age jq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 0. Python role preparation & safe restore error unit tests
        run: PYTHONPATH=. python3 -m unittest discover -v -s tests -p 'test_*.py'

      - name: 1. Verify runner script syntax
        run: |
          bash -n scripts/run-zero-cost-logical-backup.sh
          bash -n scripts/run-zero-cost-quarantine-capture.sh

      - name: 2. Zero-cost backup workflow static & security QA
        run: npm run qa:zero-cost-backup-workflow

      - name: 3. Disposable PG 17.6 Docker role restore qualification
        run: npm run qa:disposable-pg17-role-restore

      - name: 4. Docker isolation negative security tests
        run: npm run test:disposable-pg17-negative

      - name: 5. Disposable PG 17.6 Docker pristine template0 restore & negative QA
        run: npm run qa:disposable-pg17-pristine-restore

      - name: 6. Supabase staging consistency QA
        run: npm run qa:supabase-staging-consistency

      - name: 7. Zero-cost quarantine capture static & security QA
        run: npm run qa:zero-cost-quarantine-capture

      - name: 8. V1 truthful client behavioral acceptance
        run: npm run qa:v1-truthful-client-contracts

      - name: 9. Mandatory P0 recovery hard gate
        run: npm run qa:recovery-hard-gate

      - name: 10. V1 product, auth and secrets regressions
        run: |
          npm run qa:notifications
          npm run qa:all-communication-notifications
          npm run qa:payment-run-modes
          npm run qa:booking-self-service
          npm run qa:auth-isolation
          npm run check:secrets

      - name: 11. Phase A functional acceptance QA
        run: npm run qa:phase-a-functional-acceptance

      - name: 12. Phase B staging source readiness QA
        run: npm run qa:phase-b-staging-source-readiness

      - name: 13. Phase C payment mode safety & cryptography QA
        run: |
          npm run qa:payment-mode-safety
          npm run qa:payment-security
          npm run qa:iyzico-webhook-cryptography
          npm run qa:subscription-lifecycle-integrity

      - name: 14. Phase D routing & subdomain rehearsal QA
        run: npm run qa:phase-d-routing-rehearsal

      - name: 15. V1 build
        run: npm run build
