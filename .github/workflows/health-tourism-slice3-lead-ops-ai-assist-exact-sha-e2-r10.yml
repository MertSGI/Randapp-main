          set_result "PROVENANCE_HARDCODED_EXECUTABLE_PASS_COUNT" "${HARDCODED_COUNT}"

          # SET MANIFEST SELF-EXCLUDED FLAG TO YES IN RESULTS.ENV BEFORE FINAL VALIDATION AND HASHING!
          set_result "ARTIFACT_SHA256_MANIFEST_SELF_EXCLUDED" "YES"

          get_val() {
            grep -E "^${1}=" /tmp/e2-logs/results.env | cut -d'=' -f2- || echo "MISSING"
          }

          MISMATCHES=0

          check_exact() {
            k="$1"; expected="$2"
            actual=$(get_val "$k")
            if [ "${actual}" != "${expected}" ]; then
              echo "MANDATORY_KEY_MISMATCH: key=${k} expected=${expected} actual=${actual}"
              MISMATCHES=$((MISMATCHES + 1))
            fi
          }

          check_exact "EXPECTED_PRODUCT_SHA" "4b720dfb702c2f391251c70c0377189df501de28"
          check_exact "REQUESTED_PRODUCT_SHA" "4b720dfb702c2f391251c70c0377189df501de28"
          check_exact "ACTUAL_TEST_WORKTREE_SHA" "4b720dfb702c2f391251c70c0377189df501de28"
          check_exact "POST_TEST_PRODUCT_SHA" "4b720dfb702c2f391251c70c0377189df501de28"
          check_exact "EXPECTED_EVIDENCE_BRANCH" "ci/health-tourism-slice3-lead-ops-ai-assist-exact-sha-r10-20260829"
          check_exact "EXPECTED_EVIDENCE_FILE" ".github/workflows/health-tourism-slice3-lead-ops-ai-assist-exact-sha-e2-r10.yml"
          check_exact "ACTUAL_EVIDENCE_FILE" ".github/workflows/health-tourism-slice3-lead-ops-ai-assist-exact-sha-e2-r10.yml"
          check_exact "EVIDENCE_BRANCH_FILE_CHANGE_COUNT" "1"
          check_exact "EVIDENCE_PRODUCT_FILE_CHANGE_COUNT" "0"
          check_exact "EVIDENCE_BRANCH_CONTAINMENT_RESULT" "PASS"
          check_exact "EVIDENCE_SHA_GITHUB_SHA_MATCH" "YES"
          check_exact "EXACT_SHA_BINDING_RESULT" "PASS"
          check_exact "NPM_CI_RESULT" "PASS"
          check_exact "REGRESSION_MATRIX_RESULT" "PASS"
          check_exact "LINT_RESULT" "PASS"
          check_exact "TSC_RESULT" "PASS"
          check_exact "BUILD_RESULT" "PASS"
          check_exact "SECRET_SCAN_RESULT" "PASS"
          check_exact "HEALTH_TOURISM_STATIC_QA_RESULT" "PASS"
          check_exact "SLICE2_QA_RESULT" "PASS"
          check_exact "SLICE3_QA_RESULT" "PASS"
          check_exact "EDGE_DENO_CHECK_RESULT" "PASS"
          check_exact "SLUG_REGRESSION_RESULT" "PASS"
          check_exact "PUBLIC_BOOKING_REGRESSION_RESULT" "PASS"
          check_exact "ROUTE_LINK_REGRESSION_RESULT" "PASS"
          check_exact "COMMERCIAL_SOURCE_OF_TRUTH_RESULT" "PASS"
          check_exact "COMMERCIAL_PACKAGING_RESULT" "PASS"
          check_exact "ENTITLEMENTS_RESULT" "PASS"
          check_exact "CLINIC_DOMAIN_REGRESSION_RESULT" "PASS"
          check_exact "CLINIC_AI_REGRESSION_RESULT" "PASS"
          check_exact "DOCKER_PREFLIGHT_RESULT" "PASS"
          check_exact "P2A_MANAGED_RUNTIME_BOOTSTRAP_RESULT" "PASS"
          check_exact "CANONICAL_MIGRATION_COUNT" "67"
          check_exact "APPLIED_MIGRATION_COUNT" "67"
          check_exact "FULL_MIGRATION_REPLAY_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_INITIAL_STATE" "O"
          check_exact "STAFF_QUOTA_TRIGGER_ALIGNMENT_STATE" "D"
          check_exact "FOUNDATION_DB_RESULT" "PASS"
          check_exact "PGTAP_EXTENSION_RESULT" "PASS"
          check_exact "PGTAP_SOURCE_CONTRACT_MATCH" "PASS"
          check_exact "PGTAP_PLAN_PARSER_SELFTEST_RESULT" "PASS"
          check_exact "PGTAP_ZERO_COUNT_PARSER_SELFTEST_RESULT" "PASS"
          check_exact "PGTAP_PARSER_SCALAR_SELFTEST_RESULT" "PASS"
          check_exact "PGTAP_NUMERIC_SCALAR_VALIDATION_RESULT" "PASS"
          check_exact "HT_SQL_TEST_EXECUTED" "YES"
          check_exact "HT_SQL_TEST_PROCESS_EXIT_CODE" "0"
          check_exact "PGTAP_RUNTIME_PLAN_COUNT" "40"
          check_exact "PGTAP_COMPLETED_COUNT" "40"
          check_exact "PGTAP_OK_COUNT" "40"
          check_exact "PGTAP_NOT_OK_COUNT" "0"
          check_exact "PGTAP_PLAN_MISMATCH_COUNT" "0"
          check_exact "NAMED_BEHAVIORAL_PROOF_REQUIRED_COUNT" "18"
          check_exact "NAMED_BEHAVIORAL_PROOF_OK_COUNT" "18"
          check_exact "NAMED_BEHAVIORAL_PROOF_RESULT" "PASS"
          check_exact "HEALTH_TOURISM_SQL_BEHAVIORAL_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_RESTORE_RESULT" "PASS"
          check_exact "STAFF_QUOTA_TRIGGER_FINAL_STATE" "O"
          check_exact "PRODUCT_SHA_PRESERVATION_RESULT" "PASS"
          check_exact "POST_TEST_TRACKED_PRODUCT_MUTATION_COUNT" "0"
          check_exact "PROVENANCE_HARDCODED_EXECUTABLE_PASS_COUNT" "0"
          check_exact "PROVENANCE_EVIDENCE_SHA_MATCHES_REMOTE_EVIDENCE_SHA" "YES"
          check_exact "ARTIFACT_SHA256_MANIFEST_SELF_EXCLUDED" "YES"

          if [ "${MISMATCHES}" -eq 0 ]; then
            FINAL_STATE="HEALTH_TOURISM_SLICE3_E2_R10_CANDIDATE_READY_FOR_CONTROLLER_REVIEW"
            EVIDENCE_LEVEL="E2_EXECUTABLE_CANDIDATE"
          else
            FINAL_STATE="HEALTH_TOURISM_SLICE3_E2_R10_EXECUTION_FAILED_OR_INCOMPLETE"
            EVIDENCE_LEVEL="E1_SOURCE_PROVEN_CANDIDATE"
          fi

          set_result "FINAL_STATE" "${FINAL_STATE}"
          set_result "EVIDENCE_CANDIDATE_LEVEL" "${EVIDENCE_LEVEL}"

          # Copy final results.env to provenance.txt and verify exact identity BEFORE hashing!
          cp /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt
          cmp -s /tmp/e2-logs/results.env /tmp/e2-logs/provenance.txt

          cat << EOF > /tmp/e2-logs/e2-summary.txt
          FINAL_STATE=${FINAL_STATE}
          EVIDENCE_CANDIDATE_LEVEL=${EVIDENCE_LEVEL}
          FROZEN_PRODUCT_SHA=4b720dfb702c2f391251c70c0377189df501de28
          EVIDENCE_SHA=${ACTUAL_EV_SHA}
          EOF

          # Generate SHA256SUMS.txt LAST while excluding SHA256SUMS.txt itself. ZERO writes to payload files afterward!
          cd /tmp/e2-logs
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt

          # Verify SHA256SUMS manifest immediately
          sha256sum -c SHA256SUMS.txt
          echo "ARTIFACT_SHA256_FULL_VERIFICATION=PASS"

          if [ "${MISMATCHES}" -ne 0 ]; then
            echo "ERROR: Evidence provenance contract failed with ${MISMATCHES} mismatches!"
            exit 1
          fi

      - name: Upload E2 Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-tourism-slice3-lead-ops-ai-assist-exact-sha-e2-r10-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Postgres Container
        if: always()
        run: |
          CONTAINER_NAME="lari-ht-slice3-e2-r10-${GITHUB_RUN_ID}"
          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true


