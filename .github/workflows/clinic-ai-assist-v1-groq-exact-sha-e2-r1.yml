name: LARI Clinic AI Assist V1 Groq Primary Exact-SHA E2 Executable CI Evidence Gate (R1)

on:
  push:
    branches:
      - ci/clinic-ai-assist-v1-groq-exact-sha-r1-20260825
  workflow_dispatch:

jobs:
  clinic-ai-assist-v1-groq-e2-r1:
    name: Clinic AI Assist V1 Groq Exact-SHA E2 Gate (R1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Evidence Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Evidence Branch Lineage & Exact Product SHA Binding
        id: verify_binding
        run: |
          EVIDENCE_SHA=$(git rev-parse HEAD)
          EXPECTED_PRODUCT_SHA="31fe0fd0ecdfee4fc2d166c9239e3fa114cff328"
          echo "EVIDENCE_SHA=${EVIDENCE_SHA}" >> $GITHUB_ENV
          echo "EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA}" >> $GITHUB_ENV

          echo "=== VERIFYING EVIDENCE BRANCH LINEAGE ==="
          DIFF_FILES=$(git diff ${EXPECTED_PRODUCT_SHA}..${EVIDENCE_SHA} --name-only)
          echo "Changed files between Product SHA and Evidence SHA:"
          echo "${DIFF_FILES}"

          for f in ${DIFF_FILES}; do
            if [ "$f" != ".github/workflows/clinic-ai-assist-v1-groq-exact-sha-e2-r1.yml" ]; then
              echo "FAIL: Unauthorized file change in evidence branch: $f"
              exit 1
            fi
          done

          echo "=== CHECKING OUT FROZEN PRODUCT SHA ==="
          git checkout "${EXPECTED_PRODUCT_SHA}"
          ACTUAL_PRODUCT_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_PRODUCT_SHA=${ACTUAL_PRODUCT_SHA}" >> $GITHUB_ENV

          if [ "${ACTUAL_PRODUCT_SHA}" != "${EXPECTED_PRODUCT_SHA}" ]; then
            echo "EXACT_SHA_BINDING_RESULT=FAIL"
            exit 1
          fi

          echo "EXACT_SHA_BINDING_RESULT=PASS" >> $GITHUB_ENV
          mkdir -p /tmp/e2-logs

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pinned Deno CLI
        uses: deno-land/setup-deno@v1
        with:
          deno-version: v1.40.5

      - name: Execute Deno Edge Function Compile Checks
        run: |
          set -o pipefail
          echo "=== EXECUTING DENO CHECK FOR TRANSCRIBE EDGE FUNCTION ==="
          deno check supabase/functions/clinic-ai-transcribe/index.ts 2>&1 | tee /tmp/e2-logs/deno-edge-transcribe.log
          echo "DENO_CHECK_TRANSCRIBE=PASS" >> $GITHUB_ENV

          echo "=== EXECUTING DENO CHECK FOR DRAFT EDGE FUNCTION ==="
          deno check supabase/functions/clinic-ai-draft/index.ts 2>&1 | tee /tmp/e2-logs/deno-edge-draft.log
          echo "DENO_CHECK_DRAFT=PASS" >> $GITHUB_ENV
          echo "PINNED_DENO_VERSION=v1.40.5" >> $GITHUB_ENV

      - name: Install Exact Product Dependencies
        run: |
          npm ci

      - name: Verify Exact Product Package Dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.devDependencies || !pkg.devDependencies.pg) {
              console.error('PG_RESOLUTION=FAIL');
              process.exit(1);
            }
            if (!pkg.devDependencies || !pkg.devDependencies.tsx) {
              console.error('TSX_RESOLUTION=FAIL');
              process.exit(1);
            }
            console.log('PG_RESOLUTION=PASS');
            console.log('TSX_RESOLUTION=PASS');
          "

      - name: Docker Preflight Check
        run: |
          docker --version
          docker info

      - name: Start Pinned Supabase Postgres Container
        run: |
          PINNED_IMAGE="supabase/postgres:15.1.0.147"
          echo "Pulling pinned Supabase Postgres image: ${PINNED_IMAGE}"
          docker pull "${PINNED_IMAGE}"
          docker rm -f lari-clinic-ai-postgres || true
          docker run -d \
            --name lari-clinic-ai-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 54322:5432 \
            "${PINNED_IMAGE}"

      - name: Wait for Postgres Readiness & Install Client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          
          echo "Waiting for PostgreSQL server at 127.0.0.1:54322..."
          READY=0
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "PostgreSQL did not become ready in time"
            exit 1
          fi

      - name: Replay All 65 Migrations Sequentially
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          mkdir -p /tmp/e2-logs

          MIGRATION_COUNT=0
          LATEST_MIGRATION=""

          echo "=== REPLAYING ALL MIGRATIONS ==="
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying migration: ${file}..."
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a /tmp/e2-logs/migration-replay.log
            MIGRATION_COUNT=$((MIGRATION_COUNT + 1))
            LATEST_MIGRATION=$(basename "$file")
          done

          echo "CI_MIGRATION_REPLAY_COUNT=${MIGRATION_COUNT}" >> $GITHUB_ENV
          echo "CI_LATEST_MIGRATION=${LATEST_MIGRATION}" >> $GITHUB_ENV

          if [ "$MIGRATION_COUNT" -ne 65 ]; then
            echo "FAIL: Migration count mismatch. Expected 65, got ${MIGRATION_COUNT}"
            exit 1
          fi

          echo "FULL_MIGRATION_REPLAY_RESULT=PASS" >> $GITHUB_ENV

      - name: Prove Migration 65 RPC Catalog Contract & Permissions
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT p.proname, p.pronargs, pg_get_function_identity_arguments(p.oid) AS args
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'clinic_check_and_consume_ai_allowance';
          " 2>&1 | tee /tmp/e2-logs/migration65-catalog.log

          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/e2-logs/migration65-catalog.log', 'utf8');
            
            if (!log.includes('clinic_check_and_consume_ai_allowance |        0 |')) {
              console.error('FAIL: 0-argument signature not found'); process.exit(1);
            }
            if (log.includes('p_tenant_id')) {
              console.error('FAIL: Legacy parameterized signature still exists'); process.exit(1);
            }
            console.log('MIGRATION65_CATALOG_CHECK=PASS');
          "

          echo "MIGRATION65_ZERO_ARG_RPC_RESULT=PASS" >> $GITHUB_ENV
          echo "MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT=PASS" >> $GITHUB_ENV

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT has_function_privilege('anon', 'public.clinic_check_and_consume_ai_allowance()', 'EXECUTE') AS anon_can_execute,
                   has_function_privilege('authenticated', 'public.clinic_check_and_consume_ai_allowance()', 'EXECUTE') AS auth_can_execute;
          " 2>&1 | tee -a /tmp/e2-logs/migration65-catalog.log

          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/e2-logs/migration65-catalog.log', 'utf8');
            if (!log.includes('f                | t')) {
              console.error('FAIL: Execution permissions incorrect (anon must be f, authenticated must be t)');
              process.exit(1);
            }
            console.log('MIGRATION65_PERMISSIONS_CHECK=PASS');
          "

          echo "MIGRATION65_ANON_EXECUTE_RESULT=PASS" >> $GITHUB_ENV
          echo "MIGRATION65_AUTHENTICATED_EXECUTE_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Clinic AI Commercial Authority SQL Suite
        run: |
          set -o pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          echo "=== DISABLING STAFF TRIGGER FOR TEST FIXTURE SETUP ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.staff DISABLE TRIGGER trg_enforce_staff_quota;"

          echo "=== EXECUTING CLINIC AI COMMERCIAL AUTHORITY SQL SUITE ==="
          SUITE_EXIT=0
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_ai_assist_commercial_authority_tests.sql 2>&1 | tee /tmp/e2-logs/clinic-ai-commercial-sql.log || SUITE_EXIT=$?

          echo "=== RE-ENABLING STAFF TRIGGER & VERIFYING CLEANUP ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.staff ENABLE TRIGGER trg_enforce_staff_quota;"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT relname, relrowsecurity FROM pg_class WHERE relname = 'usage_counters';
          " | grep -q "usage_counters | t"
          
          if [ $? -eq 0 ]; then
            echo "USAGE_COUNTERS_RLS_ENABLED=YES"
          else
            echo "FAIL: usage_counters RLS not restored"
            exit 1
          fi

          if [ $SUITE_EXIT -ne 0 ]; then
            echo "=== CLINIC AI COMMERCIAL SQL SUITE FAILURE LOG ==="
            cat /tmp/e2-logs/clinic-ai-commercial-sql.log
            echo "### CLINIC AI COMMERCIAL SQL SUITE FAILURE LOG" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/e2-logs/clinic-ai-commercial-sql.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $SUITE_EXIT
          fi

          grep "ALL 25 EXECUTABLE CLINIC AI ASSIST COMMERCIAL AUTHORITY TESTS PASSED" /tmp/e2-logs/clinic-ai-commercial-sql.log
          grep "CASE 25 PASS" /tmp/e2-logs/clinic-ai-commercial-sql.log

          echo "CLINIC_AI_COMMERCIAL_SQL_CASE_COUNT=25" >> $GITHUB_ENV
          echo "CLINIC_AI_COMMERCIAL_SQL_RESULT=PASS" >> $GITHUB_ENV
          echo "POST_ROLLBACK_RESIDUE_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Real Quota Concurrency Harness
        run: |
          set -o pipefail
          echo "=== EXECUTING REAL QUOTA CONCURRENCY HARNESS ==="

          PGHOST=127.0.0.1 \
          PGPORT=54322 \
          PGDATABASE=postgres \
          PGUSER=postgres \
          PGPASSWORD=postgres \
          npm run qa:clinic-ai-assist-quota-concurrency 2>&1 | tee /tmp/e2-logs/clinic-ai-quota-concurrency.log

          if grep -q "NOT_EXECUTED_NO_LOCAL_DB" /tmp/e2-logs/clinic-ai-quota-concurrency.log; then
            echo "FAIL: Concurrency runner reported NOT_EXECUTED_NO_LOCAL_DB in CI"
            exit 1
          fi

          grep "AUTH_UID_CLIENT_1=a7777777-7777-4777-7777-777777777701" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "AUTH_UID_CLIENT_2=a7777777-7777-4777-7777-777777777701" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "SUCCESS_COUNT=1" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "AI_QUOTA_EXHAUSTED_COUNT=1" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "FINAL_USAGE_COUNT=5" /tmp/e2-logs/clinic-ai-quota-concurrency.log
          grep "CONCURRENCY_FIXTURE_RESIDUE_COUNT=0" /tmp/e2-logs/clinic-ai-quota-concurrency.log

          echo "CONCURRENCY_AUTH_CONTEXT_RESULT=PASS" >> $GITHUB_ENV
          echo "CONCURRENCY_SUCCESS_COUNT=1" >> $GITHUB_ENV
          echo "CONCURRENCY_QUOTA_EXHAUSTED_COUNT=1" >> $GITHUB_ENV
          echo "CONCURRENCY_FINAL_USAGE_COUNT=5" >> $GITHUB_ENV
          echo "CONCURRENCY_FIXTURE_RESIDUE_COUNT=0" >> $GITHUB_ENV
          echo "REAL_TWO_CONNECTION_CONCURRENCY_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Multi-Provider Behavioral Suite
        run: |
          set -o pipefail
          echo "=== EXECUTING MULTI-PROVIDER BEHAVIORAL SUITE ==="
          npm run qa:clinic-ai-assist 2>&1 | tee /tmp/e2-logs/multi-provider-behavioral.log
          echo "MULTI_PROVIDER_BEHAVIORAL_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Clinic & Commercial SQL Regressions
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "=== EXECUTING CLINIC DOMAIN SERVER AUTHORITY TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_domain_server_authority_tests.sql

          echo "=== EXECUTING CLINIC OPERATIONAL INTEGRATION TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_operational_integration_tests.sql

          echo "=== EXECUTING CLINIC WORKSPACE AUTHORITY HARDENING TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/clinic_workspace_authority_hardening_tests.sql

          echo "=== EXECUTING COMMERCIAL LIFECYCLE ELIGIBILITY ALIGNMENT TESTS ==="
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/commercial_lifecycle_eligibility_alignment_tests.sql 2>&1 | tee /tmp/e2-logs/clinic-regression.log

          echo "CLINIC_REGRESSION_RESULT=PASS" >> $GITHUB_ENV
          echo "COMMERCIAL_REGRESSION_RESULT=PASS" >> $GITHUB_ENV

      - name: Execute Application & Static Regressions
        run: |
          set -o pipefail
          echo "=== RUNNING QA APPLICATION SUITES ==="
          npm run qa:clinic-workspace
          npm run qa:clinic-workspace-static
          npm run qa:clinic-application-contracts
          npm run qa:clinic-domain
          npm run qa:clinic-operational
          npm run qa:commercial-source-of-truth
          npm run qa:commercial-eligibility-enforcement
          npm run qa:commercial-security
          echo "APPLICATION_QA_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING LINT ==="
          npm run lint
          echo "FRONTEND_TSC_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING BUILD ==="
          npm run build
          echo "BUILD_RESULT=PASS" >> $GITHUB_ENV

          echo "=== RUNNING SECRET SCAN ==="
          npm run check:secrets
          echo "SECRET_SCAN_RESULT=PASS" >> $GITHUB_ENV

      - name: Verify AI Safety Contracts
        run: |
          node -e "
            const fs = require('fs');
            const service = fs.readFileSync('services/clinicAiAssistService.ts', 'utf8');
            const panel = fs.readFileSync('components/clinic/ClinicAiAssistPanel.tsx', 'utf8');
            const edgeTranscribe = fs.readFileSync('supabase/functions/clinic-ai-transcribe/index.ts', 'utf8');
            const edgeDraft = fs.readFileSync('supabase/functions/clinic-ai-draft/index.ts', 'utf8');

            if (service.includes('saveClinicEncounterNote') || panel.includes('saveClinicEncounterNote')) {
              console.error('AI_DIRECT_NOTE_SAVE_CALL_COUNT > 0'); process.exit(1);
            }
            if (service.includes('completeClinicEncounter') || panel.includes('completeClinicEncounter')) {
              console.error('AI_DIRECT_ENCOUNTER_COMPLETE_CALL_COUNT > 0'); process.exit(1);
            }
            if (service.includes('localStorage') || panel.includes('localStorage') ||
                service.includes('sessionStorage') || panel.includes('sessionStorage') ||
                service.includes('indexedDB') || panel.includes('indexedDB')) {
              console.error('PERSISTENCE DETECTED'); process.exit(1);
            }
            if (edgeTranscribe.includes('SUPABASE_SERVICE_ROLE_KEY') || edgeDraft.includes('SUPABASE_SERVICE_ROLE_KEY')) {
              console.error('USER_CONTEXT_SERVICE_ROLE_FALLBACK > 0'); process.exit(1);
            }

            console.log('AI_DIRECT_NOTE_SAVE_CALL_COUNT=0');
            console.log('AI_DIRECT_ENCOUNTER_COMPLETE_CALL_COUNT=0');
            console.log('USE_DRAFT_CLINICAL_WRITE_COUNT=0');
            console.log('REJECT_DRAFT_CLINICAL_WRITE_COUNT=0');
            console.log('RAW_AUDIO_PERSISTENCE=NONE');
            console.log('TRANSCRIPT_PERSISTENCE=NONE');
            console.log('AI_DRAFT_PERSISTENCE=NONE');
            console.log('USER_CONTEXT_SERVICE_ROLE_FALLBACK_COUNT=0');
          "

      - name: Build E2 Summary Text
        if: always()
        run: |
          mkdir -p /tmp/e2-logs
          
          if [ "${EXACT_SHA_BINDING_RESULT}" = "PASS" ] && \
             [ "${DENO_CHECK_TRANSCRIBE}" = "PASS" ] && \
             [ "${DENO_CHECK_DRAFT}" = "PASS" ] && \
             [ "${FULL_MIGRATION_REPLAY_RESULT}" = "PASS" ] && \
             [ "${MIGRATION65_ZERO_ARG_RPC_RESULT}" = "PASS" ] && \
             [ "${MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT}" = "PASS" ] && \
             [ "${MIGRATION65_ANON_EXECUTE_RESULT}" = "PASS" ] && \
             [ "${MIGRATION65_AUTHENTICATED_EXECUTE_RESULT}" = "PASS" ] && \
             [ "${CLINIC_AI_COMMERCIAL_SQL_RESULT}" = "PASS" ] && \
             [ "${REAL_TWO_CONNECTION_CONCURRENCY_RESULT}" = "PASS" ] && \
             [ "${MULTI_PROVIDER_BEHAVIORAL_RESULT}" = "PASS" ] && \
             [ "${CLINIC_REGRESSION_RESULT}" = "PASS" ] && \
             [ "${COMMERCIAL_REGRESSION_RESULT}" = "PASS" ] && \
             [ "${APPLICATION_QA_RESULT}" = "PASS" ] && \
             [ "${FRONTEND_TSC_RESULT}" = "PASS" ] && \
             [ "${BUILD_RESULT}" = "PASS" ] && \
             [ "${SECRET_SCAN_RESULT}" = "PASS" ]; then
            FINAL_STATE="CLINIC_AI_ASSIST_V1_GROQ_E2_CANDIDATE_READY_FOR_CONTROLLER_REVIEW"
          else
            FINAL_STATE="CLINIC_AI_ASSIST_V1_GROQ_E2_EXECUTION_FAILED"
          fi

          cat << EOF > /tmp/e2-logs/e2-summary.txt
          === CLINIC AI ASSIST V1 GROQ PRIMARY EXACT-SHA E2 EXECUTABLE EVIDENCE SUMMARY ===
          EXPECTED_PRODUCT_SHA=${EXPECTED_PRODUCT_SHA:-NOT_EXECUTED}
          ACTUAL_PRODUCT_SHA=${ACTUAL_PRODUCT_SHA:-NOT_EXECUTED}
          EXACT_SHA_BINDING_RESULT=${EXACT_SHA_BINDING_RESULT:-NOT_EXECUTED}

          EVIDENCE_SHA=${EVIDENCE_SHA:-NOT_EXECUTED}

          PINNED_DENO_VERSION=${PINNED_DENO_VERSION:-NOT_EXECUTED}
          DENO_CHECK_TRANSCRIBE=${DENO_CHECK_TRANSCRIBE:-NOT_EXECUTED}
          DENO_CHECK_DRAFT=${DENO_CHECK_DRAFT:-NOT_EXECUTED}

          CI_MIGRATION_REPLAY_COUNT=${CI_MIGRATION_REPLAY_COUNT:-NOT_EXECUTED}
          CI_LATEST_MIGRATION=${CI_LATEST_MIGRATION:-NOT_EXECUTED}
          FULL_MIGRATION_REPLAY_RESULT=${FULL_MIGRATION_REPLAY_RESULT:-NOT_EXECUTED}

          MIGRATION65_ZERO_ARG_RPC_RESULT=${MIGRATION65_ZERO_ARG_RPC_RESULT:-NOT_EXECUTED}
          MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT=${MIGRATION65_LEGACY_SIGNATURE_ABSENT_RESULT:-NOT_EXECUTED}
          MIGRATION65_ANON_EXECUTE_RESULT=${MIGRATION65_ANON_EXECUTE_RESULT:-NOT_EXECUTED}
          MIGRATION65_AUTHENTICATED_EXECUTE_RESULT=${MIGRATION65_AUTHENTICATED_EXECUTE_RESULT:-NOT_EXECUTED}

          CLINIC_AI_COMMERCIAL_SQL_CASE_COUNT=25
          CLINIC_AI_COMMERCIAL_SQL_RESULT=${CLINIC_AI_COMMERCIAL_SQL_RESULT:-NOT_EXECUTED}

          CONCURRENCY_AUTH_CONTEXT_RESULT=${CONCURRENCY_AUTH_CONTEXT_RESULT:-NOT_EXECUTED}
          CONCURRENCY_SUCCESS_COUNT=${CONCURRENCY_SUCCESS_COUNT:-NOT_EXECUTED}
          CONCURRENCY_QUOTA_EXHAUSTED_COUNT=${CONCURRENCY_QUOTA_EXHAUSTED_COUNT:-NOT_EXECUTED}
          CONCURRENCY_FINAL_USAGE_COUNT=${CONCURRENCY_FINAL_USAGE_COUNT:-NOT_EXECUTED}
          CONCURRENCY_FIXTURE_RESIDUE_COUNT=${CONCURRENCY_FIXTURE_RESIDUE_COUNT:-NOT_EXECUTED}
          REAL_TWO_CONNECTION_CONCURRENCY_RESULT=${REAL_TWO_CONNECTION_CONCURRENCY_RESULT:-NOT_EXECUTED}

          MULTI_PROVIDER_BEHAVIORAL_RESULT=${MULTI_PROVIDER_BEHAVIORAL_RESULT:-NOT_EXECUTED}

          CLINIC_REGRESSION_RESULT=${CLINIC_REGRESSION_RESULT:-NOT_EXECUTED}
          COMMERCIAL_REGRESSION_RESULT=${COMMERCIAL_REGRESSION_RESULT:-NOT_EXECUTED}
          APPLICATION_QA_RESULT=${APPLICATION_QA_RESULT:-NOT_EXECUTED}
          FRONTEND_TSC_RESULT=${FRONTEND_TSC_RESULT:-NOT_EXECUTED}
          BUILD_RESULT=${BUILD_RESULT:-NOT_EXECUTED}
          SECRET_SCAN_RESULT=${SECRET_SCAN_RESULT:-NOT_EXECUTED}

          FINAL_STATE=${FINAL_STATE}
          EOF
          cat /tmp/e2-logs/e2-summary.txt

      - name: Upload E2 Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-ai-assist-v1-groq-exact-sha-e2-r1-evidence
          path: /tmp/e2-logs/

      - name: Cleanup Disposable Container
        if: always()
        run: |
          docker logs lari-clinic-ai-postgres || true
          docker rm -f lari-clinic-ai-postgres || true
